# pnpm 12 reads project settings from this file, not from the "pnpm" field in package.json.
packages:
  - '.'

# One KaTeX everywhere: rehype-katex and Mafs pin ^0.16, but 0.18 renamed every CSS
# class, so renderer and stylesheet must come from the same version (tech-stack.md §2).
overrides:
  katex: 0.19.0

minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.12.0'
  - '@astrojs/markdown-remark@7.3.2'
  - '@astrojs/markdown-satteri@0.4.3'
  - '@astrojs/mdx@8.0.3'
  - '@astrojs/react@7.0.1'
  - astro@7.3.6

allowBuilds:
  esbuild: true
  lefthook: true
