name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  check:
    name: Check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # Version is read from the "packageManager" field in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm check

      - name: Lint (eslint + prettier)
        run: pnpm lint

      - name: Color tokens only (STYLE_GUIDE §4)
        run: pnpm exec tsx scripts/check-colors.ts

      - name: Datasets regenerate without diff (STYLE_GUIDE §8)
        run: pnpm check:datasets

      - name: Unit tests
        run: pnpm test

      - name: Build (runs validate:content first)
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: Playwright smoke + screenshots
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Playwright
        # Missing baselines are written (and uploaded) rather than failing; commit them
        # with the update-snapshots workflow.
        run: pnpm test:e2e --update-snapshots=missing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
          retention-days: 3
      - name: Upload snapshot baselines (commit via update-snapshots workflow)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-snapshots
          path: tests/e2e/__snapshots__
          if-no-files-found: ignore
          retention-days: 7
