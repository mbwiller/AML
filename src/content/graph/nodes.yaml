  lesson: components-of-a-learning-problem
  summary: "Input data, output (task and targets), model class, loss function, learning rule: the recipe every supervised problem specifies (L2 p.4)."

- id: data-representation
  label: "Data representation"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: components-of-a-learning-problem
  summary: "Turning raw attributes into numeric features; the choice decides which functions a model class can express."

- id: attribute-types
  label: "Attribute types"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: components-of-a-learning-problem
  summary: "Discrete (ordered), continuous, and categorical (names with no order or spacing) attributes; each calls for a different representation."

- id: integer-codes-impose-spacing
  label: "Numeric codes impose order and spacing"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: components-of-a-learning-problem
  summary: "A linear model on a numeric code c_k predicts f(k') − f(k) = θ_1(c_k' − c_k): equally spaced codes give equally spaced, ordered predictions, even after standardizing."
  derivation: der-1-1-1

- id: dummy-variable-trap
  label: "Dummy-variable trap"
  type: concept
  field: linear-algebra
  unit: u1-linear-regression
  lesson: components-of-a-learning-problem
  summary: "The K one-hot columns sum to the intercept column, so coefficients are not unique; drop one reference category and θ_k becomes f(k) − f(reference)."
  derivation: der-1-1-1

- id: discretization
  label: "Discretization"
  type: method
  field: ml
  unit: u1-linear-regression
  lesson: components-of-a-learning-problem
  summary: "Bin a continuous value and one-hot the bin: a step-function feature map whose least-squares fit is the mean target in each bin."
  derivation: der-1-1-2

- id: feature-engineering
  label: "Feature engineering"
  type: method
  field: ml
  unit: u1-linear-regression
  lesson: components-of-a-learning-problem
  summary: "Designing the feature map φ by hand from domain knowledge, such as D/(6 + D) for an Emax dose-response or an old_man indicator."
  derivation: der-1-1-3

- id: linear-in-parameters
  label: "Linear in θ, not in x"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: components-of-a-learning-problem
  summary: "f_θ(x) = θ^T φ(x) is linear in θ for every feature map φ, so nonlinear relations in x stay inside the linear model class."
  derivation: der-1-1-3

- id: interaction-feature
  label: "Interaction feature"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: components-of-a-learning-problem
  summary: "A product feature such as a·s makes the effect of a depend on s (θ_1 + θ_3 s) while the model stays linear in θ."
  derivation: der-1-1-3

- id: diabetes-dataset
  label: "Diabetes dataset (sklearn)"
  type: dataset
  field: ml
  unit: u1-linear-regression
  lesson: components-of-a-learning-problem
  summary: "442 patients, 10 baseline attributes (each centered and scaled to unit sum of squares), target = disease progression after one year."

# Lesson 1.2: datasets-models-and-model-classes
# Course map L2 pp.13-26 and L3 pp.4, 10-11, 24. The glossary term `design-matrix`
# (new) is a node automatically and is not repeated here.

- id: supervised-dataset
  label: "Supervised dataset"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: datasets-models-and-model-classes
  summary: "D = {(x^(i), y^(i))}, i = 1..n: n training examples, each an input x^(i) in the attribute space X and a target y^(i) in the target space Y."

- id: supervised-task-types
  label: "Task types from the target space"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: datasets-models-and-model-classes
  summary: "The target space decides the task: regression (Y = R), binary, multiclass (one of K), multilabel (any subset of K), structured prediction."

- id: parametric-model
  label: "Parametric model f_θ"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: datasets-models-and-model-classes
  summary: "A model is a function f: X → Y; a parametric model f_θ is indexed by parameters θ in a parameter space Θ, e.g. f_θ(x) = θ_0 + θ_1 x."

- id: model-class
  label: "Model class"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: datasets-models-and-model-classes
  summary: "A set of models M = {f_θ | θ ∈ Θ} ⊆ {f: X → Y} (the hypothesis space). The modeler picks the class; training picks a member."

- id: restricting-model-class
  label: "Why the model class must be restricted"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: datasets-models-and-model-classes
  summary: "An unrestricted class contains perfect fits that predict any value at a new input, so the data say nothing about it. Restricted means a shared shape, not a finite list."

- id: linear-model
  label: "Linear model"
  type: method
  field: ml
  unit: u1-linear-regression
  lesson: datasets-models-and-model-classes
  summary: "f_θ(x) = θ_0 + Σ_j θ_j x_j = θ^T x with the constant feature x_0 = 1, θ ∈ R^(d+1); the model class of linear regression."

- id: vectorized-predictions
  label: "Predictions as Xθ"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: datasets-models-and-model-classes
  summary: "Stacking f_θ(x^(i)) = (x^(i))^T θ over all n examples gives ŷ = Xθ, with rows (x^(i))^T and a column of ones; the residuals are Xθ − y."
  derivation: der-1-2-1

- id: linear-uniform-effects
  label: "Uniform effects (linear models)"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: datasets-models-and-model-classes
  summary: "f_θ(x + Δ) − f_θ(x) = Σ_j θ_j Δ_j for every x: the same input change gives the same output change everywhere; ∂f_θ/∂x_j = θ_j."
  derivation: der-1-2-2

- id: linear-additive-effects
  label: "Independence (no interactions)"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: datasets-models-and-model-classes
  summary: "In a linear model the effect of changing x_j does not depend on any other feature x_k, and a joint change is the sum of single-feature changes."
  derivation: der-1-2-3

- id: linear-monotonicity
  label: "Monotonicity (linear models)"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: datasets-models-and-model-classes
  summary: "Along feature j a linear model moves in the direction of sign(θ_j) at every base point, and without bound: f_θ(x + t e_j) − f_θ(x + s e_j) = (t − s) θ_j."
  derivation: der-1-2-4
# Lesson 1.3: loss-functions
# Course map L2 pp.27-31 and L3 pp.5-9, 19-20, 40. The glossary terms `median` and
# `vector-norm` (new) are nodes automatically and are not repeated here.

- id: per-example-loss
  label: "Per-example loss ℓ(ŷ, y)"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: loss-functions
  summary: "A function ℓ(ŷ, y) ≥ 0 with ℓ(y, y) = 0 that scores one prediction against its label; averaging it over the dataset gives the training objective."

- id: residual
  label: "Residual"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: loss-functions
  summary: "r^(i) = f_θ(x^(i)) − y^(i), the signed error on example i; stacked over the dataset, the residual vector is Xθ − y."

- id: mean-absolute-error
  label: "Mean absolute error (MAE)"
  type: metric
  field: evaluation
  unit: u1-linear-regression
  lesson: loss-functions
  summary: "MAE(θ) = (1/n) Σ |f_θ(x^(i)) − y^(i)| = (1/n)‖Xθ − y‖₁: the average vertical distance to the line; minimized among constants by a median."

- id: mean-squared-error
  label: "Mean squared error (MSE)"
  type: metric
  field: evaluation
  unit: u1-linear-regression
  lesson: loss-functions
  summary: "MSE(θ) = (1/n) Σ (f_θ(x^(i)) − y^(i))² = (1/n)‖Xθ − y‖₂²: the most common regression loss; the empirical risk under squared loss; minimized among constants by the mean."

- id: root-mean-squared-error
  label: "Root mean squared error (RMSE)"
  type: metric
  field: evaluation
  unit: u1-linear-regression
  lesson: loss-functions
  summary: "RMSE = √MSE puts the error back in the units of the label; it has the same minimizer as MSE."

- id: coefficient-of-determination
  label: "Coefficient of determination R²"
  type: metric
  field: evaluation
  unit: u1-linear-regression
  lesson: loss-functions
  summary: "R² = 1 − RSS/TSS = 1 − MSE(θ)/MSE(ȳ): the MSE measured in units of the target variance; an evaluation metric, not a loss."

- id: loss-vs-evaluation-metric
  label: "Loss versus evaluation metric"
  type: concept
  field: evaluation
  unit: u1-linear-regression
  lesson: loss-functions
  summary: "A loss is what the optimizer minimizes; an evaluation metric is what we report. MSE can be both; R² is a metric (L3 p.8)."

- id: best-constant-mean-median
  label: "Best constant: mean (MSE) or median (MAE)"
  type: concept
  field: statistics
  unit: u1-linear-regression
  lesson: loss-functions
  summary: "Among constant predictions, the mean ȳ minimizes the MSE and any median minimizes the MAE; moving one target by Δ moves the mean by Δ/n but need not move the median."
  derivation: der-1-3-1

- id: squared-loss-outlier-sensitivity
  label: "Squared loss and outliers"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: loss-functions
  summary: "Under squared loss a residual pulls on θ with force 2 r^(i) x^(i), growing with its size; under absolute loss the pull is sgn(r^(i)) x^(i), bounded, but not differentiable at r = 0."
  derivation: der-1-3-2

- id: r2-bounds
  label: "Range of R² (and when it is negative)"
  type: concept
  field: evaluation
  unit: u1-linear-regression
  lesson: loss-functions
  summary: "R² ≤ 1; R² = 0 for the mean; R² < 0 exactly when MSE exceeds the target variance; R² ≥ 0 for least squares with an intercept on its own training data."
  derivation: der-1-3-3

- id: r2-population-limit
  label: "Limit of R² under a linear DGP"
  type: concept
  field: statistics
  unit: u1-linear-regression
  lesson: loss-functions
  summary: "For the least-squares line, R² = s_xy²/(s_xx s_yy) → β²σ_X²/(β²σ_X² + σ_ε²) when Y = α + βX + ε (the L3 p.40 question, general result)."
  derivation: der-1-3-4

# Lesson 1.4: least-squares
# Course map L2 pp.20-21 and L3 pp.10-15, 21-22. The glossary terms `transpose-rules`,
# `linear-independence`, and `orthogonal-projection` (new) are nodes automatically.

- id: training-as-optimization
  label: "Training as minimization"
  type: concept
  field: ml
  unit: u1-linear-regression
  lesson: least-squares
  summary: "An optimizer takes a loss and a model class and returns θ̂ ∈ argmin over Θ of the training objective: minimizing over f ∈ M becomes minimizing over θ (L3 p.10)."

- id: least-squares-problem
  label: "Least-squares problem"
  type: method
  field: ml
  unit: u1-linear-regression
  lesson: least-squares
  summary: "min over θ of (1/n)‖Xθ − y‖₂², with a column of ones in X; the slides' θᵀX is read as Xθ."

- id: normal-equations
  label: "Normal equations XᵀXθ = Xᵀy"
  type: method
  field: ml
  unit: u1-linear-regression
  lesson: least-squares
  summary: "Setting ∇(1/n)‖Xθ − y‖² = (2/n)Xᵀ(Xθ − y) to zero gives XᵀXθ = Xᵀy: the residual is orthogonal to every column of X."
  derivation: der-1-4-1

- id: least-squares-closed-form
  label: "Closed form θ̂ = (XᵀX)⁻¹Xᵀy"
  type: method
  field: ml
  unit: u1-linear-regression
  lesson: least-squares
  summary: "When X has full column rank, XᵀX is invertible and the unique least-squares solution is θ̂ = (XᵀX)⁻¹Xᵀy; compute it with a solver, not an inverse."
  derivation: der-1-4-1

- id: least-squares-convexity
  label: "Convexity of least squares"
  type: concept
  field: calculus
  unit: u1-linear-regression
  lesson: least-squares
  summary: "The chord gap of (1/n)‖Xθ − y‖² is t(1−t)‖X(θ − θ')‖²/n ≥ 0 and the Hessian (2/n)XᵀX is PSD; strictly convex exactly when X has full column rank."
  derivation: der-1-4-2

- id: least-squares-projection
  label: "Least squares as orthogonal projection"
  type: concept
  field: linear-algebra
  unit: u1-linear-regression
  lesson: least-squares
  summary: "‖Xθ − y‖² = ‖Xθ̂ − y‖² + ‖X(θ − θ̂)‖² for any solution θ̂ of the normal equations, so it is a global minimizer and Xθ̂ is the projection of y onto col(X)."
  derivation: der-1-4-3

- id: singular-normal-equations
  label: "Singular normal equations"
  type: concept
  field: linear-algebra
  unit: u1-linear-regression
  lesson: least-squares
  summary: "If X lacks full column rank (collinear columns, the dummy-variable trap, d + 1 > n), solutions still exist but form θ̂ + null(X), all with the same predictions and loss."
  derivation: der-1-4-4

- id: simple-linear-regression-closed-form
  label: "One-feature least squares"
  type: method
  field: ml
  unit: u1-linear-regression
  lesson: least-squares
  summary: "θ̂₁ = s_xy/s_xx and θ̂₀ = ȳ − θ̂₁x̄; on the L2 companion's 20 patients, slope 37.3788 and intercept −797.08."
  derivation: der-1-4-5

# ---------- Unit 2: Risk and gradient descent ----------
# Seeded from docs/course-map/01-lectures-L1-L3.md (L3) and 02-lectures-L4-L5.md (L4, L5), "Concept-graph edges".

# Lesson 2.1: data-generating-distributions

- id: probability-axioms
  label: "Probability axioms and their consequences"
  type: concept
  field: probability
  unit: u2-risk-and-gradient-descent
  lesson: data-generating-distributions
  summary: "Non-negativity, P(Ω) = 1, and countable additivity imply P(∅) = 0, finite additivity, P(A^c) = 1 − P(A), and P(A) ≤ 1."
  derivation: der-2-1-1

- id: rv-induced-distribution
  label: "Distribution of a random variable"
  type: concept
  field: probability
  unit: u2-risk-and-gradient-descent
  lesson: data-generating-distributions
  summary: "A random variable X: Ω → E carries the distribution P_X(B) = P(X^(-1)(B)), which satisfies the axioms; one sample space supports many random variables."
  derivation: der-2-1-2

- id: dgp-sampling-model
  label: "Dataset as iid draws from P"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: data-generating-distributions
  summary: "(X^(i), Y^(i)) are iid draws from a fixed, unknown data-generating distribution P; the observed dataset is one realization of them."

- id: iid-joint-factorization
  label: "iid factorization of a dataset's density"
  type: concept
  field: probability
  unit: u2-risk-and-gradient-descent
  lesson: data-generating-distributions
  summary: "Under iid sampling p(D) = Π_i p(x^(i), y^(i)), so log p(D) = Σ_i log p(y^(i) | x^(i)) + Σ_i log p(x^(i))."
  derivation: der-2-1-3

- id: signal-plus-noise
  label: "Y = f*(X) + ε"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: data-generating-distributions
  summary: "Any (X, Y) with finite variance decomposes as Y = f*(X) + ε with f*(x) = E[Y | X = x], E[ε | X] = 0, and E[h(X) ε] = 0 for every h."
  derivation: der-2-1-4

- id: conditional-mean-optimality
  label: "E[Y | X] is the MSE-optimal predictor"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: data-generating-distributions
  summary: "E[(Y − h(X))^2] = E[Var(Y | X)] + E[(f*(X) − h(X))^2], so the conditional mean f* minimizes expected squared error over all predictors."
  derivation: der-2-1-5

- id: irreducible-error
  label: "Irreducible error"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: data-generating-distributions
  summary: "E[Var(Y | X)], the expected squared error of the best predictor: spread among cases with the same input, which no function of the input can remove."
  derivation: der-2-1-5

- id: linear-dgp-well-specified
  label: "Linear DGP: linear regression is well specified"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: data-generating-distributions
  summary: "If Y = α + βX + ε with ε independent of X, then E[Y | X] = α + βX lies in the linear class, the best MSE is σ_ε^2, and Var(Y) = β^2 σ_X^2 + σ_ε^2."
  derivation: der-2-1-6

# Lesson 2.2: true-and-empirical-risk
# Course map L3 pp.41-45 and L4 pp.4-11. The glossary terms `empirical-risk`,
# `law-of-large-numbers`, and `selection-bias` (new) are nodes automatically and are not repeated here.

- id: true-risk
  label: "True risk"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: true-and-empirical-risk
  summary: "R(θ) = E_(X,Y)~P[ℓ(f_θ(X), Y)]: the expected loss on a new draw from the data-generating distribution; one number per θ, uncomputable because P is unknown."
  derivation: der-2-2-1

- id: risk-noise-floor
  label: "Noise floor of the squared-error risk"
  type: concept
  field: statistics
  unit: u2-risk-and-gradient-descent
  lesson: true-and-empirical-risk
  summary: "With Y = g(X) + ε, R(θ) = E_X[(f_θ(X) − g(X))²] + σ_ε²: measuring against Y instead of g adds a constant, and no model beats σ_ε²."
  derivation: der-2-2-1

- id: empirical-risk-minimization
  label: "Empirical risk minimization"
  type: method
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: true-and-empirical-risk
  summary: "The supervised learning problem restated (L4 p.10): θ̂ = argmin_θ (1/n) Σ_i ℓ(f_θ(x^(i)), y^(i)); for a fixed training set, a function minimization in θ."

- id: empirical-risk-unbiased
  label: "Empirical risk is unbiased at a fixed θ"
  type: concept
  field: statistics
  unit: u2-risk-and-gradient-descent
  lesson: true-and-empirical-risk
  summary: "For θ fixed before seeing the data, E[R̂(θ)] = R(θ) by linearity of expectation."
  derivation: der-2-2-2

- id: empirical-risk-variance
  label: "Variance of the empirical risk"
  type: concept
  field: statistics
  unit: u2-risk-and-gradient-descent
  lesson: true-and-empirical-risk
  summary: "For a fixed θ and i.i.d. examples, Var(R̂(θ)) = σ_θ²/n: four times the data halves the typical estimation error."
  derivation: der-2-2-2

- id: empirical-risk-consistency
  label: "Empirical risk converges to true risk"
  type: concept
  field: statistics
  unit: u2-risk-and-gradient-descent
  lesson: true-and-empirical-risk
  summary: "Weak LLN via Markov and Chebyshev: P(|R̂(θ) − R(θ)| ≥ ε) ≤ σ_θ²/(nε²) → 0 for each fixed θ."
  derivation: der-2-2-3

- id: training-risk-optimism
  label: "Training risk is optimistic"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: true-and-empirical-risk
  summary: "E[R̂(θ̂)] ≤ R(θ*) ≤ E[R(θ̂)]: the trained model's training risk underestimates its true risk because θ̂ was chosen on the same data."
  derivation: der-2-2-4

- id: mean-predictor-optimism
  label: "Optimism of the fitted mean"
  type: concept
  field: statistics
  unit: u2-risk-and-gradient-descent
  lesson: true-and-empirical-risk
  summary: "For the constant predictor θ̂ = ȳ under squared loss, E[R̂(θ̂)] = (n−1)σ²/n and E[R(θ̂)] = (n+1)σ²/n: the gap is exactly 2σ²/n."
  derivation: der-2-2-5

# Lesson 2.3: gradients-and-optimality
# Course map L4 pp.12-30, 37, 42, 51 (docs/course-map/02-lectures-L4-L5.md).
# The glossary terms derivative, gradient, hessian, directional-derivative,
# cauchy-schwarz-inequality, and level-set (new, owned by this lesson) are nodes
# automatically and are not repeated here.

- id: local-linear-approximation
  label: "Local linearity (differentiability)"
  type: concept
  field: calculus
  unit: u2-risk-and-gradient-descent
  lesson: gradients-and-optimality
  summary: "f(θ + h) = f(θ) + ∇f(θ)ᵀh + o(‖h‖): near any point a differentiable function is its tangent plane; the linear part is forced to be the vector of partials."
  derivation: der-2-3-1

- id: gradient-steepest-ascent
  label: "Gradient is the steepest-ascent direction"
  type: concept
  field: calculus
  unit: u2-risk-and-gradient-descent
  lesson: gradients-and-optimality
  summary: "Over unit directions u, the slope ∇f(θ)ᵀu is largest, equal to ‖∇f(θ)‖, only at u = ∇f/‖∇f‖ (Cauchy–Schwarz); every direction within 90° of the gradient increases f."
  derivation: der-2-3-3

- id: steepest-descent-direction
  label: "Negative gradient is the steepest-descent direction"
  type: concept
  field: calculus
  unit: u2-risk-and-gradient-descent
  lesson: gradients-and-optimality
  summary: "The slope is smallest, equal to −‖∇f(θ)‖, only along −∇f/‖∇f‖; this is the direction of the gradient-descent update. It need not point at the minimizer."
  derivation: der-2-3-3

- id: gradient-orthogonal-level-sets
  label: "Gradient ⟂ level sets"
  type: concept
  field: calculus
  unit: u2-risk-and-gradient-descent
  lesson: gradients-and-optimality
  summary: "Along any curve that stays on {f = c}, d/dt f(γ(t)) = ∇fᵀγ' = 0, so the gradient is perpendicular to the contour through θ and points to higher levels."
  derivation: der-2-3-4

- id: critical-point
  label: "Critical point"
  type: concept
  field: calculus
  unit: u2-risk-and-gradient-descent
  lesson: gradients-and-optimality
  summary: "A point with ∇f(θ) = 0: a local minimum, local maximum, saddle, or (in 1-D) a flat inflection point."

- id: interior-extremum-zero-gradient
  label: "Interior extremum ⇒ zero gradient"
  type: concept
  field: calculus
  unit: u2-risk-and-gradient-descent
  lesson: gradients-and-optimality
  summary: "Proof of the first-order necessary condition: restricted to each coordinate line, the difference quotient is ≥ 0 on one side and ≤ 0 on the other, so every partial is zero."
  derivation: der-2-3-5

- id: hessian-test-local-extrema
  label: "Hessian test for local extrema"
  type: concept
  field: calculus
  unit: u2-risk-and-gradient-descent
  lesson: gradients-and-optimality
  summary: "At a critical point, a positive definite Hessian gives a strict local min (vᵀHv ≥ λ_min‖v‖² beats the Taylor remainder), negative definite a strict local max; a zero eigenvalue leaves the test silent."
  derivation: der-2-3-6

- id: saddle-point
  label: "Saddle point"
  type: concept
  field: calculus
  unit: u2-risk-and-gradient-descent
  lesson: gradients-and-optimality
  summary: "A critical point that is neither a local min nor a local max; guaranteed when the Hessian has eigenvalues of both signs. Gradient descent can stall near one (L5 p.13)."
  derivation: der-2-3-7

# Lesson 2.4: gradient-descent
# Course map L4 pp.31-47 (docs/course-map/02-lectures-L4-L5.md).
# The glossary terms learning-rate, convergence-criterion, autograd, and
# chain-rule-calculus (new, owned by this lesson) are nodes automatically.

- id: iterative-optimization
  label: "Iterative solutions (when ∇R̂ = 0 has no closed form)"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: gradient-descent
  summary: "When the first-order condition cannot be solved in closed form, start from a guess and repeatedly improve it with a local rule."

- id: gradient-descent
  label: "Gradient descent algorithm"
  type: method
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: gradient-descent
  summary: "θ^(t+1) = θ^(t) − η_t ∇F(θ^(t)) from an initial guess until a stopping rule holds; each step moves along the steepest-descent direction."

- id: gd-on-empirical-risk
  label: "Gradient descent for supervised learning"
  type: method
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: gradient-descent
  summary: "Apply gradient descent to the empirical risk R̂(θ) = (1/n) Σ ℓ(f_θ(x⁽ⁱ⁾), y⁽ⁱ⁾); needs only a gradient, not a closed form, and works for any differentiable model and loss."

- id: gd-fixed-points
  label: "Fixed points of gradient descent are critical points"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: gradient-descent
  summary: "θ̄ is a fixed point of the update iff ∇F(θ̄) = 0, so a convergent run ends at a critical point, which need not be a minimum."
  derivation: der-2-4-1

- id: gd-stopping-rules
  label: "Stopping rules for gradient descent"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: gradient-descent
  summary: "Loss change ≈ η‖∇F‖², parameter change = η‖∇F‖, and gradient norm: three tests of the same gradient on different scales."
  derivation: der-2-4-2

- id: gd-convergence-behavior
  label: "Convergence guarantee of gradient descent"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: gradient-descent
  summary: "With an appropriate step size, GD finds the minimum of a convex function and a local minimum or other critical point of a non-convex one; too large a step jitters or diverges."

- id: mse-gradient
  label: "MSE gradient (2/n)Xᵀ(Xθ − y)"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: gradient-descent
  summary: "∇_θ (1/n)‖Xθ − y‖² = (2/n)Xᵀ(Xθ − y), a (d+1)-column; its Hessian is (2/n)XᵀX."
  derivation: der-2-4-3

- id: lms-update
  label: "Per-example form of the MSE gradient (LMS rule)"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: gradient-descent
  summary: "(2/n) Σ (θᵀx⁽ⁱ⁾ − y⁽ⁱ⁾) x⁽ⁱ⁾: each example pulls θ along its feature vector with strength equal to its residual."
  derivation: der-2-4-4

- id: lsq-gradient-hessian-form
  label: "Least-squares gradient as curvature times distance"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: gradient-descent
  summary: "For least squares ∇R̂(θ) = H(θ − θ*), with H = (2/n)XᵀX, so a small gradient along a flat direction can hide a large error."
  derivation: der-2-4-5

- id: autograd-gd-loop
  label: "PyTorch autograd loop for linear regression"
  type: method
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: gradient-descent
  summary: "requires_grad=True, forward pass to the MSE, loss.backward(), update under torch.no_grad(); .grad accumulates unless the tensor is new or zero_grad() is called."
  derivation: der-2-4-6

# Lesson 2.5: step-size-and-conditioning
# Course map L4 pp.48-53 and L5 pp.3-16 (docs/course-map/02-lectures-L4-L5.md).
# The glossary terms condition-number, l-smooth, stochastic-gradient-descent, minibatch,
# taylor-expansion, and convex-function (owned by this lesson) are nodes automatically and are not repeated here.

- id: gd-quadratic-contraction
  label: "GD contraction factor on a parabola"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "Each GD step on E = ½aθ² + bθ + c multiplies the error θ − θ⋆ by 1 − ηa."
  derivation: der-2-5-1

- id: optimal-step-size
  label: "Optimal step size η_opt = 1/a"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "On a parabola the step η_opt = 1/a = 1/E″ lands on the minimizer in one step; it is a Newton step."
  derivation: der-2-5-1

- id: step-size-regimes
  label: "Step-size regimes"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "η < η_opt: monotone; η_opt < η < 2η_opt: oscillating convergence; η = 2η_opt: bounces forever; η > 2η_opt: divergence."
  derivation: der-2-5-2

- id: uncoupled-descents
  label: "Uncoupled descents"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "On a diagonal quadratic, GD runs d separate 1-D descents with per-coordinate optimal rates η_j,opt = 1/a_jj."
  derivation: der-2-5-3

- id: single-rate-stability-bound
  label: "One step size for all coordinates"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "A shared step size converges iff η < 2 min_j η_j,opt; the stiffest coordinate caps η and the flattest then crawls."
  derivation: der-2-5-3

- id: eigenbasis-gd-modes
  label: "GD modes in the eigenbasis"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "For a symmetric positive definite Hessian A = QΛQᵀ, GD contracts each eigen-direction by 1 − ηλᵢ; stable iff η < 2/λ_max."
  derivation: der-2-5-4

- id: best-fixed-step-size
  label: "Best fixed step size"
  type: method
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "η⋆ = 2/(λ_max + λ_min) minimizes the worst contraction, which is (κ − 1)/(κ + 1); the steps needed grow like κ."
  derivation: der-2-5-5

- id: local-quadratic-model
  label: "Local quadratic model of a smooth loss"
  type: concept
  field: calculus
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "Near a minimizer a twice-differentiable loss is its second-order Taylor model, so e⁽ᵗ⁺¹⁾ ≈ (I − ηH)e⁽ᵗ⁾ with H the Hessian there."
  derivation: der-2-5-6

- id: large-step-basin-escape
  label: "Large steps escape sharp basins"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "A fixed η cannot settle where λ_max(H) > 2/η: large steps leave sharp basins, but a step that stays too large never settles."
  derivation: der-2-5-6

- id: descent-lemma
  label: "Descent lemma"
  type: concept
  field: calculus
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "For L-smooth f, f(θ − η∇f) ≤ f(θ) − η(1 − Lη/2)‖∇f‖², so any 0 < η < 2/L decreases f."
  derivation: der-2-5-7

- id: gd-convex-smooth-rate
  label: "GD rate for convex L-smooth functions"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "With η = 1/L, f(θ⁽ᵗ⁾) − f⋆ ≤ L‖θ⁽⁰⁾ − θ⋆‖²/(2t): telescoping the descent lemma with the tangent-plane bound."

- id: learning-rate-decay-schedules
  label: "Learning-rate decay schedules"
  type: method
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "Start large, then shrink: η₀/(t+1), η₀/(t+1)², η₀e^(−βt) (L5 p.11). Schedules with finite total length can stall."
  derivation: der-2-5-8

- id: robbins-monro-conditions
  label: "Robbins–Monro conditions"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "Σ η_t = ∞ (enough total movement) and Σ η_t² < ∞ (finite accumulated noise); η₀/(t+1) satisfies both."
  derivation: der-2-5-8

- id: minibatch-gradient-unbiased
  label: "Minibatch gradient is unbiased"
  type: concept
  field: statistics
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "With indices drawn uniformly, the minibatch gradient has expectation equal to the full gradient of the empirical risk."
  derivation: der-2-5-9

- id: minibatch-gradient-variance
  label: "Minibatch gradient variance shrinks like 1/b"
  type: concept
  field: statistics
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "With b independent uniform indices, Cov(g_B) = Σ₁/b and E‖g_B − ∇R̂‖² = tr Σ₁/b."
  derivation: der-2-5-9

- id: sgd-noise-floor
  label: "Constant-step SGD noise floor"
  type: concept
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "Per-example gradients do not vanish at θ⋆, so constant-step SGD hovers near the minimizer; a Robbins–Monro schedule lets it settle."

- id: feature-scaling-conditioning
  label: "Feature scaling and conditioning"
  type: method
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "Standardizing features leaves predictions unchanged but reshapes the Hessian (2/n)XᵀX, cutting κ and the GD step count by orders of magnitude."

- id: pytorch-optimizer-loop
  label: "The torch.optim training loop"
  type: method
  field: ml
  unit: u2-risk-and-gradient-descent
  lesson: step-size-and-conditioning
  summary: "zero_grad, forward, loss, backward, step: one minibatch step per pass; Adam and RMSprop rescale per coordinate (L5 p.15)."
