# ---------- Unit 6: Generative models and Naive Bayes ----------
# Seeded from docs/course-map/04-lectures-L8-L10.md, "Concept-graph edges" (L8 generative half, L9).

- id: generative-model
  label: "Generative model"
  type: concept
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: generative-vs-discriminative
  summary: "A model of how the data are distributed; for classification, a class-conditional p(x|y) plus a prior p(y), hence a joint p(x, y)."

- id: discriminative-model
  label: "Discriminative model"
  type: concept
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: generative-vs-discriminative
  summary: "A model of p(y|x) only (softmax or logistic regression); it learns the decision boundary and says nothing about p(x)."

- id: class-conditional-distribution
  label: "Class-conditional p(x|y)"
  type: concept
  field: probability
  unit: u6-generative-models-and-naive-bayes
  lesson: generative-vs-discriminative
  summary: "For each label k, a distribution over inputs that scores how typical x looks for class k; one distribution per class, each summing to 1 over x."

- id: class-prior
  label: "Class prior p(y)"
  type: concept
  field: probability
  unit: u6-generative-models-and-naive-bayes
  lesson: generative-vs-discriminative
  summary: "The probability of each class before seeing x; estimated by the class proportions in the training set."

- id: joint-model
  label: "Joint model p(x, y)"
  type: concept
  field: probability
  unit: u6-generative-models-and-naive-bayes
  lesson: generative-vs-discriminative
  summary: "p(x, y) = p(x|y) p(y): a prior and a class-conditional together define a distribution over input-label pairs."

- id: bayes-classifier
  label: "Bayes classifier"
  type: method
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: generative-vs-discriminative
  summary: "Predict argmax_k p(x|y=k) p(y=k); p(x) drops out of the argmax but is needed to report the posterior."
  derivation: der-6-1-1

- id: bayes-classifier-optimality
  label: "Bayes classifier is 0/1-optimal"
  type: concept
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: generative-vs-discriminative
  summary: "Among all classifiers, argmax_k p(y=k|x) has the lowest probability of error; its risk is the Bayes error 1 - E[max_k p(y=k|X)]."
  derivation: der-6-1-2

- id: generative-mle-factorization
  label: "Generative MLE splits"
  type: concept
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: generative-vs-discriminative
  summary: "The joint log-likelihood is a prior term plus a class-conditional term, so the prior and each class-conditional are fit separately."
  derivation: der-6-1-3

- id: bag-of-words
  label: "Bag of words"
  type: concept
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: text-as-features
  summary: "A document becomes phi(x) in {0,1}^|V|: entry j is 1 if the document contains vocabulary word j."
  derivation: der-6-2-2

- id: count-vectorizer
  label: "CountVectorizer"
  type: method
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: text-as-features
  summary: "sklearn's bag-of-words builder: fit_transform learns the vocabulary on training text, transform reuses it; binary=True gives 0/1 features."
  derivation: der-6-2-3

- id: logistic-regression-text-baseline
  label: "Logistic-regression text baseline"
  type: method
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: text-as-features
  summary: "Softmax or logistic regression on bag-of-words features: the discriminative baseline on 20 Newsgroups and the spam data."
  derivation: der-6-2-5

- id: text-preprocessing
  label: "Text preprocessing"
  type: method
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: text-as-features
  summary: "Stop-word removal, stemming, and dropping rare words to shrink and clean the vocabulary."

- id: fixed-length-features
  label: "Fixed-length features"
  type: concept
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: text-as-features
  summary: "A linear score theta^T x needs every input in R^p with one fixed p and a fixed meaning per coordinate; variable-length text must first pass through a feature map."
  derivation: der-6-2-1

- id: vocabulary
  label: "Vocabulary"
  type: concept
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: text-as-features
  summary: "The fixed, ordered set V of words of interest; its size |V| is the length of every bag-of-words vector. CountVectorizer learns it from training text as vocabulary_."

- id: count-features
  label: "Count features"
  type: concept
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: text-as-features
  summary: "phi(x)_j is the number of times word j occurs instead of whether it occurs; the binary bag of words is min(count, 1). The input of multinomial Naive Bayes."

- id: fit-preprocessing-on-train
  label: "Fit preprocessing on train only"
  type: concept
  field: evaluation
  unit: u6-generative-models-and-naive-bayes
  lesson: text-as-features
  summary: "Learned preprocessing (vocabulary, max_features selection, scalers) is fit on the training split and only applied to the test split, so the test set influences nothing that was fit."

- id: full-categorical-class-conditional
  label: "Full categorical class-conditional"
  type: concept
  field: probability
  unit: u6-generative-models-and-naive-bayes
  lesson: naive-bayes
  summary: "Treat each binary vector x as one outcome of a categorical distribution per class; exact but needs 2^d - 1 parameters per class."

- id: parameter-explosion
  label: "Parameter explosion"
  type: concept
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: naive-bayes
  summary: "A full model of d binary features has K(2^d - 1) free parameters; at d = 10,000 that exceeds the atoms in the universe."
  derivation: der-6-3-1

- id: naive-bayes-assumption
  label: "Naive Bayes assumption"
  type: concept
  field: probability
  unit: u6-generative-models-and-naive-bayes
  lesson: naive-bayes
  summary: "Features are conditionally independent given the label: p(x|y) = prod_j p(x_j|y)."
  derivation: der-6-3-2

- id: bernoulli-naive-bayes
  label: "Bernoulli Naive Bayes"
  type: method
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: naive-bayes
  summary: "Categorical prior phi_k and one Bernoulli psi_jk per word and class: Kd + K - 1 free parameters."

- id: nb-log-likelihood-decomposition
  label: "NB log-likelihood decomposition"
  type: concept
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: naive-bayes
  summary: "The Bernoulli NB log-likelihood is a sum of separate terms for phi and for each psi_jk, so each is optimized alone."
  derivation: der-6-3-3

- id: bernoulli-nb-mle
  label: "Bernoulli NB MLE"
  type: method
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: naive-bayes
  summary: "psi_jk is the fraction of class-k documents containing word j; phi_k is the class proportion n_k / n."
  derivation: der-6-3-4

- id: nb-prediction
  label: "NB prediction"
  type: method
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: naive-bayes
  summary: "The Bayes classifier with the NB class-conditional: argmax_k of log phi_k plus a sum of per-word log-probabilities."

- id: log-space-prediction
  label: "Log-space prediction"
  type: method
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: naive-bayes
  summary: "Sum log-probabilities instead of multiplying probabilities to avoid underflow; recover posteriors with log-sum-exp."
  derivation: der-6-3-7

- id: laplace-smoothing
  label: "Laplace smoothing"
  type: method
  field: statistics
  unit: u6-generative-models-and-naive-bayes
  lesson: naive-bayes
  summary: "Add pseudo-counts so no word gets probability 0 in a class; the MAP estimate under a Beta prior. Not on the slides."
  derivation: der-6-3-6

- id: nb-linear-classifier
  label: "NB is a linear classifier"
  type: concept
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: naive-bayes
  summary: "For Bernoulli features the NB log-odds are an affine function of x, the generative counterpart of logistic regression."
  derivation: der-6-3-8

- id: multinomial-naive-bayes
  label: "Multinomial Naive Bayes"
  type: method
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: naive-bayes
  summary: "NB on word counts with one categorical distribution over the vocabulary per class. Beyond the slides."
  derivation: der-6-3-9

- id: categorical-prior-mle
  label: "Class-prior MLE"
  type: method
  field: statistics
  unit: u6-generative-models-and-naive-bayes
  lesson: naive-bayes
  summary: "phi_k = n_k / n: maximize sum_k n_k log phi_k on the simplex with a Lagrange multiplier; holds for any class-conditional model."
  derivation: der-6-3-5

- id: zero-count-problem
  label: "Zero-count problem"
  type: concept
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: naive-bayes
  summary: "A word never seen in class k gets MLE psi_jk = 0, so log psi_jk = -inf and one word vetoes the class; the spam solution's psis had 34 such zeros."

- id: spam-email-dataset
  label: "Spam email dataset"
  type: dataset
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: spam-exercise
  summary: "emails.csv from the in-class exercise: 5,728 Enron emails (4,360 ham, 1,368 spam), split 3,837 train / 1,891 test, featurized as 1,000 binary bag-of-words columns."

- id: nb-vectorized-scoring
  label: "Vectorized NB scoring"
  type: method
  field: ml
  unit: u6-generative-models-and-naive-bayes
  lesson: spam-exercise
  summary: "All Naive Bayes class scores at once: S = X (log Ψ)^T + (1 − X)(log(1 − Ψ))^T + log φ, then argmax over each row."
  derivation: der-6-4-3

# ---------- Unit 7: Gaussian discriminant analysis ----------
# Seeded from docs/course-map/04-lectures-L8-L10.md, "Concept-graph edges" (L9 mixtures, L10).

# Lesson 7.1: multivariate-gaussian-and-covariance

- id: covariance-matrix-properties
  label: "Covariance matrix properties"
  type: concept
  field: probability
  unit: u7-gaussian-discriminant-analysis
  lesson: multivariate-gaussian-and-covariance
  summary: "Σ has the variances on its diagonal, is symmetric, equals E[xxᵀ] − μμᵀ, and is positive semi-definite because vᵀΣv = Var(vᵀx) ≥ 0."
  derivation: der-7-1-1

- id: mvn-density
  label: "Multivariate Gaussian density"
  type: concept
  field: probability
  unit: u7-gaussian-discriminant-analysis
  lesson: multivariate-gaussian-and-covariance
  summary: "N(x; μ, Σ) = (2π)^(−d/2) |Σ|^(−1/2) exp(−½ (x − μ)ᵀ Σ⁻¹ (x − μ)); a product of d univariate Gaussians when Σ is diagonal, and the density of μ + Σ^(1/2) z for standard normal z in general."
  derivation: der-7-1-3

- id: covariance-ellipse-geometry
  label: "Covariance ellipse geometry"
  type: concept
  field: linear-algebra
  unit: u7-gaussian-discriminant-analysis
  lesson: multivariate-gaussian-and-covariance
  summary: "Equal-density contours of N(μ, Σ) are ellipses centered at μ with axes along the eigenvectors of Σ and semi-axes r√λⱼ; the enclosed area in 2-D is πr²|Σ|^(1/2)."
  derivation: der-7-1-4

- id: covariance-quartet
  label: "Match the matrix to the cloud"
  type: concept
  field: probability
  unit: u7-gaussian-discriminant-analysis
  lesson: multivariate-gaussian-and-covariance
  summary: "The L10 p.14 quartet with our matrices [[4,3],[3,4]], [[4,−3],[−3,4]], diag(4,1), diag(1,4): the off-diagonal sign sets the tilt, the eigenvalues (7 and 1, or 4 and 1) set the elongation."
  derivation: der-7-1-5

- id: gaussian-mixture
  label: "Gaussian mixture"
  type: concept
  field: probability
  unit: u7-gaussian-discriminant-analysis
  lesson: multivariate-gaussian-and-covariance
  summary: "p(x) = Σ_k π_k N(x; μ_k, Σ_k), a weighted sum of Gaussian densities (not of Gaussian variables). It is the marginal of a generative classifier over its label, p(x) = Σ_k P(Y=k) p(x|Y=k), with π_k = φ_k the class priors."
  derivation: der-7-1-6

# Lesson 7.2: gaussian-discriminant-analysis

- id: gda-model
  label: "GDA (QDA)"
  type: method
  field: ml
  unit: u7-gaussian-discriminant-analysis
  lesson: gaussian-discriminant-analysis
  summary: "Generative classifier with y ~ Categorical(φ) and x | y = k ~ N(μ_k, Σ_k), one full covariance per class (the slides' GDA, also called QDA); its marginal is a Gaussian mixture (der-7-1-6)."

- id: gda-log-likelihood-decomposition
  label: "GDA log-likelihood decomposition"
  type: concept
  field: ml
  unit: u7-gaussian-discriminant-analysis
  lesson: gaussian-discriminant-analysis
  summary: "ℓ(θ) = Σ_i log φ_{y(i)} + Σ_k ℓ_k(μ_k, Σ_k): one prior term and one term per class, so each (μ_k, Σ_k) is fit from class k's examples alone."
  derivation: der-7-2-2

- id: gda-mle-mean
  label: "GDA MLE of the class mean"
  type: method
  field: ml
  unit: u7-gaussian-discriminant-analysis
  lesson: gaussian-discriminant-analysis
  summary: "μ̂_k is the class-k sample mean, from the gradient of the quadratic form; the Hessian −n_k Σ_k^{-1} is negative definite, so it is the unique maximum for every Σ_k."
  derivation: der-7-2-4

- id: gda-mle-covariance
  label: "GDA MLE of the class covariance"
  type: method
  field: ml
  unit: u7-gaussian-discriminant-analysis
  lesson: gaussian-discriminant-analysis
  summary: "Σ̂_k = (1/n_k) Σ_{i: y(i)=k} (x(i) − μ̂_k)(x(i) − μ̂_k)^T, via the trace trick and ∇log|Σ|, ∇tr(Σ^{-1}S); a global maximum by an eigenvalue argument (der-7-2-6)."
  derivation: der-7-2-5

- id: gda-prediction
  label: "GDA prediction rule"
  type: method
  field: ml
  unit: u7-gaussian-discriminant-analysis
  lesson: gaussian-discriminant-analysis
  summary: "ŷ = argmax_k [log φ_k − ½ log|Σ_k| − ½ (x − μ_k)^T Σ_k^{-1} (x − μ_k)]; the posterior is the softmax of these scores and the boundary is quadratic."
  derivation: der-7-2-7

- id: gda-covariance-bias
  label: "Bias of the covariance MLE"
  type: concept
  field: statistics
  unit: u7-gaussian-discriminant-analysis
  lesson: gaussian-discriminant-analysis
  summary: "E[Σ̂_k] = (n_k − 1)/n_k · Σ_k because spread is measured around the fitted mean; dividing by n_k − 1 is unbiased but is not the MLE."
  derivation: der-7-2-8

- id: gda-covariance-singularity
  label: "Singular class covariance"
  type: concept
  field: ml
  unit: u7-gaussian-discriminant-analysis
  lesson: gaussian-discriminant-analysis
  summary: "rank Σ̂_k ≤ n_k − 1, so a class with n_k ≤ d examples gives a singular Σ̂_k, an undefined density, and an unbounded likelihood; remedies are sharing, diagonalizing, or shrinking Σ."
  derivation: der-7-2-9

# Lesson 7.3: shared-covariance-and-logistic-regression (beyond the slides; course map L10 derivation gaps 2 and 3)

- id: shared-covariance-gda
  label: "Shared-covariance GDA (LDA)"
  type: method
  field: ml
  unit: u7-gaussian-discriminant-analysis
  lesson: shared-covariance-and-logistic-regression
  summary: "GDA with one covariance matrix Σ for all classes: x | y = k ~ N(μ_k, Σ). The classes differ only in where their clouds sit, not in their shape."

- id: gda-linear-boundary
  label: "Shared Σ gives a linear boundary"
  type: concept
  field: ml
  unit: u7-gaussian-discriminant-analysis
  lesson: shared-covariance-and-logistic-regression
  summary: "With a shared Σ the x^T Σ^{-1} x terms cancel, so the log-odds are w^T x + b with w = Σ^{-1}(μ_1 − μ_0); the boundary is a hyperplane."
  derivation: der-7-3-1

- id: gda-sigmoid-posterior
  label: "GDA posterior is a sigmoid"
  type: concept
  field: ml
  unit: u7-gaussian-discriminant-analysis
  lesson: shared-covariance-and-logistic-regression
  summary: "Affine log-odds give p(y = 1 | x) = σ(w^T x + b): shared-covariance GDA has the functional form of logistic regression."
  derivation: der-7-3-2

- id: pooled-covariance-mle
  label: "Pooled-covariance MLE"
  type: method
  field: statistics
  unit: u7-gaussian-discriminant-analysis
  lesson: shared-covariance-and-logistic-regression
  summary: "Σ̂ = (1/n) Σ_i (x_i − μ̂_{y_i})(x_i − μ̂_{y_i})^T = Σ_k (n_k/n) Σ̂_k: each example centered at its own class mean; singular when d > n − K."
  derivation: der-7-3-3

- id: qda-quadratic-boundary
  label: "QDA log-odds are quadratic"
  type: concept
  field: ml
  unit: u7-gaussian-discriminant-analysis
  lesson: shared-covariance-and-logistic-regression
  summary: "With a covariance Σ_k per class (the slides' GDA, gda-model, also called QDA), the log-odds keep ½ x^T(Σ_0^{-1} − Σ_1^{-1})x, so the boundary is a quadric."
  derivation: der-7-3-4

- id: gaussian-naive-bayes
  label: "Gaussian Naive Bayes"
  type: method
  field: ml
  unit: u7-gaussian-discriminant-analysis
  lesson: shared-covariance-and-logistic-regression
  summary: "GDA with diagonal Σ_k: the Gaussian factorizes into one 1-D Gaussian per feature, which is the Naive Bayes assumption. Full-covariance GDA is not Naive Bayes."
  derivation: der-7-3-5

- id: gda-vs-logistic-regression
  label: "GDA vs logistic regression"
  type: concept
  field: ml
  unit: u7-gaussian-discriminant-analysis
  lesson: shared-covariance-and-logistic-regression
  summary: "Same sigmoid form, different fit: GDA maximizes the joint likelihood, logistic regression the conditional. GDA implies the logistic form, not conversely."
  derivation: der-7-3-6
