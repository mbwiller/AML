- id: q-u3-l2-017
  lesson: maximum-likelihood-principle
  concepts: [maximum-likelihood-estimation]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    For the flips $H, T, H, T, T, T$, the likelihood at $\theta = \tfrac13$ is $L(\tfrac13) = \tfrac{16}{729} \approx 0.022$. Which statement is correct?
  options:
    - {
        text: "If the head probability were $\\tfrac13$, this exact sequence would occur with probability about 0.022",
        correct: true,
      }
    - {
        text: "The probability that $\\theta = \\tfrac13$, given these flips, is about 0.022",
        misconception: likelihood-is-posterior,
      }
    - { text: "Since 0.022 is small, $\\theta = \\tfrac13$ is a poor estimate" }
    - {
        text: "The area under $L(\\theta)$ over $[0, 1]$ is 1, so 0.022 is a density value for $\\theta$",
        misconception: likelihood-is-posterior,
      }
  explanation: |
    The likelihood is the probability of the data at a fixed $\theta$. Every particular sequence of six flips is improbable, so the peak is low; only its location matters. $L(\theta)$ is not a distribution over $\theta$: here $\int_0^1 \theta^2(1-\theta)^4\,d\theta = 1/105$, not 1.
  discriminates: [maximum-likelihood-estimation, likelihood-vs-probability]

- id: q-u3-l2-018
  lesson: maximum-likelihood-principle
  concepts: [mle-coin-flip]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Ten patients in a cohort have no adverse events. Fitted to these ten alone, what does the maximum-likelihood estimate of the event probability say?
  options:
    - {
        text: "$\\hat\\theta = 0$: an event is impossible, which is the sample's frequency taken literally",
        correct: true,
      }
    - {
        text: "$\\hat\\theta = 0.5$, because with no events the data carry no information",
      }
    - {
        text: "The MLE does not exist, because the first-order condition has no solution",
      }
    - { text: "$\\hat\\theta = 1/10$, one pseudo-event per ten patients" }
  explanation: |
    With $\#H = 0$, $L(\theta) = (1 - \theta)^{10}$ is decreasing on $[0, 1]$, so the maximum is at the edge $\theta = 0$ (der-3-2-4 step 9); the formula $\#H/(\#H + \#T)$ still gives it. The derivative condition fails only because the maximum is on the boundary. Smoothing (Unit 6) is the fix for small counts.
  discriminates: [mle-coin-flip]

- id: q-u3-l2-019
  lesson: maximum-likelihood-principle
  concepts: [mle-principle]
  type: order
  difficulty: 1
  source: "original"
  prompt: |
    Put the steps of a maximum-likelihood derivation in order (L6 pp.8–11).
  items:
    - "Choose a family $P_\\theta$ for one observation."
    - "Use the i.i.d. assumption to write the likelihood as a product $\\prod_i P_\\theta(x^{(i)})$."
    - "Take logs so the product becomes a sum."
    - "Differentiate with respect to $\\theta$ and set the derivative to zero."
    - "Solve for $\\hat\\theta$."
    - "Check the second derivative (or the boundary) to confirm a maximum."
  explanation: |
    This is the order of der-3-2-4. Taking logs is allowed because $\log$ is increasing (der-3-2-3), and the check matters: a critical point can be a minimum, and the maximum can sit on the boundary when a count is zero.

- id: q-u3-l2-020
  lesson: maximum-likelihood-principle
  concepts: [mle-gaussian]
  type: predict
  difficulty: 1
  source: "original"
  prompt: |
    Predict the two printed values.
    ```python
    import numpy as np
    x = np.array([2.0, 4.0, 9.0])
    print(x.var(), x.var(ddof=1))
    ```
  options:
    - { text: "`8.666666666666666 13.0`", correct: true }
    - {
        text: "`13.0 8.666666666666666`",
        misconception: mle-variance-n-minus-1,
      }
    - { text: "`13.0 13.0`" }
    - { text: "`26.0 13.0`" }
  explanation: |
    `np.var` divides by $n - \text{ddof}$, and `ddof` defaults to 0, so `x.var()` is the maximum-likelihood $\hat\sigma^2 = 26/3$ (der-3-2-6 step 9). `ddof=1` divides by $n - 1 = 2$, the unbiased estimate.

# ---------- Lesson 3.3: deriving-the-logistic-regression-objective ----------
# Poll items carry source "L<n> p.<k> poll" and the course map's suggested key
