- id: q-u3-l2-010
  lesson: maximum-likelihood-principle
  concepts: [mle-dice]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    A die is rolled $n = 60$ times and face 4 comes up $c = 15$ times. What is the maximum-likelihood estimate of $p_4$? Give two decimals.
  answer: 0.25
  tolerance: 0.005
  seeded: { c: [6, 9, 15, 20], n: [40, 60, 80, 120] }
  formula: "c / n"
  explanation: |
    By der-3-2-5, $\hat p_k = n_k/n$, so $\hat p_4 = c/n$. The other faces' counts do not matter for $\hat p_4$ beyond fixing the total $n$.

- id: q-u3-l2-011
  lesson: maximum-likelihood-principle
  concepts: [zero-one-loss-not-optimizable]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Why can gradient descent not be run directly on the 0/1 training error $\hat E(\theta) = \frac1n\sum_i \ind{\hat y^{(i)}(\theta) \ne y^{(i)}}$?
  options:
    - {
        text: "Its gradient is zero wherever it exists, so every update leaves $\\theta$ unchanged",
        correct: true,
      }
    - {
        text: "It is discontinuous, and gradient descent needs only continuity",
        misconception: zero-one-only-discontinuous,
      }
    - { text: "It can be negative, so it has no minimum" }
    - { text: "It is a convex function with many global minima" }
  explanation: |
    $\hat E$ is constant on a small ball around every $\theta$ that lies on none of the hyperplanes $\theta^\top x^{(i)} = 0$ (der-3-2-2 step 7), so $\nabla_\theta \hat E = 0$ there (step 8) and $\theta^{(t+1)} = \theta^{(t)}$ (step 10). On the hyperplanes it jumps and has no gradient at all.
  discriminates: [zero-one-loss-not-optimizable, zero-one-loss]

- id: q-u3-l2-012
  lesson: maximum-likelihood-principle
  concepts: [zero-one-loss-not-optimizable]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    Two training points, $x^{(1)} = -1$ with $y^{(1)} = 0$ and $x^{(2)} = 2$ with $y^{(2)} = 1$, and a model with no intercept that predicts $\hat y = \ind{\theta_1 x \ge 0}$. What is the 0/1 training error $\hat E$ at $\theta_1 = 0$?
  answer: 0.5
  tolerance: 0.001
  explanation: |
    At $\theta_1 = 0$ both scores are 0, so both predictions are 1. The first point is wrong and the second right: $\hat E = \tfrac12$. For $\theta_1 > 0$ the error is 0 and for $\theta_1 < 0$ it is 1, a staircase with zero slope everywhere except at the jump.

- id: q-u3-l2-013
  lesson: maximum-likelihood-principle
  concepts: [conditional-probability-window-estimate, mle-coin-flip]
  type: mc
  difficulty: 1
  source: "L5 p.29 (discussion prompt)"
  prompt: |
    At one input $x$ there are 90 training points with $y = 1$ and 10 with $y = 0$. Treating the labels at $x$ as independent coin flips, what is the maximum-likelihood estimate of $P(Y = 1 \mid X = x)$?
  options:
    - { text: "0.9", correct: true }
    - {
        text: "1, because class 1 is the majority",
        misconception: predict-label-not-probability,
      }
    - { text: "0.5, because there are two classes" }
    - { text: "9, the odds of class 1" }
  explanation: |
    The coin-flip MLE is the empirical frequency, $90/(90 + 10) = 0.9$ (der-3-2-4). The majority label 1 is the best hard prediction, but it is not an estimate of the probability.
  discriminates: [conditional-probability-window-estimate, mle-coin-flip]

- id: q-u3-l2-014
  lesson: maximum-likelihood-principle
  concepts: [mle-gaussian]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    Fit a Gaussian $\mathcal{N}(\mu, \sigma^2)$ by maximum likelihood to the three observations $2, 4, 9$. What is $\hat\sigma^2$? Give two decimals.
  answer: 8.667
  tolerance: 0.01
  explanation: |
    $\hat\mu = (2 + 4 + 9)/3 = 5$ (der-3-2-6 step 5). The squared deviations are $9, 1, 16$, so $\hat\sigma^2 = 26/3 \approx 8.67$ (step 9). Dividing by $n - 1 = 2$ would give 13, the unbiased estimate, not the MLE.

- id: q-u3-l2-015
  lesson: maximum-likelihood-principle
  concepts: [conditional-probability-window-estimate]
  type: mc
  difficulty: 2
  source: "L5 p.31 (extension)"
  prompt: |
    You estimate $P(Y = 1 \mid X \approx x_0)$ by averaging the labels of the training points in a window around $x_0$. What happens as you make the window narrower?
  options:
    - {
        text: "The window's target probability moves toward $P(Y = 1 \\mid X = x_0)$, but fewer points fall in it, so the estimate's variance $q(1 - q)/m$ grows",
        correct: true,
      }
    - {
        text: "The estimate becomes exact, because the window contains only points at $x_0$",
      }
    - {
        text: "The variance falls, because the points in the window are more similar",
      }
    - { text: "Nothing changes; the average is unbiased for any window" }
  explanation: |
    der-3-2-1 steps 5 and 6. The average is unbiased for $q = P(Y = 1 \mid X \in W)$, which approaches $p(x_0)$ as $W$ shrinks (if $p$ is continuous), but $m$ shrinks too. At $m = 1$ the estimate is a single label, 0 or 1: the staircase of L5 p.28.
  discriminates: [conditional-probability-window-estimate]

