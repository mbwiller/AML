      explanation: 'Step 3 says $\log t \le t - 1$, so each term $p(x)\log\frac{q(x)}{p(x)}$ is at most $p(x)\big(\frac{q(x)}{p(x)} - 1\big)$; the inequality points the other way. With $\ge$ the chain would end at $-D_{\mathrm{KL}} \ge \dots$, which bounds nothing.',
