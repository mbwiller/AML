# ---------- Lesson 3.4: gaussian-mle-and-kl-divergence ----------
# The L6 p.20 poll falls in this lesson's pages (L6 pp.12-21) but all four statements are already
# in the lesson 3.2 fragment (and b, c, d again in the 3.3 fragment), so none is repeated here.
# The lesson's Pitfalls cite statements (b) and (d). All items below are originals.

- id: q-u3-l4-001
  lesson: gaussian-mle-and-kl-divergence
  concepts: [least-squares-gaussian-mle]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    Linear regression with Gaussian noise of standard deviation $\sigma_\varepsilon = s$, where $s = 8$. L6 p.14 writes the negative log-likelihood as $c_1 \sum_i (y^{(i)} - \theta^\top x^{(i)})^2 + c_2$. What is $c_1$? Give five decimal places.
  answer: 0.0078125
  tolerance: 0.000005
  seeded: { s: [2, 4, 5, 8, 10] }
  formula: "1 / (2 * s * s)"
  explanation: |
    $c_1 = \frac{1}{2\sigma_\varepsilon^2}$ (der-3-4-1 step 10): the Gaussian exponent is $-(y - \theta^\top x)^2 / (2\sigma_\varepsilon^2)$, and negating the log keeps the factor. With $\sigma_\varepsilon = 8$, $c_1 = 1/128$.

- id: q-u3-l4-002
  lesson: gaussian-mle-and-kl-divergence
  concepts: [least-squares-gaussian-mle]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    You fit a line by maximum likelihood assuming Gaussian noise with $\sigma_\varepsilon = 8$ mmHg. A colleague refits the same data assuming $\sigma_\varepsilon = 16$ mmHg. What changes?
  options:
    - {
        text: "The fitted $\\hat\\theta$ stays the same; the value of the negative log-likelihood changes",
        correct: true,
      }
    - {
        text: "The fitted line becomes flatter, because wider noise makes every slope plausible",
        misconception: mle-needs-sigma,
      }
    - {
        text: "Nothing at all: $\\sigma_\\varepsilon$ does not appear in the likelihood",
        misconception: mle-needs-sigma,
      }
    - {
        text: "The fitted $\\hat\\theta$ changes, because $c_1$ changes",
        misconception: mle-needs-sigma,
      }
  explanation: |
    $\sigma_\varepsilon$ enters only through $c_1 = 1/(2\sigma_\varepsilon^2) > 0$ and $c_2 = \frac n2\log(2\pi\sigma_\varepsilon^2)$ (equation 3.4.2). A positive scale and an added constant change the NLL's values but not its minimizer (der-3-4-2 steps 3 and 4). The VASCO worked example shows the NLL gap between two lines growing fourfold when $\sigma_\varepsilon$ halves, with the order unchanged.
  discriminates: [least-squares-gaussian-mle]

- id: q-u3-l4-003
  lesson: gaussian-mle-and-kl-divergence
  concepts: [least-squares-gaussian-mle]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    A least-squares fit to $n = 40$ patients leaves a residual sum of squares $S = 2600\ \text{mmHg}^2$. Under the Gaussian-noise model, what is the maximum-likelihood estimate of the noise variance $\sigma_\varepsilon^2$, in $\text{mmHg}^2$? Give one decimal place.
  answer: 65
  tolerance: 0.05
  seeded: { n: [20, 40, 50, 100], S: [1600, 2600, 3200] }
  formula: "S / n"
  explanation: |
    $\hat\sigma_\varepsilon^2 = S/n$, the mean squared residual (der-3-4-3 step 4). It divides by $n$, so like every training error it is biased low; lesson 2.2 computed the factor $\frac{n-1}{n}$ for the constant model.

- id: q-u3-l4-004
  lesson: gaussian-mle-and-kl-divergence
  concepts: [kl-divergence-def]
  type: which-step
