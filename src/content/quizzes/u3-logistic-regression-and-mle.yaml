    - 'Write the categorical pmf in product form, $\prod_k p_k(x)^{\mathbb{1}[y = k]}$.'
    - 'Take logs, turning the products into sums of $\mathbb{1}[y^{(i)} = k]\log p_k(x^{(i)})$.'
