- id: q-u3-l4-005
  lesson: gaussian-mle-and-kl-divergence
  concepts: [kl-divergence-def]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    Compute $D_{\mathrm{KL}}\big(\mathrm{Bernoulli}(a)\,\|\,\mathrm{Bernoulli}(b)\big)$ in nats (natural log) for $a = 0.1$ and $b = 0.5$. Give four decimal places.
  answer: 0.3681
  tolerance: 0.0005
  seeded: { a: [0.1, 0.2, 0.3], b: [0.5, 0.6, 0.8] }
  formula: "a * log(a / b) + (1 - a) * log((1 - a) / (1 - b))"
  explanation: |
    Two outcomes, so equation 3.4.3 has two terms: $a\log\frac{a}{b} + (1-a)\log\frac{1-a}{1-b}$. For $a = 0.1$, $b = 0.5$: $0.1\log 0.2 + 0.9\log 1.8 = 0.3681$. Swap the arguments and you get $0.5108$; the divergence is not symmetric.

- id: q-u3-l4-006
  lesson: gaussian-mle-and-kl-divergence
  concepts: [kl-divergence-def]
  type: mc
  difficulty: 1
  source: "original"
  prompt: |
    L6 p.16 calls the KL divergence a measure of "the distance between two distributions". Which statement about $D_{\mathrm{KL}}(p\,\|\,q)$ is true?
  options:
    - {
        text: "It is nonnegative and zero only when $p = q$, but in general $D_{\\mathrm{KL}}(p\\,\\|\\,q) \\ne D_{\\mathrm{KL}}(q\\,\\|\\,p)$",
        correct: true,
      }
    - {
        text: "It is a metric: symmetric, nonnegative, and it satisfies the triangle inequality",
        misconception: kl-is-a-metric,
      }
    - {
        text: "It can be negative when $q$ puts more mass than $p$ on some outcomes",
        misconception: kl-integrand-sign,
      }
    - {
        text: "It is symmetric, but it can violate the triangle inequality",
        misconception: kl-is-a-metric,
      }
  explanation: |
    Gibbs' inequality (der-3-4-4) gives nonnegativity and the equality case. The integrand $p\log(p/q)$ can be negative at some outcomes (the L6 p.17 figure), but the total cannot. Symmetry fails: $0.3681$ versus $0.5108$ for $\mathrm{Bern}(0.1)$ and $\mathrm{Bern}(0.5)$ in the two orders.
  discriminates: [kl-divergence-def]

- id: q-u3-l4-007
  lesson: gaussian-mle-and-kl-divergence
  concepts: [conditional-kl-nll]
  type: order
  difficulty: 2
  source: "original"
  prompt: |
    Put the moves of der-3-4-7 (the conditional version of MLE as KL minimization, the L6 p.19 "see homework" item) in order.
  items:
    - 'Complete the conditional model with the data''s input distribution: $q_\theta(x, y) = p(x)\,q_\theta(y \mid x)$.'
    - 'Write $D_{\mathrm{KL}}(p\,\|\,q_\theta)$ as an expectation under $p$ and expand $p(x, y) = p(x)\,p(y \mid x)$.'
    - 'Cancel $p(X)$, leaving $\mathbb{E}\big[\log p(Y \mid X) / q_\theta(Y \mid X)\big]$.'
    - 'Condition on $X$: the KL is $\mathbb{E}_X\big[D_{\mathrm{KL}}(p(\cdot \mid X)\,\|\,q_\theta(\cdot \mid X))\big]$.'
    - 'Drop $\mathbb{E}[\log p(Y \mid X)]$, which does not involve $\theta$, and replace $p$ by $\hat p$ to get the average conditional NLL.'
  explanation: |
    Complete, expand, cancel, condition, then drop the constant and use the sample. The cancellation of $p(X)$ is the KL-side version of dropping $\sum_i \log P(X_i)$ from the joint likelihood on L6 p.7.

- id: q-u3-l4-008
  lesson: gaussian-mle-and-kl-divergence
  concepts: [conditional-kl-nll]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    A logistic model predicts $q_\theta(y = 1 \mid x^{(i)}) = 0.8$ for a patient whose observed label is $y^{(i)} = 0$. The target is the one-hot distribution on the observed label. What is $D_{\mathrm{KL}}\big(\delta_{y^{(i)}}\,\|\,q_\theta(\cdot \mid x^{(i)})\big)$?
  options:
    - { text: "$-\\log 0.2$", correct: true }
    - { text: "$-\\log 0.8$", misconception: kl-is-entropy }
    - {
        text: "$-0.8\\log 0.8 - 0.2\\log 0.2$, the entropy of the prediction",
        misconception: kl-is-entropy,
      }
    - {
        text: "$0$, because a one-hot target has zero entropy",
        misconception: kl-is-entropy,
      }
  explanation: |
    For a point mass the KL keeps one term (der-3-4-8 steps 3 and 4): $-\log q_\theta(y^{(i)} \mid x^{(i)})$. The observed label is 0, and $q_\theta(0 \mid x^{(i)}) = 1 - 0.8 = 0.2$, so the answer is $-\log 0.2 \approx 1.609$ nats. The target's zero entropy is why KL and cross-entropy agree here, not a reason for the KL to vanish.
  discriminates: [conditional-kl-nll, kl-divergence-def]

- id: q-u3-l4-009
  lesson: gaussian-mle-and-kl-divergence
  concepts: [conditional-kl-nll]
  type: which-step
  difficulty: 2
  source: "original"
  derivation: der-3-4-7
  corrupt:
    {
      step: 4,
      replaceTex: 'D_{\mathrm{KL}}(p\,\|\,q_\theta) = \mathbb{E}\Big[\log\frac{p(X, Y)}{q_\theta(Y \mid X)}\Big]',
      explanation: 'Only one $p(X)$ was removed, from the denominator, so the corrupted line is not equal to step 3. Both factors of $p(X)$ must cancel together, which leaves $p(Y \mid X)$ in the numerator, not the joint $p(X, Y)$.',
    }

- id: q-u3-l4-010
  lesson: gaussian-mle-and-kl-divergence
  concepts: [mle-minimizes-kl, kl-divergence-def]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    A classifier assigns probability exactly 0 to the label that one training patient actually has. What happens to $D_{\mathrm{KL}}(\hat p\,\|\,q_\theta)$ and to the training NLL?
  options:
    - {
        text: "Both are $+\\infty$: the model gave zero probability to something that happened",
        correct: true,
      }
    - {
        text: "Nothing special: that patient's term is $0 \\log 0 = 0$",
        misconception: kl-direction,
      }
    - {
        text: "The KL is $+\\infty$, but the NLL is finite because the other patients dominate the sum",
        misconception: kl-direction,
      }
    - {
        text: "Both are 0, because one patient out of many does not matter in the limit",
        misconception: kl-direction,
      }
  explanation: |
    The convention $0\log 0 = 0$ covers outcomes with $\hat p(z) = 0$. Here $\hat p > 0$ and $q_\theta = 0$, so the term is $\hat p\log(\hat p / 0) = +\infty$ (def-3-4-2), and the NLL term $-\log 0$ is also $+\infty$. By der-3-4-5 step 6 the two differ by the finite constant $H(\hat p)$, so they are infinite together. This is why the forward KL punishes overconfident models.
  discriminates: [kl-divergence-def, mle-minimizes-kl]

- id: q-u3-l4-011
  lesson: gaussian-mle-and-kl-divergence
  concepts: [least-squares-gaussian-mle]
  type: predict
  difficulty: 3
  source: "original"
  prompt: |
    Replace the Gaussian noise of def-3-4-1 with Laplace noise, density $\frac{1}{2b}\exp(-\lvert\varepsilon\rvert / b)$. Predict the maximum-likelihood objective for $\theta$.
  options:
    - {
        text: "Minimize the sum of absolute residuals $\\sum_i \\lvert y^{(i)} - \\theta^\\top x^{(i)}\\rvert$",
        correct: true,
      }
    - {
        text: "Still least squares: maximum likelihood with additive noise always gives the squared error",
        misconception: mle-always-squared,
      }
    - {
        text: "Minimize the largest absolute residual",
      }
    - {
        text: "It depends on $b$: small $b$ gives absolute error, large $b$ gives squared error",
        misconception: mle-needs-sigma,
      }
  explanation: |
    Take logs of the product of Laplace densities and negate: $-\sum_i \log p_\theta = \frac1b\sum_i \lvert y^{(i)} - \theta^\top x^{(i)}\rvert + n\log(2b)$ (the "beyond the slides" callout). As with $\sigma_\varepsilon$, $b$ only scales and shifts, so the minimizer is the least-absolute-deviations fit, whose loss is the MAE of lesson 1.3.

- id: q-u3-l4-012
  lesson: gaussian-mle-and-kl-divergence
  concepts: [least-squares-gaussian-mle]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Which statement about least squares and Gaussian noise is correct?
  options:
    - {
        text: "If the noise is Gaussian, least squares is the maximum-likelihood fit; least squares is still a well-defined fit when it is not",
        correct: true,
      }
    - {
        text: "Least squares is only valid when the noise is Gaussian",
        misconception: ls-needs-gaussian,
      }
    - {
        text: "Least squares is the maximum-likelihood fit whatever the noise distribution",
        misconception: mle-always-squared,
      }
    - {
        text: "Gaussian noise is needed for the normal equations to have a solution",
        misconception: ls-needs-gaussian,
      }
  explanation: |
    Der-3-4-1 and der-3-4-2 show that Gaussian noise is sufficient for least squares to be maximum likelihood. The normal equations (lesson 1.4) make no distributional assumption at all; under other noise models, such as Laplace, the maximum-likelihood fit is a different one.
  discriminates: [least-squares-gaussian-mle]

- id: q-u3-l4-013
  lesson: gaussian-mle-and-kl-divergence
  concepts: [conditional-kl-nll]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Logistic regression models only $q_\theta(y \mid x)$. When its joint is completed as $q_\theta(x, y) = p(x)\,q_\theta(y \mid x)$, what does $D_{\mathrm{KL}}\big(p(x, y)\,\|\,q_\theta(x, y)\big)$ measure?
  options:
    - { text: "The average over inputs $X \\sim p$ of the KL between the true and predicted label distributions at $X$", correct: true }
    - { text: "How well the model predicts the inputs $x$ as well as the labels", misconception: discriminative-models-x }
    - { text: "Nothing useful: a conditional model has no joint, so the KL is undefined", misconception: discriminative-models-x }
    - { text: "The KL between the label marginals $p(y)$ and $q_\\theta(y)$ only", misconception: discriminative-models-x }
  explanation: |
    The two copies of $p(X)$ cancel (der-3-4-7 step 4), and conditioning on $X$ turns the joint KL into $\mathbb{E}_X\big[D_{\mathrm{KL}}(p(\cdot \mid X)\,\|\,q_\theta(\cdot \mid X))\big]$ (step 6). A discriminative model is judged only on its label distributions, input by input, weighted by how often each input occurs.
  discriminates: [conditional-kl-nll, mle-minimizes-kl]

- id: q-u3-l4-014
  lesson: gaussian-mle-and-kl-divergence
  concepts: [mle-minimizes-kl]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    A model's average training NLL is $a = 0.70$ nats, and the entropy of the empirical distribution of the (discrete) training data is $h = 0.64$ nats. What is $D_{\mathrm{KL}}(\hat p\,\|\,q_\theta)$, in nats? Give two decimal places.
  answer: 0.06
  tolerance: 0.005
  seeded: { a: [0.70, 0.75, 0.90], h: [0.50, 0.64, 0.69] }
  formula: "a - h"
  explanation: |
    By der-3-4-5 step 6, $D_{\mathrm{KL}}(\hat p\,\|\,q_\theta) = -H(\hat p) - \frac1n\sum_i \log q_\theta(z^{(i)})$: the average NLL minus the entropy. The average NLL can never be below $h$ (Gibbs' inequality), and it equals $h$ only for a model that reproduces the empirical frequencies.

- id: q-u3-l4-015
  lesson: gaussian-mle-and-kl-divergence
  concepts: [mle-minimizes-kl]
  type: which-step
  difficulty: 2
  source: "original"
  derivation: der-3-4-5
  corrupt: { step: 8, replaceTex: '\argmin_\theta D_{\mathrm{KL}}(\hat p\,\|\,q_\theta) = \argmin_\theta \sum_{i=1}^{n}\log q_\theta(z^{(i)})', explanation: 'Dropping the minus sign is only allowed if argmin becomes argmax. As written, the line selects the parameters under which the data are least likely, the opposite of maximum likelihood.' }

- id: q-u3-l4-016
  lesson: gaussian-mle-and-kl-divergence
  concepts: [mle-minimizes-kl]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Fix $\theta$ before seeing any data, and draw a large i.i.d. sample from the true distribution $p$. The average negative log-likelihood $-\frac1n\sum_i \log q_\theta(z^{(i)})$ is close to which quantity?
  options:
    - { text: "$H(p) + D_{\\mathrm{KL}}(p\\,\\|\\,q_\\theta)$, the cross-entropy $H(p, q_\\theta)$", correct: true }
    - { text: "$D_{\\mathrm{KL}}(p\\,\\|\\,q_\\theta)$ alone", misconception: kl-is-entropy }
    - { text: "$D_{\\mathrm{KL}}(q_\\theta\\,\\|\\,p)$", misconception: kl-direction }
    - { text: "$H(q_\\theta)$, the entropy of the model", misconception: kl-is-entropy }
  explanation: |
    The log loss has true risk $\mathbb{E}_{Z\sim p}[-\log q_\theta(Z)] = H(p) + D_{\mathrm{KL}}(p\,\|\,q_\theta)$ (der-3-4-6 step 3), and the sample average is unbiased for it and converges to it (steps 4 and 5). The entropy $H(p)$ does not depend on $\theta$, so minimizing the average NLL targets the KL, but the number itself includes the entropy. At a $\hat\theta$ trained on the same sample the average is optimistic (lesson 2.2).
  discriminates: [mle-minimizes-kl, kl-divergence-def]

# ---------- Lesson 3.5: softmax-regression ----------
# Poll items carry source "L6 p.24 poll" and the course map's suggested key
# (docs/course-map/03-lectures-L6-L7.md). Every numeric value is a toy value; none comes from a homework.

- id: q-u3-l5-001
  lesson: softmax-regression
  concepts: [softmax-regression, softmax-reduces-to-sigmoid]
  type: mc
  difficulty: 1
  source: "L6 p.24 poll"
  prompt: |
    True or false: softmax regression generalizes logistic regression from binary to multiclass classification.
  options:
    - { text: "True", correct: true }
    - { text: "False", misconception: softmax-binary-richer }
  explanation: |
    With $K = 2$, softmax regression gives $p(y = 1 \mid x) = \sigma\big((\theta_1 - \theta_0)^\top x\big)$, which is logistic regression with $\theta = \theta_1 - \theta_0$ (der-3-5-3). For $K > 2$ it is a new model with the same ingredients: linear scores, a normalized exponential, and maximum likelihood.

- id: q-u3-l5-002
  lesson: softmax-regression
  concepts: [softmax-nll-gradient]
  type: mc
  difficulty: 1
  source: "L6 p.24 poll"
  prompt: |
    True or false: we can write down the objective (loss) of softmax regression in the same way as we did for logistic regression.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    Same recipe: conditional likelihood of the labels, log, negate. With the categorical pmf $\prod_k p_k(x)^{\mathbb{1}[y = k]}$ this gives $\hat R(\Theta) = -\frac1n\sum_i \log p_{y^{(i)}}(x^{(i)})$, the cross-entropy with one-hot labels (der-3-5-4).

- id: q-u3-l5-003
  lesson: softmax-regression
  concepts: [softmax-nll-gradient, softmax-convexity]
  type: mc
  difficulty: 1
  source: "L6 p.24 poll"
  prompt: |
    True or false: we can optimize the parameters of softmax regression using gradient descent.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    The loss is differentiable with gradient $\nabla_{\theta_k}\hat R = \frac1n\sum_i\big(p_k(x^{(i)}) - \mathbb{1}[y^{(i)} = k]\big)x^{(i)}$ (der-3-5-5), and it is convex (der-3-5-6), so gradient descent has no spurious local minima to get stuck in. There is no closed-form solution, so an iterative method is needed.

- id: q-u3-l5-004
  lesson: softmax-regression
  concepts: [softmax-regression]
  type: mc
  difficulty: 1
  source: "original (L6 p.22)"
  prompt: |
    L6 p.22 passes each linear score $z_k = \theta_k^\top x$ through $e^{z}$ before normalizing. Why not divide the scores by their sum directly, $z_k / \sum_j z_j$?
  options:
    - {
        text: "Scores can be negative or sum to zero, so the ratios need not lie in $[0, 1]$; $e^{z}$ is always positive",
        correct: true,
      }
    - {
        text: "Dividing by the sum would change which class has the largest score",
        misconception: softmax-normalize-logits,
      }
    - { text: "The exponential makes the model linear in $x$" }
    - {
        text: "Without the exponential the outputs would not sum to 1",
        misconception: softmax-normalize-logits,
      }
  explanation: |
    $z_k / \sum_j z_j$ does sum to 1, but with $z = (2, 1, -1)$ it gives $(1, 0.5, -0.5)$, which is not a distribution. Exponentiating first makes every entry positive (der-3-5-1 step 1), and the normalization then puts each in $(0, 1)$.
  discriminates: [softmax-regression]

- id: q-u3-l5-005
  lesson: softmax-regression
  concepts: [softmax-regression]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    A three-class softmax model has logits $z = (2, 1, -1)$ for some input. Compute $p_1 = \mathrm{softmax}(z)_1$ to three decimals.
  answer: 0.705
  tolerance: 0.001
  seeded: { a: [1, 2, 3], b: [0, 1], c: [-2, -1] }
  formula: "exp(a) / (exp(a) + exp(b) + exp(c))"
  explanation: |
    $p_1 = \dfrac{e^{a}}{e^{a} + e^{b} + e^{c}}$ with $(a, b, c) = (z_1, z_2, z_3)$. For $(2, 1, -1)$: $7.3891 / 10.4752 \approx 0.705$. Subtracting the largest logit first gives the same answer with smaller numbers: $1 / (1 + e^{-1} + e^{-3}) \approx 0.705$ (der-3-5-2 step 8).

- id: q-u3-l5-006
  lesson: softmax-regression
  concepts: [softmax-shift-invariance]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Which change to the parameters of a softmax regression model leaves $p_\Theta(y = k \mid x)$ unchanged for every input $x$ and every class $k$?
  options:
    - {
        text: "Replace every $\\theta_k$ by $\\theta_k + c$, with the same vector $c$ for all classes",
        correct: true,
      }
    - {
        text: "Replace every $\\theta_k$ by $2\\theta_k$",
      }
    - { text: "Replace $\\theta_1$ alone by $\\theta_1 + c$" }
    - {
        text: "Replace every $\\theta_k$ by $\\theta_k + c_k$, with a different vector for each class",
      }
  explanation: |
    A common shift adds $c^\top x$ to every logit, and that factor cancels between numerator and denominator (der-3-5-2). Doubling every $\theta_k$ doubles every gap $z_k - z_l$, which sharpens the distribution: the largest probability moves toward 1. Shifting only some classes changes their gaps to the others.
  discriminates: [softmax-shift-invariance]

- id: q-u3-l5-007
  lesson: softmax-regression
  concepts: [softmax-reduces-to-sigmoid]
  type: mc
  difficulty: 2
  source: "original (L6 p.25)"
  prompt: |
    A two-class softmax model has parameter vectors $\theta_0$ (class 0) and $\theta_1$ (class 1). Which logistic-regression parameter $\theta$ gives exactly the same $p(y = 1 \mid x) = \sigma(\theta^\top x)$ for every $x$?
  options:
    - { text: "$\\theta = \\theta_1 - \\theta_0$", correct: true }
    - { text: "$\\theta = \\theta_1$", misconception: softmax-params-unique }
    - { text: "$\\theta = \\theta_0 - \\theta_1$" }
    - { text: "$\\theta = \\theta_1 + \\theta_0$" }
  explanation: |
    Shift both vectors by $c = \theta_0$ (der-3-5-2): $\tilde\theta_0 = 0$, $\tilde\theta_1 = \theta_1 - \theta_0$, and then $p(y = 1 \mid x) = e^{\tilde\theta_1^\top x}/(1 + e^{\tilde\theta_1^\top x}) = \sigma(\tilde\theta_1^\top x)$ (der-3-5-3). $\theta_1$ alone is right only when $\theta_0 = 0$; $\theta_0 - \theta_1$ gives $p(y = 0 \mid x)$.

- id: q-u3-l5-008
  lesson: softmax-regression
  concepts: [softmax-nll-gradient]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    One example has logits $z = (2, 1, -1)$ and true class $y = 2$. Its loss is $\ell(z) = -z_y + \log\sum_j e^{z_j}$. Compute $\partial\ell/\partial z_2$ to three decimals.
  answer: -0.741
