- id: q-u3-l5-011
  lesson: softmax-regression
  concepts: [softmax-shift-invariance]
  type: predict
  difficulty: 2
  source: "original"
  prompt: |
    Predict the output (NumPy, float64; ignore any warning).
    ```python
    z = np.array([1000.0, 1000.0])
    print(np.exp(z) / np.exp(z).sum())
    ```
  options:
    - { text: "`[nan nan]`", correct: true }
    - { text: "`[0.5 0.5]`", misconception: softmax-overflow }
    - { text: "`[inf inf]`", misconception: softmax-overflow }
    - { text: "`[1. 1.]`" }
  explanation: |
    $e^{1000}$ overflows float64 (the largest finite value is about $e^{709.8}$), so `np.exp(z)` is `[inf inf]` and `inf / inf` is `nan`. The mathematical answer is $(0.5, 0.5)$; computing `np.exp(z - z.max())` first gives it, because subtracting the same number from every logit changes nothing (der-3-5-2 step 8).

- id: q-u3-l5-012
  lesson: softmax-regression
  concepts: [softmax-shift-invariance]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    Softmax regression with $K = 4$ classes on feature vectors of length $d = 11$ (the intercept included) stores $Kd = 44$ parameters. How many of them can the likelihood actually pin down, that is, how many remain after fixing one class as the reference?
  answer: 33
  tolerance: 0
  seeded: { K: [3, 4, 5, 10], d: [3, 5, 11, 785] }
  formula: "(K - 1) * d"
  explanation: |
    Shifting every $\theta_k$ by the same $c \in \mathbb{R}^d$ changes nothing (der-3-5-2), so $d$ directions are invisible to the likelihood. Fixing $\theta_K = 0$ removes exactly those, leaving $(K - 1)d$. With $K = 2$ this is $d$, the size of logistic regression's $\theta$.

- id: q-u3-l5-013
  lesson: softmax-regression
  concepts: [softmax-nll-gradient, softmax-shift-invariance]
  type: mc
  difficulty: 3
  source: "original"
  prompt: |
    For a single example, the per-class gradients of the softmax loss satisfy $\sum_{k=1}^{K}\nabla_{\theta_k}\ell = 0$. Which statement explains why?
  options:
    - {
        text: "Both the predicted probabilities and the one-hot label sum to 1 over the classes, so the factors $p_k - \\mathbb{1}[y = k]$ sum to 0",
        correct: true,
      }
    - {
        text: "At the minimum every gradient is zero",
      }
    - {
        text: "Only the true class has a nonzero gradient, and it is zero on average",
        misconception: softmax-grad-true-class-only,
      }
    - { text: "The loss is convex" }
  explanation: |
    der-3-5-5 step 9: $\sum_k (p_k - \mathbb{1}[y = k])\,x = (1 - 1)\,x = 0$ at every $\Theta$, not just at a minimum. It is the gradient's view of shift invariance: moving every $\theta_k$ by the same $c$ changes the loss at rate $\sum_k c^\top\nabla_{\theta_k}\ell = 0$.

- id: q-u3-l5-014
  lesson: softmax-regression
  concepts: [softmax-convexity]
  type: mc
  difficulty: 3
  source: "original"
  prompt: |
    Suppose $\hat\Theta$ minimizes the unpenalized softmax loss $\hat R(\Theta)$ on some dataset. Which statement is true?
  options:
    - {
        text: "$\\hat\\Theta + c\\mathbf{1}^\\top$ (every $\\hat\\theta_k$ shifted by the same $c$) is also a minimizer, so the minimizer is not unique",
        correct: true,
      }
    - {
        text: "$\\hat\\Theta$ is the unique minimizer, because $\\hat R$ is convex",
        misconception: softmax-params-unique,
      }
    - { text: "$\\hat R$ may have other local minima with higher loss" }
    - {
        text: "$\\hat\\Theta$ can be found in closed form from the stationarity equations",
      }
  explanation: |
    $\hat R$ is convex, so every stationary point is a global minimum and there are no worse local minima (der-3-5-6). It is not strictly convex: along the shift direction its second derivative is 0 (der-3-5-6 step 8), and by der-3-5-2 the loss is exactly constant there. The stationarity equations $\sum_i p_k(x^{(i)})x^{(i)} = \sum_{i:\,y^{(i)} = k}x^{(i)}$ are nonlinear in $\Theta$, so there is no closed form.

- id: q-u3-l5-015
  lesson: softmax-regression
  concepts: [softmax-regression]
  type: mc
  difficulty: 1
  source: "original"
  prompt: |
    A softmax regression model has logits $z = (0.3, 2.1, -4.0, 2.0)$ for a new patient. Which class does it predict, and do you need to compute any exponentials to decide?
  options:
    - {
        text: "Class 2; no, the largest logit has the largest probability",
        correct: true,
      }
    - {
        text: "Class 2; yes, the probabilities must be computed before taking the argmax",
      }
    - { text: "Class 3; the most negative logit has the largest magnitude" }
    - { text: "It cannot be decided without the true label" }
  explanation: |
    $p_k / p_l = e^{z_k - z_l}$, so $p_k > p_l$ exactly when $z_k > z_l$ (der-3-5-1 step 6). The exponentials matter for how confident the model is ($p_2$ and $p_4$ are close here), not for which class wins.

