- id: q-u3-l5-010
  lesson: softmax-regression
  concepts: [softmax-nll-gradient]
  type: order
  difficulty: 2
  source: "original"
  prompt: |
    Put the moves of the softmax negative log-likelihood derivation (der-3-5-4) in order.
