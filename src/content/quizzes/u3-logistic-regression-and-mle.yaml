# L5 p.38 statement 3 is item 010. The L6 p.20 poll lives in lesson 3.2's section; this lesson's Checks reuse those items.
# L5 p.38 statements 1-2 (decision boundary) belong to lesson 3.1; L6 p.20 (a) and L5 p.49 to lesson 3.2.

- id: q-u3-l3-001
  lesson: deriving-the-logistic-regression-objective
  concepts: [logistic-regression-model]
  type: mc
  difficulty: 1
  source: "original"
  prompt: |
    In logistic regression, $P_\theta(y = 1 \mid x) = \sigma(\theta^\top x)$. What does the model say about how the inputs $x$ are distributed?
  options:
    - {
        text: "Nothing: it models only the conditional distribution of $y$ given $x$",
        correct: true,
      }
    - {
        text: "That $x$ is Gaussian within each class",
        misconception: lr-dropped-px,
      }
    - {
        text: "That $x$ is uniform, which is why $P(x)$ drops out of the likelihood",
        misconception: lr-dropped-px,
      }
    - {
        text: 'That $x$ follows a Bernoulli distribution with parameter $\sigma(\theta^\top x)$',
      }
  explanation: |
    def-3-3-1 specifies $y \mid x \sim \mathrm{Bernoulli}(\sigma(\theta^\top x))$ and nothing else. That is why $\sum_i \log P(x^{(i)})$ carries no $\theta$ and can be dropped (der-3-3-1 step 6). It is the label, not the input, that is Bernoulli. A model that also assumes Gaussian inputs per class is GDA (Unit 7).
  discriminates: [logistic-regression-model, discriminative-model]

- id: q-u3-l3-003
  lesson: deriving-the-logistic-regression-objective
  concepts: [bernoulli-cross-entropy-equivalence]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    The slides write the probability of a label as $y\hat p + (1 - y)(1 - \hat p)$; the course convention is $\hat p^{\,y}(1 - \hat p)^{1-y}$. For which values of $y$ are the two equal for every $\hat p \in (0, 1)$?
  options:
    - { text: 'Exactly $y \in \{0, 1\}$', correct: true }
    - {
        text: 'Every $y \in [0, 1]$',
        misconception: lr-additive-form-soft-labels,
      }
    - { text: "Only $y = 1$" }
    - { text: "They are never equal; the slides use an approximation" }
  explanation: |
    der-3-3-2 steps 1–2 check $y = 1$ (both give $\hat p$) and $y = 0$ (both give $1 - \hat p$). For a fractional label they differ: at $y = \tfrac12$ the additive form is the constant $\tfrac12$, while the product form is $\sqrt{\hat p(1 - \hat p)}$.
  discriminates: [bernoulli-cross-entropy-equivalence]

- id: q-u3-l3-005
  lesson: deriving-the-logistic-regression-objective
  concepts: [logistic-gradient]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    One patient has feature value $x_j = 15$ (age minus 60), label $y = 1$, and predicted probability $\hat p = 0.0334$. What is the $j$-th component of the gradient of this patient's loss, $\partial \ell / \partial \theta_j$? Give three decimal places.
  answer: -14.499
  tolerance: 0.0005
  seeded:
    { p: [0.0334, 0.1, 0.3, 0.7, 0.9], y: [0, 1], xj: [-20, -5, 2, 10, 15] }
  formula: "(p - y) * xj"
  explanation: |
    der-3-3-3 step 6: $\nabla_\theta \ell = (\hat p - y)\,x$, so the $j$-th component is $(\hat p - y)\,x_j = (0.0334 - 1) \times 15 = -14.499$. This is ADV-0001's age component in the worked example. The negative sign means gradient descent increases $\theta_j$.

- id: q-u3-l3-006
  lesson: deriving-the-logistic-regression-objective
  concepts: [logistic-gradient]
  type: which-step
  difficulty: 2
  source: "original"
  derivation: der-3-3-3
  corrupt:
    {
      step: 4,
      replaceTex: '\frac{d\ell}{dz} = y - \sigma(z)',
      explanation: 'Expanding step 3 gives $-y + y\sigma(z) + \sigma(z) - y\sigma(z) = \sigma(z) - y$. The corrupted sign is the derivative of the log-likelihood, not of the loss; plugged into gradient descent it would walk uphill and make the loss grow.',
    }

- id: q-u3-l3-007
  lesson: deriving-the-logistic-regression-objective
  concepts: [logistic-gradient]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    The least-squares gradient is $\frac2n\sum_i(\theta^\top x^{(i)} - y^{(i)})\,x^{(i)}$ and the logistic gradient is $\frac1n\sum_i(\sigma(\theta^\top x^{(i)}) - y^{(i)})\,x^{(i)}$. What is the essential difference?
  options:
    - {
        text: "The prediction inside the residual: the raw score for least squares, its sigmoid for logistic regression",
        correct: true,
      }
    - {
        text: 'Logistic regression weights each example by $\hat p(1 - \hat p)$ in the gradient',
        misconception: lr-mse-on-sigmoid,
      }
    - {
        text: "The sign: logistic regression uses label minus prediction",
        misconception: lr-gradient-sign,
      }
    - { text: "Logistic regression has no input factor $x^{(i)}$" }
  explanation: |
    Both are averages of residual times input (der-3-3-3 step 7). The weights $\hat p(1 - \hat p)$ appear one derivative later, in the Hessian (der-3-3-4 step 3); they cancel out of the gradient because $\sigma'/\sigma = 1 - \sigma$ (der-3-3-3 step 1). The factor 2 is a constant from differentiating a square and does not change the minimizer.
  discriminates: [logistic-gradient, mse-gradient]

- id: q-u3-l3-008
  lesson: deriving-the-logistic-regression-objective
  concepts: [logistic-convexity]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    The Hessian of the logistic NLL is $\frac1n\sum_i \hat p^{(i)}(1 - \hat p^{(i)})\,x^{(i)}x^{(i)\top}$. Why is it positive semi-definite?
  options:
    - {
        text: 'For any $v$, $v^\top H v$ is a sum of positive weights times squares $(x^{(i)\top}v)^2$',
        correct: true,
      }
    - { text: "Because every entry of the matrix is non-negative" }
    - { text: "Because the sigmoid is convex" }
    - { text: 'Because $\hat p^{(i)}(1 - \hat p^{(i)}) \le \tfrac14$' }
  explanation: |
    der-3-3-4 steps 5–6. Non-negative entries do not make a matrix PSD (and $x^{(i)}x^{(i)\top}$ can have negative entries). The sigmoid is not convex: it is convex for $z < 0$ and concave for $z > 0$. The bound $\tfrac14$ caps the curvature from above, which matters for the step size, not for convexity.
  discriminates: [logistic-convexity, positive-semidefinite]

- id: q-u3-l3-009
  lesson: deriving-the-logistic-regression-objective
  concepts: [logistic-convexity]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Which statement about the logistic NLL $\hat R(\theta)$ is correct?
  options:
    - {
        text: 'If $X$ has full column rank, $\hat R$ is strictly convex, so it has at most one minimizer',
        correct: true,
      }
    - {
        text: 'Because $\hat R$ is convex, it always has exactly one minimizer',
        misconception: lr-mle-always-exists,
      }
    - {
        text: 'Gradient descent can stop at a poor local minimum of $\hat R$',
        misconception: lr-no-closed-form-means-local,
      }
    - { text: '$\hat R$ is convex only near its minimizer' }
  explanation: |
    der-3-3-4 step 9 gives a positive definite Hessian at every $\theta$ when $X$ has full column rank, so two minimizers cannot exist. Existence is a separate question: on separable data there is none (der-3-3-6). Convexity holds for all $\theta$, so every stationary point is global.
  discriminates: [logistic-convexity, logistic-no-closed-form]

- id: q-u3-l3-010
  lesson: deriving-the-logistic-regression-objective
  concepts: [logistic-no-closed-form]
  type: mc
  difficulty: 1
  source: "L5 p.38 poll"
  prompt: |
    True or false: we can derive the closed-form optimal parameter for logistic regression given data, just like in linear regression.
  options:
    - { text: "True", misconception: mle-always-closed-form }
    - { text: "False", correct: true }
  explanation: |
    False (the course map's key). Setting the gradient to zero gives $X^\top\sigma(X\hat\theta) = X^\top y$ (der-3-3-5 step 3), with $\hat\theta$ inside $n$ different sigmoids; the linear normal equations $X^\top X\hat\theta = X^\top y$ have no such obstacle. The exceptions are models with one parameter per group of identical inputs, such as an intercept only (der-3-3-5 step 7).

- id: q-u3-l3-011
  lesson: deriving-the-logistic-regression-objective
  concepts: [logistic-no-closed-form]
  type: predict
  difficulty: 2
  source: "original"
  prompt: |
    You run unregularized gradient descent on the logistic NLL for a dataset in which a line separates the events from the non-events perfectly. Predict what you see as the iterations continue.
  options:
    - {
        text: 'The training loss keeps falling toward 0 and $\lVert\theta\rVert$ keeps growing; the iterates never settle',
        correct: true,
      }
    - {
        text: 'The loss reaches exactly 0 at a finite $\theta$ and gradient descent stops',
        misconception: lr-mle-always-exists,
      }
    - {
        text: "The iterates converge to the unique minimizer, since the NLL is convex",
        misconception: lr-mle-always-exists,
      }
    - { text: 'The loss diverges to $+\infty$' }
  explanation: |
    der-3-3-6: along a separating direction $w$, $\hat R(cw) \to 0$ as $c \to \infty$, yet $\hat R(\theta) > 0$ for every $\theta$, so there is no minimizer to converge to. Convexity says a minimizer would be global and unique, not that one exists. A penalty $\lambda\lVert\theta\rVert_2^2$ (Unit 5) restores one.
  discriminates: [logistic-no-closed-form, logistic-convexity]

- id: q-u3-l3-012
  lesson: deriving-the-logistic-regression-objective
  concepts: [logistic-nll, bernoulli-cross-entropy-equivalence]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    ADVERSE patient ADV-0003 had no event ($y = 0$) and predicted probability $\hat p = 0.0554$. What is this patient's cross-entropy loss, using the natural log? Give three decimal places.
  answer: 0.057
  tolerance: 0.0005
  seeded: { p: [0.0554, 0.1, 0.25, 0.5, 0.8] }
  formula: "-log(1 - p)"
  explanation: |
    With $y = 0$ only the second term of $-[y\log\hat p + (1 - y)\log(1 - \hat p)]$ survives, so the loss is $-\log(1 - \hat p) = -\log 0.9446 = 0.057$. Compare ADV-0001, who had an event at $\hat p = 0.0334$ and costs $-\log 0.0334 = 3.40$: surprises are expensive.

- id: q-u3-l3-013
  lesson: deriving-the-logistic-regression-objective
  concepts: [logistic-no-closed-form]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    A cohort of $n = 5000$ patients has $k = 310$ events. Fit logistic regression with an intercept only. What is $\hat\theta_0$? Give three decimal places.
  answer: -2.717
  tolerance: 0.0005
  seeded: { k: [50, 310, 500, 1000, 2500], n: [5000, 10000] }
  formula: "log(k / (n - k))"
  explanation: |
    der-3-3-5 steps 6–7: with every $x^{(i)} = 1$ the stationarity condition is $n\,\sigma(\hat\theta_0) = k$, so $\sigma(\hat\theta_0) = \bar y = k/n$ and $\hat\theta_0 = \log\frac{\bar y}{1 - \bar y} = \log\frac{k}{n - k} = \log\frac{310}{4690} = -2.717$. The fitted probability is the event rate, as in the coin-flip MLE of lesson 3.2.

- id: q-u3-l3-014
  lesson: deriving-the-logistic-regression-objective
  concepts: [logistic-nll]
  type: order
  difficulty: 2
  source: "original"
  prompt: |
    Put the moves of der-3-3-1 (from the likelihood to the logistic-regression loss) in order.
  items:
    - "Write the probability of the dataset as a product over independent examples."
    - 'Factor each term as $P_\theta(y^{(i)} \mid x^{(i)})\,P(x^{(i)})$.'
    - "Take the log, turning the product into a sum."
    - 'Drop $\sum_i \log P(x^{(i)})$, which does not depend on $\theta$.'
    - "Negate, turning the argmax into an argmin, and divide by $n$."
  explanation: |
    Independence, product rule, log, drop the constant, negate (L5 pp.44–48). Taking the log before factoring would also work, but dropping the input term needs the factorization first: only after step 3 is the $\theta$-free part a separate factor.

- id: q-u3-l3-016
  lesson: deriving-the-logistic-regression-objective
  concepts: [logistic-nll]
  type: which-step
  difficulty: 1
  source: "original"
  derivation: der-3-3-1
  corrupt:
    {
      step: 8,
      replaceTex: '\hat\theta = \argmin_\theta\; \sum_{i=1}^{n} \log\Big[y^{(i)}\sigma(\theta^\top x^{(i)}) + (1 - y^{(i)})\big(1 - \sigma(\theta^\top x^{(i)})\big)\Big]',
      explanation: "The argmax became an argmin but the objective was not negated. Minimizing the log-likelihood finds the least likely parameters. Maximizing $f$ is minimizing $-f$, so both the operator and the sign must change together.",
