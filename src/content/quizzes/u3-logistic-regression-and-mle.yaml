    $\partial\ell/\partial z_l = p_l - \mathbb{1}[y = l]$ (der-3-5-6 step 1, the logit form of der-3-5-5 step 6). For the true class $l = 2$: $p_2 - 1 = 0.2595 - 1 \approx -0.741$. The derivative is negative, so gradient descent raises $z_2$.

- id: q-u3-l5-009
  lesson: softmax-regression
  type: which-step
  difficulty: 2
  source: "original"
  derivation: der-3-5-5
  corrupt:
    {
