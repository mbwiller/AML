# ---------- Lesson 3.1: classification-and-the-sigmoid ----------
# Poll items carry source "L5 p.38 poll" (docs/course-map/02-lectures-L4-L5.md, L5 poll section).
# The p.38 "select all correct statements" poll is split into one true/false item per statement.
# Statements 1 and 2 (linear boundary; nonlinear boundaries via features) are here; statement 3
# (no closed form) belongs to lesson 3.3. The p.12 poll is Unit 2's; the p.49 poll is lesson 3.2's.

- id: q-u3-l1-001
  lesson: classification-and-the-sigmoid
  concepts: [log-odds-logit, sigmoid-function]
  type: mc
  difficulty: 1
  source: "L5 p.38 poll"
  prompt: |
    True or false: logistic regression learns a linear decision boundary between 2 classes.
  options:
    - { text: "True", correct: true }
    - { text: "False", misconception: sigmoid-boundary-curved }
  explanation: |
    True (the course map's key). The sigmoid is strictly increasing with $\sigma(0) = \tfrac12$, so $\sigma(\theta^\top x) \ge \tfrac12$ exactly when $\theta^\top x \ge 0$ (der-3-1-7 step 2). The boundary $\theta^\top x = 0$ is a hyperplane in the features the model sees.
  discriminates: [log-odds-logit, sigmoid-function]

- id: q-u3-l1-002
  lesson: classification-and-the-sigmoid
  concepts: [log-odds-logit]
  type: mc
  difficulty: 2
  source: "L5 p.38 poll"
  prompt: |
    True or false: logistic regression can also learn nonlinear decision boundaries (nonlinear with respect to the features).
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    True, in the sense the course map's key gives: if the model is fed engineered features $\phi(x)$, such as $x_1^2$ or $x_1 x_2$, the boundary $\theta^\top \phi(x) = 0$ is a hyperplane in $\phi$-space but a curve in the original inputs. The sigmoid itself never bends the boundary (der-3-1-7); the curvature comes from the feature map.

- id: q-u3-l1-003
  lesson: classification-and-the-sigmoid
  concepts: [thresholded-linear-regression-fails]
  type: mc
  difficulty: 1
  source: "original"
  prompt: |
    You fit least squares to 0/1 labels and predict class 1 when the fitted value exceeds 0.5. Which statement is true for every such model whose slope vector $w = (\theta_1, \dots, \theta_d)$ is nonzero?
  options:
    - {
        text: "Some inputs get fitted values above 1 and some get fitted values below 0.",
        correct: true,
      }
    - {
        text: "Fitted values stay in $[0, 1]$ because the labels are in $\\{0, 1\\}$.",
        misconception: linreg-bounded-by-labels,
      }
    - {
        text: "Fitted values can exceed 1 but never fall below 0.",
        misconception: linreg-bounded-by-labels,
      }
    - {
        text: "Clipping the fitted values to $[0, 1]$ fixes the boundary as well.",
        misconception: threshold-linreg-only-bounds,
      }
  explanation: |
    Along the direction $u = t\,w$ the score is $\theta_0 + t\lVert w \rVert_2^2$, a line in $t$ with positive slope, so it passes above 1 and below 0 (der-3-1-2). Clipping repairs the outputs but not the fit: squared error still lets far, correctly classified points drag the threshold (the lesson's Intuition).

- id: q-u3-l1-004
  lesson: classification-and-the-sigmoid
  concepts: [classification-vs-regression]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    For a label $Y \in \{0, 1\}$, the predictor $h(x)$ that minimizes the expected squared error $\mathbb{E}[(Y - h(X))^2]$ is
  options:
    - { text: "$P(Y = 1 \\mid X = x)$", correct: true }
    - {
        text: "the most likely label at $x$, which is 0 or 1",
      }
    - { text: "$\\tfrac12$ for every $x$" }
    - {
        text: "$\\log\\frac{P(Y = 1 \\mid X = x)}{P(Y = 0 \\mid X = x)}$",
      }
  explanation: |
    The minimizer is the conditional mean (der-2-1-5), and for a 0/1 label $\mathbb{E}[Y \mid X = x] = 0 \cdot P(Y = 0 \mid x) + 1 \cdot P(Y = 1 \mid x) = P(Y = 1 \mid x)$ (der-3-1-1). Squared error rewards hedging, so it targets the probability, not the hard label.

- id: q-u3-l1-005
  lesson: classification-and-the-sigmoid
  concepts: [sigmoid-function]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    A logistic model gives $\sigma(z) = s = 0.73$ for some score $z$. What is $\sigma(-z)$? Give two decimal places.
  answer: 0.27
  tolerance: 0.005
  seeded: { s: [0.6, 0.73, 0.85, 0.9, 0.95] }
  formula: "1 - s"
  explanation: |
    $\sigma(-z) = 1 - \sigma(z)$ (der-3-1-3 step 11). In logistic regression this is why $P_\theta(y = 0 \mid x) = \sigma(-\theta^\top x)$: swapping the labels negates $\theta$.

- id: q-u3-l1-006
  lesson: classification-and-the-sigmoid
  concepts: [sigmoid-derivative]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    At some score $z$ the sigmoid equals $s = 0.2$. What is $\sigma'(z)$? Give two decimal places.
  answer: 0.16
  tolerance: 0.005
  seeded: { s: [0.1, 0.2, 0.3, 0.5, 0.8] }
  formula: "s * (1 - s)"
  explanation: |
    $\sigma'(z) = \sigma(z)(1 - \sigma(z)) = 0.2 \times 0.8 = 0.16$ (der-3-1-4 step 6). You never need $z$ itself; this is why the derivative is cheap once $\sigma(z)$ has been computed.

- id: q-u3-l1-007
  lesson: classification-and-the-sigmoid
  concepts: [log-odds-logit]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    Which score $z$ gives $\sigma(z) = p$ for $p = 0.8$? Give three decimal places.
  answer: 1.386
  tolerance: 0.0005
  seeded: { p: [0.2, 0.5, 0.8, 0.9, 0.99] }
  formula: "log(p / (1 - p))"
  explanation: |
    By der-3-1-5, $z = \log\frac{p}{1 - p} = \log 4 \approx 1.386$. Odds of 4 to 1 correspond to log-odds $\log 4$; $p = 0.5$ gives $z = 0$, and $p = 0.2$ gives $-\log 4$, by the symmetry of der-3-1-3.

- id: q-u3-l1-008
  lesson: classification-and-the-sigmoid
  concepts: [sigmoid-derivative]
  type: which-step
  difficulty: 2
  source: "original"
  derivation: der-3-1-4
  corrupt:
    {
      step: 5,
      replaceTex: '\frac{e^{-z}}{1 + e^{-z}} = \sigma(z)',
      explanation: 'The fraction with $e^{-z}$ on top is $\sigma(-z)$, which equals $1 - \sigma(z)$ by der-3-1-3. With this error the result would read $\sigma'' = \sigma^2$, which is largest where $\sigma$ is near 1, but the sigmoid flattens there.',
    }

- id: q-u3-l1-009
  lesson: classification-and-the-sigmoid
  concepts: [log-odds-logit]
  type: which-step
  difficulty: 2
  source: "original"
  derivation: der-3-1-5
  corrupt:
    {
      step: 5,
      replaceTex: 'z = \log\frac{1 - p}{p}',
      explanation: 'Step 4 gives $-z = \log\frac{1-p}{p}$; multiplying by $-1$ flips the fraction inside the log. The corrupted version would give $z > 0$ for $p < \tfrac12$, contradicting $\sigma(z) > \tfrac12 \iff z > 0$.',
    }

- id: q-u3-l1-010
  lesson: classification-and-the-sigmoid
  concepts: [sigmoid-derivative]
  type: order
  difficulty: 2
  source: "original"
  prompt: |
    Put the moves of der-3-1-4 (the derivative of the sigmoid) in order.
  items:
    - 'Write $\sigma(z) = (1 + e^{-z})^{-1}$.'
    - 'Apply the chain rule to the power $-1$: $\sigma''(z) = -(1 + e^{-z})^{-2} \cdot \frac{d}{dz}(1 + e^{-z})$.'
    - "Differentiate $e^{-z}$ to $-e^{-z}$; the minus signs cancel, giving $e^{-z}/(1 + e^{-z})^2$."
    - 'Split into $\frac{1}{1 + e^{-z}} \cdot \frac{e^{-z}}{1 + e^{-z}}$.'
    - 'Recognize the factors as $\sigma(z)$ and $1 - \sigma(z)$.'
  explanation: |
    Differentiate first (chain rule twice), then rewrite in terms of $\sigma$ itself. The last move uses the symmetry $1 - \sigma(z) = \sigma(-z) = e^{-z}/(1 + e^{-z})$ from der-3-1-3.

- id: q-u3-l1-011
  lesson: classification-and-the-sigmoid
  concepts: [log-odds-logit]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    In a fitted logistic regression the coefficient of a binary feature (NSAID use) is $\theta_j = 1.2$. For a patient who starts an NSAID, with every other feature unchanged, which statement is true?
  options:
    - {
        text: "The odds of the event are multiplied by $e^{1.2} \\approx 3.32$, whatever the patient's other features.",
        correct: true,
      }
    - {
        text: "The probability of the event rises by 1.2.",
        misconception: coef-is-probability-change,
      }
    - {
        text: "The probability of the event is multiplied by $e^{1.2}$.",
        misconception: odds-ratio-is-risk-ratio,
      }
    - {
        text: "The probability rises by the same amount for every patient.",
        misconception: coef-is-probability-change,
      }
  explanation: |
    The log-odds are $\theta^\top x$, so adding 1 to $x_j$ adds $\theta_j$ to the log-odds and multiplies the odds by $e^{\theta_j}$ (der-3-1-6). The probability change is $\sigma'(\xi)\,\theta_j$ for some score $\xi$ between the two (the mean value theorem: the average slope equals the slope at some point in between); it depends on the patient and is at most $\lvert\theta_j\rvert / 4$. Multiplying a probability by 3.32 could exceed 1; multiplying odds cannot break anything.

- id: q-u3-l1-012
  lesson: classification-and-the-sigmoid
  concepts: [log-odds-logit]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    A logistic model has coefficient $b = 1.2$ on a binary feature. By what factor does switching that feature from 0 to 1 multiply a patient's odds of the event? Give two decimal places.
  answer: 3.32
  tolerance: 0.005
  seeded: { b: [0.6, 1.2, 0.03, 0.05] }
  formula: "exp(b)"
  explanation: |
    The odds ratio for a one-unit increase is $e^{b}$ (der-3-1-6), here $e^{1.2} \approx 3.320$. The lesson's worked example checks it on patient ADV-0023: odds $0.2118$ without and $0.7033$ with the NSAID. The other seeded values are ADVERSE's high-potassium, per-year-of-age, and per-milligram coefficients.

- id: q-u3-l1-013
  lesson: classification-and-the-sigmoid
  concepts: [sigmoid-derivative]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Where is the sigmoid steepest, and how steep is it there?
  options:
    - { text: "At $z = 0$, with slope $\\tfrac14$", correct: true }
    - { text: "At $z = 0$, with slope 1", misconception: sigmoid-slope-value-not-derivative }
    - {
        text: "At $z = 0$, with slope $\\tfrac12$",
        misconception: sigmoid-slope-value-not-derivative,
      }
    - {
        text: "It has no steepest point; the slope grows without bound as $z \\to \\infty$",
      }
  explanation: |
    $\sigma'(z) = \sigma(1 - \sigma) = \tfrac14 - (\sigma - \tfrac12)^2 \le \tfrac14$, with equality only where $\sigma(z) = \tfrac12$, at $z = 0$ (der-3-1-4 steps 8 and 9). The value $\tfrac12$ is $\sigma(0)$, not its slope.

- id: q-u3-l1-014
  lesson: classification-and-the-sigmoid
  concepts: [sigmoid-function]
  type: predict
  difficulty: 1
  source: "original"
  prompt: |
    Predict the output.
    ```python
    import numpy as np
    z = np.array([0., 2., -2.])
    print(np.round(1 / (1 + np.exp(-z)), 3))
    ```
  options:
    - { text: "`[0.5   0.881 0.119]`", correct: true }
    - { text: "`[0.    0.881 0.119]`" }
    - { text: "`[0.5   0.119 0.881]`" }
    - { text: "`[1.    1.    0.   ]`" }
  explanation: |
    $\sigma(0) = \tfrac12$ (der-3-1-3 step 4); $\sigma$ is increasing, so $\sigma(2) > \tfrac12$; and $\sigma(-2) = 1 - \sigma(2)$ by symmetry, so the last two entries sum to 1. The sigmoid never reaches exactly 0 or 1, so the last option is impossible even before rounding.

- id: q-u3-l1-015
  lesson: classification-and-the-sigmoid
  concepts: [log-odds-logit]
  type: mc
  difficulty: 3
  source: "original"
  prompt: |
    A safety team flags a patient when $\sigma(\theta^\top x) \ge t = 0.2$ instead of $0.5$. The new decision boundary is
  options:
    - {
        text: "the hyperplane $\\theta^\\top x = \\log\\frac{0.2}{0.8} = -\\log 4$, parallel to $\\theta^\\top x = 0$",
        correct: true,
      }
    - {
        text: "the hyperplane $\\theta^\\top x = 0.2$",
        misconception: threshold-on-score-scale,
      }
    - {
        text: "a curved surface, because the sigmoid is nonlinear",
        misconception: sigmoid-boundary-curved,
      }
    - {
        text: "still $\\theta^\\top x = 0$; the threshold does not move the boundary",
      }
  explanation: |
    $\sigma$ is strictly increasing, so $\sigma(\theta^\top x) \ge t \iff \theta^\top x \ge \sigma^{-1}(t) = \log\frac{t}{1 - t}$ (der-3-1-7 steps 4 and 5). Lowering $t$ slides the hyperplane toward the class-0 side, so more patients are flagged; Unit 4 chooses $t$ from the costs of missed events and false alarms.

- id: q-u3-l1-016
  lesson: classification-and-the-sigmoid
  concepts: [sigmoid-function]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    For which real scores $z$ is $\sigma(z) = 1$ exactly?
  options:
    - {
        text: "None; $\\sigma(z) < 1$ for every real $z$, and 1 is only the limit as $z \\to \\infty$.",
        correct: true,
      }
    - {
        text: "Every $z$ above about 40, where floating-point arithmetic rounds it to 1.",
        misconception: sigmoid-reaches-0-1,
      }
    - { text: "Exactly $z = 1$" }
    - { text: "Every $z \\ge 0$" }
  explanation: |
    $1 + e^{-z} > 1$ for every real $z$, so $\sigma(z) = 1/(1 + e^{-z}) < 1$ (der-3-1-3 steps 1 to 3 and 7). A computer may print 1.0 for large $z$, but that is rounding, not mathematics; it is also why careful code computes $\log\sigma(z)$ directly rather than taking the log of a rounded 1.0 or 0.0.

# ---------- Lesson 3.2: maximum-likelihood-principle ----------
# Poll items: L5 p.49 and L6 p.20 "Select all correct statements" (docs/course-map/02-lectures-L4-L5.md,
# L5 poll section; docs/course-map/03-lectures-L6-L7.md, L6 poll section), split into one true/false item
# per statement with the course map's key. The L5 p.38 poll (decision boundary, closed form) belongs to
# lessons 3.1 and 3.3.

- id: q-u3-l2-001
  lesson: maximum-likelihood-principle
  concepts: [mle-principle]
  type: mc
  difficulty: 1
  source: "L5 p.49 poll"
  prompt: |
    True or false: maximum-likelihood estimation of probability distributions is based on the theory that the world is a terribly boring place.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    True (the course map's key, following L5 p.42). The assumption is that the observed data are typical of the process that generated them, so a good distribution should give them high probability. The slide adds that this is "not necessarily true": an unrepresentative sample is fitted just as faithfully.
  discriminates: [mle-principle, maximum-likelihood-estimation]

- id: q-u3-l2-002
  lesson: maximum-likelihood-principle
  concepts: [maximum-likelihood-estimation]
  type: mc
  difficulty: 1
  source: "L5 p.49 poll"
  prompt: |
    True or false: maximum-likelihood estimation estimates the values of the parameters of a probability distribution such that they maximize the probability of the training data.
  options:
    - { text: "True", correct: true }
    - { text: "False", misconception: likelihood-is-posterior }
  explanation: |
    True. $\hat\theta = \argmax_\theta P_\theta(\mathcal{D})$ (equation 3.2.1). Note what it does not say: it does not maximize the probability of $\theta$ given the data, which would need a prior.
  discriminates: [maximum-likelihood-estimation, likelihood-vs-probability]

- id: q-u3-l2-003
  lesson: maximum-likelihood-principle
  concepts: [mle-principle]
  type: mc
  difficulty: 1
  source: "L6 p.20 poll"
  prompt: |
    True or false: MLE is a general principle for defining the objective (loss) of a supervised machine-learning problem; it works beyond logistic regression.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    True. Any model that assigns a probability to the data defines a negative log-likelihood loss. In this lesson it gives estimates for a coin, a die, and a Gaussian; in lesson 3.4 it gives least squares; in Units 6 and 7 it fits Naive Bayes and GDA.
  discriminates: [mle-principle]

- id: q-u3-l2-004
  lesson: maximum-likelihood-principle
  concepts: [mle-principle, mle-coin-flip]
  type: mc
  difficulty: 2
  source: "L6 p.20 poll"
  prompt: |
    True or false: the maximum-likelihood estimate can always be solved for directly, without gradient descent.
  options:
    - { text: "True", misconception: mle-always-closed-form }
    - { text: "False", correct: true }
  explanation: |
    False. The coin, die, and Gaussian estimates of this lesson have closed forms (der-3-2-4, der-3-2-5, der-3-2-6), but the first-order condition for logistic regression cannot be solved for $\theta$ in closed form (lesson 3.3).
  discriminates: [mle-principle, mle-coin-flip]

- id: q-u3-l2-005
  lesson: maximum-likelihood-principle
  concepts: [mle-principle]
  type: mc
  difficulty: 1
  source: "L6 p.20 poll"
  prompt: |
    True or false: when deriving the MLE we need to write down the likelihood of the data given the model parameters, under the modeling assumptions.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    True. The likelihood is the first step of every derivation in this lesson, and it uses the assumptions explicitly: i.i.d. draws turn it into a product (der-3-2-4 step 2), and the chosen family (Bernoulli, categorical, Gaussian) supplies each factor.
  discriminates: [mle-principle, iid]

- id: q-u3-l2-006
  lesson: maximum-likelihood-principle
  concepts: [mle-principle]
  type: mc
  difficulty: 1
  source: "L6 p.20 poll"
  prompt: |
    True or false: the goal of MLE is to find the parameters within the chosen model class that are most likely to generate the data, and we do so by maximizing the negative log-likelihood.
  options:
    - { text: "True", misconception: nll-maximize }
    - { text: "False", correct: true }
  explanation: |
    False. The first half is right; the second has the sign backwards. Negating reverses the inequality (der-3-2-3 step 4), so we minimize the negative log-likelihood, or equivalently maximize the log-likelihood.
  discriminates: [mle-principle, log-likelihood]

- id: q-u3-l2-007
  lesson: maximum-likelihood-principle
  concepts: [mle-coin-flip]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    A biased coin is flipped independently; you observe $H = 12$ heads and $T = 28$ tails. What is the maximum-likelihood estimate of the probability of heads? Give two decimals.
  answer: 0.3
  tolerance: 0.005
  seeded: { H: [3, 7, 12, 18, 25], T: [5, 13, 28, 32] }
  formula: "H / (H + T)"
  explanation: |
    By der-3-2-4, $\hat\theta = \#H/(\#H + \#T)$: the empirical frequency of heads.

