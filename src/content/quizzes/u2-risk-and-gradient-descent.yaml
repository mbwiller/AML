  corrupt: { step: 7, replaceTex: '\nabla_\theta\, (X^\top y)^\top\theta = y^\top X', explanation: 'With $b = X^\top y$, $\nabla_\theta\, b^\top\theta = b = X^\top y$, a column with one entry per parameter. $y^\top X$ is its transpose, a row, and subtracting it from the column $2X^\top X\theta$ in step 9 would not be defined.' }

- id: q-u2-l4-011
  lesson: gradient-descent
  type: which-step
  difficulty: 1
  source: "original"
  derivation: der-2-4-4
  corrupt: { step: 4, replaceTex: '\frac{\partial\, \theta^\top x^{(i)}}{\partial \theta_j} = \theta_j', explanation: 'We differentiate with respect to the parameter $\theta_j$, so its coefficient $x^{(i)}_j$ remains. $\theta_j$ is the derivative with respect to the feature $x_j$ (the slope of der-1-2-2), the wrong variable here.' }

- id: q-u2-l4-012
  lesson: gradient-descent
  concepts: [mse-gradient, lms-update]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    Toy numbers: one training example $(x, y) = (2, 4)$, the model $f_\theta(x) = \theta x$ with no intercept, and $\hat R(\theta) = (\theta x - y)^2$. Starting from $\theta^{(0)} = 0$ with $\eta = 0.1$, compute $\theta^{(1)}$.
  answer: 1.6
  tolerance: 0.0001
  seeded: { eta: [0.05, 0.1, 0.2], x: [1, 2, 3], y: [1, 2, 4] }
  formula: "2 * eta * x * y"
  explanation: |
    der-2-4-4 step 5 with one parameter gives $\hat R'(\theta) = 2(\theta x - y)\,x$. At $\theta = 0$ this is $-2xy$, so $\theta^{(1)} = 0 - \eta(-2xy) = 2\eta x y$. The step moves $\theta$ up from 0, in the direction of the exact fit $y/x$; whether it stops short of $y/x$ or passes it depends on $\eta x^2$, which lesson 2.5 analyzes.

- id: q-u2-l4-013
  lesson: gradient-descent
  concepts: [gd-on-empirical-risk, learning-rate]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    In the companion's loop on $n = 20$ patients you replace `mse_loss` (the mean of the squared residuals) by their sum and keep `step_size = 0.1`. What changes?
  options:
    - { text: "The minimizer is the same, but every gradient is 20 times larger, so the run behaves like the mean with $\\eta = 2$", correct: true }
    - { text: "Nothing: $\\eta = 0.1$ produces the same steps for either loss", misconception: scale-free-learning-rate }
    - { text: "The minimizer moves, because the loss function changed" }
    - { text: "Every step becomes 20 times shorter" }
  explanation: |
    The sum is $n\hat R(\theta)$: multiplying by a positive constant does not move the minimizer, but it multiplies the gradient by $n$. The step $\eta\,\nabla(n\hat R) = (n\eta)\,\nabla\hat R$ is the mean's step with learning rate $n\eta = 2$. A rate that converges for the mean can diverge for the sum.

- id: q-u2-l4-014
  lesson: gradient-descent
  concepts: [autograd, chain-rule-calculus]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    For the companion's toy loss $\ell(\theta) = 0.5\,(2\theta_1 - 2)^2 + 0.5\,(\theta_0 - 3)^2$, autograd at $\theta = (-2, 3)$ returns $\partial\ell/\partial\theta_1 = 8$. What does it return for $\partial\ell/\partial\theta_1$ at $\theta = (\theta_0, \theta_1) = (-2, 5)$?
  answer: 16
  tolerance: 0
  seeded: { t1: [-1, 0, 2, 5, 7] }
  formula: "4 * t1 - 4"
  explanation: |
    By the chain rule, $\partial\ell/\partial\theta_1 = (2\theta_1 - 2)\cdot 2 = 4\theta_1 - 4$ (der-2-4-6 step 4). It does not involve $\theta_0$, because $\theta_1$ reaches $\ell$ only through $u = 2\theta_1 - 2$.

- id: q-u2-l4-015
  lesson: gradient-descent
  concepts: [autograd]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    After the companion's cells 8 and 10, `theta_tensor.grad` is `tensor([-5., 8.])`. You recompute `f` from the same `theta_tensor` and call `f.backward()` again, without resetting the gradient. What does `theta_tensor.grad` hold now?
  options:
    - { text: "`tensor([-10., 16.])`", correct: true }
    - { text: "`tensor([-5., 8.])`", misconception: grad-accumulates }
    - { text: "`tensor([0., 0.])`" }
    - { text: "An error: `.backward()` can be called only once per tensor" }
  explanation: |
    `.backward()` adds the new gradient to `.grad`, so the same gradient twice gives twice the gradient. Recomputing `f` builds a new graph, so the second call is allowed. In-place training loops call `optimizer.zero_grad()` before each backward pass; the companion's loop avoids the issue by creating a new `theta` tensor every iteration.

- id: q-u2-l4-016
  lesson: gradient-descent
  concepts: [autograd-gd-loop]
  type: order
  difficulty: 2
  source: "original"
  prompt: |
    Put one iteration of the L4 p.46 gradient-descent loop in order.
  items:
    - 'Save the current parameters: `theta_prev = theta`.'
    - 'Forward pass: `prediction = f(X_train, theta)` and `loss = mse_loss(prediction, y_train)`.'
    - 'Backward pass: `loss.backward()` fills `theta.grad` with $\nabla\hat R(\theta^{(t)})$.'
    - 'Inside `torch.no_grad()`: `theta = theta_prev - step_size * theta.grad`.'
    - 'Mark the new tensor for the next forward pass: `theta.requires_grad_()`.'
    - 'Test the stopping rule: `torch.linalg.norm(theta - theta_prev) > threshold`.'
  explanation: |
    The gradient must exist before the update uses it, and the update must not be recorded, so it runs inside `no_grad()`. The new tensor then needs `requires_grad` again, and the loop test compares it with the saved parameters (the parameter-change criterion, def-2-4-4).

- id: q-u2-l4-017
  lesson: gradient-descent
  concepts: [lsq-gradient-hessian-form, gd-stopping-rules]
  type: mc
  difficulty: 3
  source: "original"
  prompt: |
    The companion's run on 20 diabetes patients stops at slope 3.714, while least squares gives 3.738; the intercepts agree (0.458). At the stop, $\lVert\nabla \hat R\rVert \le 10^{-4}$. Why did it stop with the slope still off by 0.024?
  options:
    - { text: "The bowl is very flat along the slope, so by $\\nabla\\hat R = H(\\theta - \\theta^\\star)$ the gradient is tiny there even 0.024 away", correct: true }
    - { text: "It did not stop short: a gradient below $10^{-4}$ means $\\theta$ is within about $10^{-4}$ of $\\theta^\\star$", misconception: small-gradient-near-optimum }
    - { text: "It converged to a different local minimum of the MSE" }
    - { text: "Float64 rounding error dominates at this scale" }
  explanation: |
    der-2-4-5 gives $\nabla\hat R(\theta) = H(\theta - \theta^\star)$ with $H = \frac{2}{n}X^\top X$. The raw `bmi` feature is small, so the curvature along the slope, $\frac{2}{n}\sum_i (x^{(i)}_{\text{bmi}})^2$, is small: a slope-entry gradient of at most $10^{-4}$ at a slope error of 0.0237 bounds it at about $10^{-4}/0.0237 \approx 0.0042$, against 2 along the intercept. The MSE is convex, so there is no other local minimum, and the gap is far above rounding error.

- id: q-u2-l4-018
  lesson: gradient-descent
  concepts: [lms-update]
  type: mc
  difficulty: 1
  source: "original"
  prompt: |
    For $\hat R(\theta) = \frac{1}{n}\sum_i (\theta^\top x^{(i)} - y^{(i)})^2$, what does example $i$ contribute to $\nabla_\theta\hat R(\theta)$?
  options:
    - { text: "$\\frac{2}{n}\\big(\\theta^\\top x^{(i)} - y^{(i)}\\big)\\, x^{(i)}$", correct: true }
    - { text: "$\\frac{2}{n}\\big(\\theta^\\top x^{(i)} - y^{(i)}\\big)\\, \\theta$" }
    - { text: "$\\frac{2}{n}\\big(\\theta^\\top x^{(i)} - y^{(i)}\\big)$" }
    - { text: "$\\frac{1}{n}\\big(\\theta^\\top x^{(i)} - y^{(i)}\\big)^2 x^{(i)}$" }
  explanation: |
    Chain rule (der-2-4-4 steps 3–5): the outer square contributes $2\times$ the residual, the inner linear function contributes $x^{(i)}$, and the average contributes $\frac1n$. Each example pulls $\theta$ along its own feature vector, weighted by its residual (eq. 2.4.4).

- id: q-u2-l4-019
  lesson: gradient-descent
  concepts: [gradient-descent]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Spot the error. L4 p.34 writes: if $f'(X^k) > 0$, $X^{k+1} = X^k - \Delta X$; else $X^{k+1} = X^k + \Delta X$; with $\Delta X = \eta^k f'(X^k)$ and $\eta^k > 0$. At a point where $f'(X^k) < 0$, what does this rule do?
  options:
    - { text: "It moves left, which is uphill because the function falls to the right", correct: true }
    - { text: "It moves right, downhill, as intended", misconception: sign-case-step }
    - { text: "It does not move, because the else branch cancels the sign" }
    - { text: "It moves right, but by $2\\Delta X$" }
  explanation: |
    With $f'(X^k) < 0$, $\Delta X = \eta^k f'(X^k)$ is negative, so $X^k + \Delta X < X^k$: a step left, against the descent direction. The fix is $\Delta X = \eta^k\lvert f'(X^k)\rvert$, which makes both branches equal to $X^{k+1} = X^k - \eta^k f'(X^k)$, the update handwritten on the same slide.

# ---------- Lesson 2.5: step-size-and-conditioning ----------
# Poll: L5 p.12 (the only Poll Everywhere question on L4 pp.48-53 and L5 pp.3-16), item q-u2-l5-001,
# keyed as in docs/course-map/02-lectures-L4-L5.md.

- id: q-u2-l5-001
  lesson: step-size-and-conditioning
  concepts: [step-size-regimes, large-step-basin-escape, learning-rate-decay-schedules]
  type: mc
  difficulty: 2
  source: "L5 p.12 poll"
  prompt: |
    Select all correct statements.
  options:
    - { text: 'Step sizes greater than twice the inverse of the second derivative can cause gradient descent to diverge.', correct: true }
    - { text: 'Diverging gradient is always a bad thing.', misconception: divergence-always-bad }
    - { text: 'Gradient descent will not converge without decaying learning rates.', misconception: needs-decay-to-converge }
    - { text: 'When the dataset size is large, we always want to start with a relatively small learning rate so that gradient descent will not explode.', misconception: eta-depends-on-n-or-d }
    - { text: 'When the dimension of the dataset is large, we always want to start with a relatively small learning rate so that gradient descent will not explode.', misconception: eta-depends-on-n-or-d }
    - { text: 'When the dimension of the model is large, we always want to start with a relatively small learning rate so that gradient descent will not explode.', misconception: eta-depends-on-n-or-d }
  explanation: |
    Only the first statement is true (the course map's key). On a parabola the error is multiplied by $1 - \eta a$ each step, and $a = E''$, so $\eta > 2/E'' = 2\eta_{opt}$ makes $\lvert 1 - \eta a \rvert > 1$ (der-2-5-2 step 8). A large step can help leave a sharp basin (L5 p.10, der-2-5-6 step 6), so divergence is not always bad. A fixed $\eta < 2/\lambda_{\max}$ converges with exact gradients (der-2-5-4), so decay is not required. The stability bound is set by the Hessian's largest eigenvalue, which depends on feature scales and correlations, not on $n$, the number of features, or the number of parameters; with the $\frac1n$ kept, the Hessian is an average and does not grow with $n$.
  discriminates: [step-size-regimes, large-step-basin-escape]

- id: q-u2-l5-002
  lesson: step-size-and-conditioning
  concepts: [robbins-monro-conditions, learning-rate-decay-schedules]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Which schedule satisfies both Robbins–Monro conditions $\sum_t \eta_t = \infty$ and $\sum_t \eta_t^2 < \infty$?
  options:
    - { text: '$\eta_t = \eta_0/(t+1)$', correct: true }
    - { text: '$\eta_t = \eta_0/(t+1)^2$', misconception: any-decay-converges }
    - { text: '$\eta_t = \eta_0 e^{-\beta t}$ with $\beta > 0$', misconception: any-decay-converges }
    - { text: 'A constant $\eta_t = \eta_0$', misconception: sgd-constant-step-converges }
  explanation: |
    The harmonic series diverges and $\sum 1/(t+1)^2 = \pi^2/6$ is finite, so $\eta_0/(t+1)$ passes both (der-2-5-8 steps 4 and 7). Inverse-square and exponential decay have finite sums (steps 5 and 6), so the iterates can travel only a bounded distance. A constant step has $\sum \eta_t^2 = \infty$: with noisy gradients it never stops jittering.
  discriminates: [robbins-monro-conditions]

- id: q-u2-l5-003
  lesson: step-size-and-conditioning
  concepts: [learning-rate-decay-schedules]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    A geometric schedule $\eta_t = \eta_0\, r^t$ uses $\eta_0 = 0.5$ and $r = 0.9$. What is the total step length $\sum_{t=0}^{\infty} \eta_t$? (If every gradient along the path has norm at most 1, this bounds how far the iterates can ever move.)
  answer: 5
  tolerance: 0.01
  seeded: { eta0: [0.1, 0.2, 0.5, 1], r: [0.5, 0.8, 0.9, 0.95] }
  formula: "eta0 / (1 - r)"
  explanation: |
    A geometric series with ratio $r < 1$ sums to $\eta_0/(1 - r)$ (der-2-5-8 step 6, with $r = e^{-\beta}$). With gradient norms at most $G = 1$, step 2 of der-2-5-8 says the iterates never get farther than this total from where they started, so a minimum farther away than that is never reached.
  discriminates: [learning-rate-decay-schedules]

- id: q-u2-l5-004
  lesson: step-size-and-conditioning
  concepts: [single-rate-stability-bound]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    A least-squares model is trained by gradient descent on $\hat R(\theta) = \frac1n\lVert X\theta - y\rVert_2^2$ with a step size just below the stability limit. You collect four times as many patients from the same population and retrain. What happens to the largest stable step size?
  options:
    - { text: 'It stays about the same: the Hessian $\frac2n X^\top X$ is an average, so its largest eigenvalue does not grow with $n$', correct: true }
    - { text: 'It shrinks by about a factor of 4, because the loss sums four times as many terms', misconception: eta-depends-on-n-or-d }
    - { text: 'It grows by about a factor of 4, because the gradient is averaged over more examples', misconception: eta-depends-on-n-or-d }
    - { text: 'It shrinks by about a factor of 2, like a standard error' }
  explanation: |
    The bound is $2/\lambda_{\max}(H)$ (eq. 2.5.2). With the $\frac1n$ kept, $H = \frac2n X^\top X$ has entries that are twice the mean products of columns, which settle to population values as $n$ grows. Only if you drop the $\frac1n$ and minimize the sum does the Hessian, and the needed shrinkage of $\eta$, scale with $n$.
  discriminates: [single-rate-stability-bound]

- id: q-u2-l5-005
  lesson: step-size-and-conditioning
  concepts: [best-fixed-step-size, condition-number]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    A convex quadratic has $\lambda_{\max} = 1000$ and $\lambda_{\min} = 1$. To be safe you use $\eta = 10^{-5}$ instead of the best fixed step $\eta^\star = 2/1001$. What happens?
  options:
    - { text: 'It converges, but the flat direction shrinks by $10^{-5}$ of its error per step instead of about $2 \times 10^{-3}$, so it needs roughly 200 times as many steps', correct: true }
    - { text: 'Nothing is lost: a smaller step is always safer, and the extra cost is negligible', misconception: too-small-eta-safe }
    - { text: 'It converges in about the same number of steps, because the stiff direction sets the pace', misconception: too-small-eta-safe }
    - { text: 'It diverges, because the step is far from $\eta^\star$' }
  explanation: |
    Every $\eta$ in $(0, 2/\lambda_{\max})$ converges (der-2-5-4 step 8), but the flat mode's factor is $1 - \eta\lambda_{\min}$ (step 6). At $\eta = 10^{-5}$ it is $1 - 10^{-5}$; at $\eta^\star$ it is $1 - 2/1001 \approx 1 - 2 \times 10^{-3}$. The number of steps scales like $1/(\eta\lambda_{\min})$, so about 200 times as many.
  discriminates: [best-fixed-step-size]

- id: q-u2-l5-006
  lesson: step-size-and-conditioning
  concepts: [feature-scaling-conditioning]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Before running gradient descent on least squares, you replace each non-constant feature by its z-score. Which statement is correct?
  options:
    - { text: 'The set of achievable predictions and the minimum loss are unchanged, but the Hessian, its condition number, and the number of GD steps change', correct: true }
    - { text: 'Nothing changes for gradient descent; the coefficients are just rescaled versions of the old ones', misconception: scaling-irrelevant-to-gd }
    - { text: 'The minimum training loss decreases, which is why GD converges faster' }
    - { text: 'The model class becomes nonlinear in the original features' }
  explanation: |
    Standardizing is an invertible affine change of the features, so with an intercept the same predictions are reachable and the minimum loss is the same. The Hessian $\frac2n X^\top X$ is not invariant: in the VASCO example it goes from $\kappa \approx 4 \times 10^6$ ($3$–$5 \times 10^6$ across samples) to $(1 + \lvert r \rvert)/(1 - \lvert r \rvert)$, and by der-2-5-5 step 7 the steps needed scale with $\kappa$.
  discriminates: [feature-scaling-conditioning, condition-number]

- id: q-u2-l5-007
  lesson: step-size-and-conditioning
  concepts: [optimal-step-size]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    Gradient descent minimizes $E(\theta) = \tfrac12 \cdot 4\,\theta^2 - 3\theta + 7$. Which fixed step size reaches the minimizer in one step from any start?
  answer: 0.25
  tolerance: 0.001
  seeded: { a: [0.5, 2, 4, 5, 8] }
  formula: "1 / a"
  explanation: |
    Each step multiplies the error by $1 - \eta a$ (der-2-5-1 step 7), which is zero at $\eta_{opt} = 1/a$, the inverse of the second derivative. The linear and constant terms move the minimizer but not the curvature, so they do not affect $\eta_{opt}$.
  discriminates: [optimal-step-size]

- id: q-u2-l5-008
  lesson: step-size-and-conditioning
  concepts: [step-size-regimes]
  type: predict
  difficulty: 1
  source: "original"
  prompt: |
    Gradient descent on $E(\theta) = \theta^2$ (so $a = 2$) starts at $\theta^{(0)} = 4$ with $\eta = 0.75$. Predict the behavior of the iterates.
  options:
    - { text: 'They alternate sides of the minimum with shrinking size: 4, −2, 1, −0.5, …', correct: true }
    - { text: 'They decrease monotonically toward 0 from the right' }
    - { text: 'They jump between 4 and −4 forever' }
    - { text: 'They alternate sides with growing size and diverge' }
  explanation: |
    The factor is $1 - \eta a = 1 - 1.5 = -0.5$: negative, so the error flips sign each step, and larger than $-1$, so it shrinks (der-2-5-2 step 6). Here $\eta_{opt} = 0.5 < \eta < 1 = 2\eta_{opt}$, the oscillating-convergence regime.
  discriminates: [step-size-regimes]

- id: q-u2-l5-009
  lesson: step-size-and-conditioning
  concepts: [gd-quadratic-contraction]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    On $E(\theta) = \tfrac12 a\theta^2 + b\theta + c$ with $a = 2$, gradient descent with $\eta = 0.25$ starts at distance $\theta^{(0)} - \theta^\star = 4$ from the minimizer. What is $\theta^{(1)} - \theta^\star$?
  answer: 2
  tolerance: 0.001
  seeded: { a: [1, 2, 3], eta: [0.1, 0.2, 0.25], e0: [2, 4, 10] }
  formula: "(1 - eta * a) * e0"
  explanation: |
    By der-2-5-1 step 7, $e^{(1)} = (1 - \eta a)\,e^{(0)}$. The values of $b$ and $c$ do not matter: they only set where $\theta^\star$ is.
  discriminates: [gd-quadratic-contraction]

- id: q-u2-l5-010
  lesson: step-size-and-conditioning
  concepts: [best-fixed-step-size]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    A quadratic objective has Hessian eigenvalues $\lambda_{\min} = 1$ and $\lambda_{\max} = 3$. Which single fixed step size minimizes the worst per-step contraction factor $\max_i \lvert 1 - \eta\lambda_i \rvert$?
  answer: 0.5
  tolerance: 0.001
  seeded: { lmin: [1, 2], lmax: [3, 5, 10, 20] }
  formula: "2 / (lmin + lmax)"
  explanation: |
    The worst factor is $\max(1 - \eta\lambda_{\min},\ \eta\lambda_{\max} - 1)$ (der-2-5-5 step 3). The first decreases and the second increases in $\eta$, so the best $\eta$ makes them equal: $\eta^\star = 2/(\lambda_{\min} + \lambda_{\max})$ (step 4). It is neither stiff mode's $\eta_{opt} = 1/\lambda_{\max}$ nor the flat mode's.
  discriminates: [best-fixed-step-size]

- id: q-u2-l5-011
  lesson: step-size-and-conditioning
  concepts: [condition-number, best-fixed-step-size]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    A quadratic has condition number $\kappa = 9$. With the best fixed step size, by what factor does the worst-case error shrink per step?
  answer: 0.8
  tolerance: 0.001
  seeded: { kappa: [3, 9, 19, 99] }
  formula: "(kappa - 1) / (kappa + 1)"
  explanation: |
    der-2-5-5 step 6: $\rho(\eta^\star) = (\kappa - 1)/(\kappa + 1)$. It approaches 1 as $\kappa$ grows, and the number of steps for a fixed accuracy grows roughly in proportion to $\kappa$ (step 7).
  discriminates: [condition-number]

- id: q-u2-l5-012
  lesson: step-size-and-conditioning
  concepts: [step-size-regimes]
  type: which-step
  difficulty: 2
  source: "original"
  derivation: der-2-5-2
  corrupt: { step: 3, replaceTex: '0 < \eta < \frac{1}{a} = \eta_{opt}', explanation: 'Solving $-1 < 1 - \eta a < 1$ gives $0 < \eta < 2/a$. The value $1/a$ separates monotone from oscillating convergence (steps 4 to 6); it is not the stability limit, and steps between $1/a$ and $2/a$ still converge.' }

- id: q-u2-l5-013
  lesson: step-size-and-conditioning
  concepts: [minibatch-gradient-unbiased]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    A minibatch gradient is an unbiased estimate of $\nabla\hat R(\theta)$. Which statement follows?
  options:
    - { text: 'Averaged over the random choice of minibatch, the step points along $-\nabla \hat R(\theta)$; a single step can still increase $\hat R$', correct: true }
    - { text: 'Every SGD step decreases the training loss, as long as $\eta$ is small', misconception: sgd-each-step-descends }
    - { text: 'Every minibatch gradient equals the full gradient up to a positive scale factor', misconception: sgd-each-step-descends }
    - { text: 'The minibatch gradient has zero variance' }
  explanation: |
    Unbiasedness, $\mathbb{E}[g_B] = \nabla\hat R$ (eq. 2.5.6), is a statement about the average over minibatches. One minibatch can disagree with the full gradient, even point uphill for $\hat R$, so SGD's training loss is jagged; its variance is $\Sigma_1/b$, not zero (der-2-5-9 step 7).
  discriminates: [minibatch-gradient-unbiased]

- id: q-u2-l5-014
  lesson: step-size-and-conditioning
  concepts: [single-rate-stability-bound, eigenbasis-gd-modes]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    A quadratic has Hessian eigenvalues $\lambda_{\min} = 1$ and $\lambda_{\max} = 10$. To speed up the slow direction you set $\eta = 1/\lambda_{\min} = 1$. What happens?
  options:
    - { text: 'The stiff mode is multiplied by $1 - 10 = -9$ each step, so gradient descent diverges', correct: true }
    - { text: 'The flat mode converges in one step and the stiff mode follows shortly after', misconception: set-eta-by-flat-direction }
    - { text: 'Both modes converge, oscillating', misconception: set-eta-by-flat-direction }
    - { text: 'Both modes converge monotonically, just faster' }
  explanation: |
    Each eigen-direction contracts by $1 - \eta\lambda_i$ (der-2-5-4 step 6). The stiff mode needs $\eta < 2/\lambda_{\max} = 0.2$ (step 8). The flat mode is exact at $\eta = 1$, but the stiff mode's error grows ninefold per step, so the whole run diverges. One step size must satisfy every direction at once.
  discriminates: [single-rate-stability-bound]

- id: q-u2-l5-015
  lesson: step-size-and-conditioning
  concepts: [uncoupled-descents]
  type: mc
  difficulty: 1
  source: "original"
  prompt: |
    Spot the error: L4 p.51 writes the coordinate update with $\dfrac{\partial E}{d\partial \mathrm{w}}$. What is the intended quantity?
  options:
    - { text: 'The partial derivative $\partial E / \partial w_i$ with respect to one coordinate, the others held fixed', correct: true }
    - { text: 'The total derivative $dE/dw$ of $E$ with respect to the whole vector, as written', misconception: partial-derivative-notation }
    - { text: 'A second derivative, because two $\partial$ symbols appear', misconception: partial-derivative-notation }
    - { text: 'The derivative of the step size $\eta$ with respect to $w$' }
  explanation: |
    The symbol mixes a partial and a total derivative and drops the index. The coordinate update $w_i^{(k+1)} = w_i^{(k)} - \eta\,\partial E/\partial w_i$ uses the $i$-th component of the gradient; on a diagonal quadratic that is $a_{ii}w_i + b_i$ (der-2-5-3 step 2).
  discriminates: [uncoupled-descents]

- id: q-u2-l5-016
  lesson: step-size-and-conditioning
  concepts: [eigenbasis-gd-modes]
  type: which-step
  difficulty: 2
  source: "original"
  derivation: der-2-5-4
  corrupt: { step: 8, replaceTex: '\theta^{(t)} \to \theta^\star \text{ from every start} \iff 0 < \eta < \frac{2}{\lambda_{\min}}', explanation: 'Every mode must satisfy $\eta < 2/\lambda_i$, and the binding bound is the smallest, $2/\lambda_{\max}$. With $\eta$ just below $2/\lambda_{\min}$, the stiffest mode has factor $1 - \eta\lambda_{\max} < -1$ and diverges whenever $\kappa > 1$.' }

- id: q-u2-l5-017
  lesson: step-size-and-conditioning
  concepts: [eigenbasis-gd-modes]
  type: order
  difficulty: 2
  source: "original"
  prompt: |
    Put the moves of der-2-5-4 (gradient descent on a general quadratic) in order.
  items:
    - 'Differentiate: $\nabla E(\theta) = A\theta + b$.'
    - 'Solve the first-order condition: $\theta^\star = -A^{-1}b$, so $b = -A\theta^\star$.'
    - 'Write one step for the error: $e^{(t+1)} = (I - \eta A)\,e^{(t)}$.'
    - 'Diagonalize: $A = Q\Lambda Q^\top$ with orthonormal eigenvectors.'
    - 'Rotate the error, $v = Q^\top e$, so that $v^{(t+1)} = (I - \eta\Lambda)\,v^{(t)}$.'
    - 'Require $\lvert 1 - \eta\lambda_i \rvert < 1$ for every $i$: $0 < \eta < 2/\lambda_{\max}$.'
  explanation: |
    Locate the minimizer, express the step in terms of the error, rotate into the eigenbasis where the coordinates uncouple, and apply the 1-D analysis mode by mode.

- id: q-u2-l5-018
  lesson: step-size-and-conditioning
  concepts: [learning-rate-decay-schedules]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    The schedule $\eta_t = \eta_0/(t+1)^2$ goes to zero. Does gradient descent with this schedule reach the minimizer from every start?
  options:
    - { text: 'No: the total step length is $\eta_0\pi^2/6$, so with bounded gradients the iterates travel only a bounded distance', correct: true }
    - { text: 'Yes: any step size that goes to zero eventually reaches the minimum', misconception: any-decay-converges }
    - { text: 'Yes, because $\eta_t^2$ is summable, which is the only Robbins–Monro requirement', misconception: any-decay-converges }
    - { text: 'No, because its first step is larger than $2\eta_{opt}$' }
  explanation: |
    der-2-5-8: the displacement after any number of steps is at most $G\sum_t \eta_t$ (step 2), and $\sum_t \eta_0/(t+1)^2 = \eta_0\pi^2/6$ (step 5). A minimizer farther than $G\eta_0\pi^2/6$ away is never reached. Robbins–Monro needs $\sum\eta_t = \infty$ as well.
  discriminates: [robbins-monro-conditions]

- id: q-u2-l5-019
  lesson: step-size-and-conditioning
  concepts: [minibatch-gradient-variance]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    At some $\theta$, the single-example gradient has $\operatorname{tr}\Sigma_1(\theta) = 8$. With a minibatch of $b = 4$ indices drawn independently and uniformly, what is $\mathbb{E}\lVert g_B(\theta) - \nabla \hat R(\theta)\rVert^2$?
  answer: 2
  tolerance: 0.001
  seeded: { s: [2, 4, 8, 12], b: [1, 2, 4, 8, 16] }
  formula: "s / b"
  explanation: |
    By der-2-5-9 steps 7 and 8, $\operatorname{Cov}(g_B) = \Sigma_1/b$, and the expected squared error of an unbiased estimate is the trace of its covariance: $\operatorname{tr}\Sigma_1/b$. Doubling the batch halves it.
  discriminates: [minibatch-gradient-variance]

- id: q-u2-l5-020
  lesson: step-size-and-conditioning
  concepts: [sgd-noise-floor]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    SGD with batch size 1 and a constant step size $\eta$ is started exactly at the minimizer $\theta^\star$ of $\hat R$. What happens?
  options:
    - { text: 'It generally moves away, because the per-example gradients at $\theta^\star$ are not all zero; it hovers in a region whose size grows with $\eta$', correct: true }
    - { text: 'It stays at $\theta^\star$, because the full gradient there is zero', misconception: sgd-constant-step-converges }
    - { text: 'It stays at $\theta^\star$ if $\eta < 2/\lambda_{\max}$', misconception: sgd-constant-step-converges }
    - { text: 'It diverges, because SGD is unstable at any constant step size' }
  explanation: |
    $\nabla\hat R(\theta^\star) = \frac1n\sum_i \nabla\ell_i(\theta^\star) = 0$ only on average: individual examples disagree. So $\theta^\star - \eta\nabla\ell_I(\theta^\star) \ne \theta^\star$ for most $I$, and $\theta^\star$ is not a fixed point of constant-step SGD. A schedule with $\sum\eta_t^2 < \infty$ shrinks the hovering region.
  discriminates: [sgd-noise-floor]

- id: q-u2-l5-021
  lesson: step-size-and-conditioning
  concepts: [large-step-basin-escape, local-quadratic-model]
  type: mc
  difficulty: 3
  source: "original"
  prompt: |
    On a non-convex loss, gradient descent with a fixed $\eta$ sits near a local minimum whose Hessian has $\lambda_{\max} > 2/\eta$. Which statement is correct?
  options:
    - { text: 'The iterate is pushed out of that basin along its top eigenvector; this can be useful, but if $\eta$ stays above $2/\lambda_{\max}$ of every basin it never settles', correct: true }
    - { text: 'The run is broken: an iterate moving away from a minimum is always a failure', misconception: divergence-always-bad }
    - { text: 'The iterate settles at that minimum anyway, because the gradient there is zero' }
    - { text: 'The iterate settles, but oscillating' }
  explanation: |
    Near the minimizer, $e^{(t+1)} \approx (I - \eta H)e^{(t)}$, and the top mode's factor $1 - \eta\lambda_{\max}$ is below $-1$ (der-2-5-6 step 6). The iterate leaves sharp basins and can settle only where $\lambda_{\max} < 2/\eta$ (step 7). L5 p.10 and p.11: start large, then decay.
  discriminates: [large-step-basin-escape]

- id: q-u2-l5-022
  lesson: step-size-and-conditioning
  concepts: [descent-lemma, l-smooth]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    $f$ is $L$-smooth with $L = 4$. For which fixed step sizes does the descent lemma guarantee $f(\theta^{(t+1)}) < f(\theta^{(t)})$ whenever $\nabla f(\theta^{(t)}) \ne 0$?
  options:
    - { text: 'Every $\eta$ with $0 < \eta < 0.5$', correct: true }
    - { text: 'Only $\eta \le 0.25$' }
    - { text: 'Every $\eta$ with $0 < \eta < 1$' }
    - { text: 'Every $\eta > 0$: stepping against the gradient always lowers $f$' }
  explanation: |
    der-2-5-7 step 4: the guaranteed decrease is $\eta(1 - L\eta/2)\lVert\nabla f\rVert^2$, positive exactly for $0 < \eta < 2/L = 0.5$ (step 5). $\eta = 1/L = 0.25$ maximizes the guaranteed decrease (step 6) but is not the only safe choice.
  discriminates: [descent-lemma]

- id: q-u2-l5-023
  lesson: step-size-and-conditioning
  concepts: [minibatch-gradient-variance]
  type: which-step
  difficulty: 2
  source: "original"
  derivation: der-2-5-9
  corrupt: { step: 6, replaceTex: '\operatorname{Cov}\big(g_B(\theta)\big) = \frac{1}{b}\sum_{k=1}^{b} \operatorname{Cov}\big(\nabla \ell_{I_k}(\theta)\big)', explanation: 'Scaling a random vector by $1/b$ scales its covariance by $1/b^2$, not $1/b$. With $1/b$ the batch covariance would come out as $\Sigma_1$, independent of $b$, and averaging would not reduce the noise at all.' }

- id: q-u2-l5-024
  lesson: step-size-and-conditioning
  concepts: [minibatch-gradient-unbiased, stochastic-gradient-descent]
  type: mc
  difficulty: 3
  source: "original"
  prompt: |
    In the STEPS trial, a minibatch is formed from 16 consecutive decision points of a single participant. Why does this weaken der-2-5-9's guarantee?
  options:
    - { text: 'The 16 points are not independent draws: they share the participant''s offset $u_i$ and a time trend, so the covariance is larger than $\Sigma_1/16$; and if blocks are processed in arrival order, each step''s gradient is biased toward that participant and period.', correct: true }
    - { text: 'It does not: any 16 examples give an unbiased estimate' }
    - { text: 'Minibatches of 16 are too large for SGD to be unbiased' }
    - { text: 'Unbiasedness requires the batch size to divide $n$' }
  explanation: |
    Independence of the indices is used in der-2-5-9 step 6 (the covariance of a sum is the sum of covariances); step 7 uses identical distribution. Sixteen correlated points carry less information than sixteen independent ones, so the covariance exceeds $\Sigma_1/16$. Unbiasedness itself needs only step 2's marginal $P(I = i) = 1/n$: a block chosen at random is still unbiased, because each index has marginal probability $1/n$. The bias comes from taking blocks in arrival order, so that each step sees one participant and one period (the offset $u_i$, early versus late weeks). Shuffling across participants and times restores both properties.
  discriminates: [minibatch-gradient-unbiased]

- id: q-u2-l5-025
  lesson: step-size-and-conditioning
  concepts: [feature-scaling-conditioning, condition-number]
  type: mc
  difficulty: 3
  source: "original"
  prompt: |
    VASCO features are $(1, D, B)$: an intercept, dose in mg (0 to 40), and baseline systolic pressure in mmHg (about $155 \pm 12$). Roughly how large is the condition number of the least-squares Hessian $\frac2n X^\top X$?
  options:
    - { text: 'At least a few million', correct: true }
    - { text: 'About 1, since the model is linear in $\theta$', misconception: scaling-irrelevant-to-gd }
    - { text: 'About 40, the largest dose' }
    - { text: 'About 155, the mean baseline' }
  explanation: |
    $H_{33} \approx 2\,\mathbb{E}[B^2] \approx 48{,}338$ bounds $\lambda_{\max}$ from below. The intercept–baseline block $2\begin{bmatrix} 1 & 155 \\ 155 & 24{,}169\end{bmatrix}$ has determinant 576 and trace 48,340, so its small eigenvalue is about 0.012, which bounds $\lambda_{\min}$ from above. So $\kappa \gtrsim 4 \times 10^6$; all three eigenvalues of the population Hessian (raw mg and mmHg, balanced arms) give $\kappa \approx 4 \times 10^6$, and $3$–$5 \times 10^6$ across samples of 300. Linearity in $\theta$ makes the loss quadratic; it says nothing about how round the bowl is.
  discriminates: [feature-scaling-conditioning]

- id: q-u2-l5-026
  lesson: step-size-and-conditioning
  concepts: [gd-convex-smooth-rate]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    For convex $L$-smooth $f$ and $\eta = 1/L$, the bound $f(\theta^{(t)}) - f^\star \le L\lVert\theta^{(0)} - \theta^\star\rVert^2/(2t)$ holds. If you run 4 times as many steps, the bound
  options:
    - { text: 'shrinks by a factor of 4', correct: true }
    - { text: 'shrinks by a factor of 16' }
    - { text: 'shrinks by a factor of 2' }
    - { text: 'shrinks geometrically, by a factor of $(1 - 1/L)^{3t}$' }
  explanation: |
    The bound is proportional to $1/t$ (Theorem 2.5.1). Geometric decrease needs curvature from below as well, as for a positive definite quadratic, where der-2-5-5 gives the factor $(\kappa - 1)/(\kappa + 1)$ per step.
  discriminates: [gd-convex-smooth-rate]
