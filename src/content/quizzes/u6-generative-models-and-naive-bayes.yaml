  options:
    - { text: "`max_features=1000` picks words by their frequency in the fitted text, so fitting on everything lets the test emails help choose the features they are scored with", correct: true }
    - { text: "It makes no difference, because the vocabulary is only preprocessing", misconception: fit-vectorizer-on-test }
    - { text: "Fitting on all emails would make the test matrix a different width from the training matrix", misconception: fit-vectorizer-on-test }
    - { text: "`fit_transform` cannot handle more than 5000 documents" }
  explanation: |
    Anything learned from data is learned from the training split (def-6-4-1). A vocabulary chosen with test emails in view is a small leak that makes test metrics optimistic. One welcome side effect of the train-only fit: every vocabulary word occurs in some training email.

