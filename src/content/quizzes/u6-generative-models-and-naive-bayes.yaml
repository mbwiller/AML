- id: q-u6-l3-028
  lesson: naive-bayes
  concepts: [naive-bayes-assumption]
  type: mc
  difficulty: 1
  source: "L9 p.24 (slide notation)"
  prompt: |
    L9 p.24 writes $p(\mathbf{x} \mid y) = \prod_{i=1}^{d} p(x_i \mid y)$. What does $i$ index here?
  options:
    - { text: "The $d$ features (words) of a single document", correct: true }
    - { text: "The $n$ training examples", misconception: feature-index-clash }
    - { text: "The $K$ classes", misconception: feature-index-clash }
  explanation: |
    The product runs to $d$, the number of features. In our notation it is $\prod_{j=1}^{d} p(x_j \mid y)$; $i$ is reserved for examples, $x^{(i)}$.
