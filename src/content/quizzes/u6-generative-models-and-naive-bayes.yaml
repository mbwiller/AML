- id: q-u6-l2-005
  lesson: text-as-features
  concepts: [count-vectorizer, fit-preprocessing-on-train]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    You have fit `count_vect.fit_transform(text_train)`. How should you vectorize the test text?
  options:
    - { text: "count_vect.transform(text_test)", correct: true }
    - { text: "count_vect.fit_transform(text_test)", misconception: fit-vectorizer-on-test }
    - { text: "A new CountVectorizer().fit_transform(text_test), so the test vocabulary is complete", misconception: fit-vectorizer-on-test }
    - { text: "Refit on text_train plus text_test, then transform both", misconception: fit-vectorizer-on-test }
  explanation: |
    The vocabulary is part of the model. `transform` keeps the training columns in the training order, so the fitted weights line up with them, and the test data play no part in choosing features. Each alternative either renumbers the columns or lets the test text choose them (spam exercise task 5 does it correctly).
  discriminates: [count-vectorizer, text-preprocessing]

- id: q-u6-l2-006
  lesson: text-as-features
  concepts: [count-vectorizer, text-preprocessing]
  type: mc
  difficulty: 1
  source: "original"
  prompt: |
    With default settings apart from `binary=True` and `max_features=1000`, spam exercise task 7 checks two tokens. Which result does it find?
  options:
    - { text: "',' is not in vocabulary_, and 'and' is", correct: true }
    - { text: "',' is in vocabulary_, and 'and' is not", misconception: default-removes-stop-words }
    - { text: "Neither is in vocabulary_", misconception: default-removes-stop-words }
    - { text: "Both are in vocabulary_" }
  explanation: |
    The default tokenizer keeps runs of two or more word characters, so punctuation and single-character tokens such as 'a' never become tokens. Stop words are kept unless you ask for their removal, so the very common word "and" makes the top 1,000.

- id: q-u6-l2-007
  lesson: text-as-features
  concepts: [text-preprocessing, count-vectorizer]
  type: order
  difficulty: 2
  source: "original"
  prompt: |
    Put the steps of a train-only text pipeline in order.
  items:
    - "Split the documents into training and test sets."
    - "Lowercase and tokenize the training documents."
    - "Remove stop words, then stem the remaining tokens."
    - "Learn the vocabulary from the training documents (fit)."
    - "Vectorize the training documents and fit the classifier."
    - "Apply the same cleaning to the test documents and vectorize them with the fitted vocabulary (transform)."
  explanation: |
    Split first so the test documents cannot influence any choice. Remove stop words before stemming, because stop-word lists contain unstemmed words. The test set goes through the identical cleaning and only `transform`.

- id: q-u6-l2-008
  lesson: text-as-features
  concepts: [bag-of-words]
  type: mc
  difficulty: 1
  source: "L9 p.28 (slide notation)"
  prompt: |
    In lesson 6.3 the prior is written $P_\theta(y = k) = \phi_k$ (the slides write $\phi_K$). In this lesson the bag-of-words feature is written $\phi(x)_j$. Which reading is right?
  options:
    - { text: "$\\phi_k$ is the prior probability of class $k$; $\\phi(x)_j$ is feature $j$ of document $x$; the letter is reused for unrelated objects", correct: true }
    - { text: "$\\phi_k$ is the $k$-th bag-of-words entry of the current document", misconception: phi-feature-map-vs-prior }
    - { text: "$\\phi_k$ is the fraction of documents containing word $k$", misconception: phi-feature-map-vs-prior }
  explanation: |
    A document argument marks the feature map; a lone class subscript marks the prior. The fraction of class-$k$ documents containing word $j$ is $\psi_{jk}$, not any $\phi$.
  discriminates: [bag-of-words, class-prior]

- id: q-u6-l2-009
  lesson: text-as-features
  concepts: [logistic-regression-text-baseline]
