- id: q-u6-l2-011
  lesson: text-as-features
  concepts: [logistic-regression-text-baseline]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    L9 p.17 fits `LogisticRegression(C=1e5, multi_class='multinomial')`. What does $C = 10^5$ say about regularization?
  options:
    - { text: "The penalty weight is $\\lambda = 1/C = 10^{-5}$: essentially unregularized", correct: true }
    - { text: "The penalty weight is $10^5$: very strong regularization", misconception: large-c-strong-regularization }
    - { text: "It caps the optimizer at $10^5$ iterations" }
    - { text: "It keeps the $10^5$ most frequent words" }
  explanation: |
    sklearn's `C` is the inverse of the penalty weight. With 143,156 parameters for 2,257 posts and almost no penalty, the fit reaches a training loss of about $5 \times 10^{-4}$.

- id: q-u6-l2-012
  lesson: text-as-features
  concepts: [count-vectorizer]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    A vectorizer fit on "Patient hospitalized after syncope" and "Mild headache resolved" transforms the new report "Patient developed syncope and arrhythmia". What happens to "arrhythmia"?
  options:
    - { text: "It is dropped: it has no column in the fitted vocabulary", correct: true }
    - { text: "It is added as an eighth column", misconception: oov-words-kept }
    - { text: "transform raises an error for unknown words", misconception: oov-words-kept }
    - { text: "It is mapped to the closest known word, syncope" }
  explanation: |
    `transform` uses the fitted `vocabulary_` and silently ignores every other token. The new vector is $(0, 0, 0, 0, 1, 0, 1)$.

- id: q-u6-l2-013
  lesson: text-as-features
  concepts: [count-vectorizer]
  type: mc
  difficulty: 1
  source: "L9 p.14"
  prompt: |
    `count_vect.vocabulary_.get(u'church')` returns 8609. What does 8609 tell you?
  options:
    - { text: "The column of X_train that records whether each post contains 'church'", correct: true }
    - { text: "How many times 'church' occurs in the training posts", misconception: vocab-index-meaning }
    - { text: "The rank of 'church' by frequency, or by importance to the religion classes", misconception: vocab-index-meaning }
    - { text: "The number of posts that contain 'church'", misconception: vocab-index-meaning }
  explanation: |
    `vocabulary_` maps a word to its column index (assigned in alphabetical order of the learned words), so `X_train[i, 8609]` is 1 when post $i$ contains "church".

- id: q-u6-l2-014
  lesson: text-as-features
