# Quiz bank: Unit 6, Generative models and Naive Bayes.
# Format: docs/CONTENT_AUTHORING.md §7. Poll items carry source "L<n> p.<k> poll" and the
# course map's suggested key (docs/course-map/04-lectures-L8-L10.md).

# ---------- Lesson 6.1: generative-vs-discriminative ----------

- id: q-u6-l1-001
  lesson: generative-vs-discriminative
  concepts: [generative-model]
  type: mc
  difficulty: 1
  source: "L8 p.35 poll"
  prompt: |
    True or false: a generative model is a special type of probabilistic model.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    A generative model is a probability distribution over the data (L8 p.25), for classification the joint $p_\theta(x, y)$, so it is a probabilistic model.
  discriminates: [generative-model, discriminative-model]

- id: q-u6-l1-002
  lesson: generative-vs-discriminative
  concepts: [generative-mle-factorization]
  type: mc
  difficulty: 1
  source: "L8 p.35 poll"
  prompt: |
    True or false: we can fit probabilistic models using maximum likelihood estimation.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    Any parametrized distribution $p_\theta$ can be fit by maximizing $\frac{1}{n}\sum_i \log p_\theta$ of the training data; der-6-1-3 does this for a joint model.

- id: q-u6-l1-003
  lesson: generative-vs-discriminative
  concepts: [generative-model, discriminative-model]
  type: mc
  difficulty: 2
  source: "L8 p.35 poll"
  prompt: |
    True or false: generative models offer a more complete description of the data than discriminative models by modeling $P(X \mid Y)$ instead of $P(Y \mid X)$.
  options:
    - { text: "True", correct: true }
    - { text: "False", misconception: generative-always-worse }
  explanation: |
    True as the slides intend: together with the prior $P(Y)$, a generative model defines the joint $P(X, Y)$, from which $P(Y \mid X)$ follows by Bayes' rule. A discriminative model defines no distribution over $X$. "More complete" is not "more accurate": with plenty of data, the discriminative model often predicts better.
  discriminates: [generative-model, discriminative-model]

- id: q-u6-l1-004
  lesson: generative-vs-discriminative
  concepts: [generative-model]
  type: mc
  difficulty: 1
  source: "L8 p.37 poll"
  prompt: |
    True or false: in supervised learning, it is more common to use a generative model for classification than for regression.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    Generative classifiers fit one distribution $p(x \mid y = k)$ per class and a prior over finitely many classes. With a continuous target there is no finite set of classes to model, so regression is almost always done discriminatively.

- id: q-u6-l1-005
  lesson: generative-vs-discriminative
  concepts: [class-conditional-distribution]
  type: mc
  difficulty: 2
  source: "L8 p.37 poll"
  prompt: |
    True or false: discriminative models learn $p_\theta(y \mid x)$ and generative models learn $p_\theta(x \mid y)$; furthermore, $p_\theta(x \mid y = 0) + p_\theta(x \mid y = 1)$ should always equal 1.
  options:
    - { text: "True", misconception: class-conditionals-sum-to-one }
    - { text: "False", correct: true }
  explanation: |
    The first half is right, the second is not. $p_\theta(\cdot \mid y = 0)$ and $p_\theta(\cdot \mid y = 1)$ are two different distributions over $x$; each sums to 1 over $x$. The quantity that sums to 1 over $y$ is the posterior $p(y \mid x)$.
  discriminates: [class-conditional-distribution, conditional-probability]

- id: q-u6-l1-006
  lesson: generative-vs-discriminative
  concepts: [bayes-classifier]
  type: mc
  difficulty: 1
  source: "L8 p.37 poll"
  prompt: |
    True or false: the goal of generative classification is eventually to learn $p_\theta(y \mid x)$ in order to predict labels.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    The class-conditionals and the prior are a route to the posterior: $p(y = k \mid x) \propto p(x \mid y = k)\,p(y = k)$, and the prediction is its argmax (der-6-1-1).

- id: q-u6-l1-007
  lesson: generative-vs-discriminative
  concepts: [bayes-classifier, class-prior]
  type: mc
  difficulty: 2
  source: "L8 p.37 poll"
  prompt: |
    True or false: if $p_\theta(x \mid y = 0) = 0.6$ and $p_\theta(x \mid y = 1) = 0.4$, we would always predict $y = 0$.
  options:
    - { text: "True", misconception: ignore-prior }
    - { text: "False", correct: true }
  explanation: |
    The prediction is $\argmax_k p(x \mid y = k)\,p(y = k)$. With $p(y = 1) = 0.9$ the scores are $0.6 \times 0.1 = 0.06$ and $0.4 \times 0.9 = 0.36$, so we predict $y = 1$. The prior matters.
  discriminates: [class-prior, class-conditional-distribution]

- id: q-u6-l1-008
  lesson: generative-vs-discriminative
  concepts: [joint-model]
  type: mc
  difficulty: 1
  source: "L8 p.42 poll"
  prompt: |
    True or false: in supervised learning, a generative model directly parametrizes the joint distribution, written $p_\theta(x, y) : \mathcal{X} \times \mathcal{Y} \to [0, 1]$.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    Specifying $p_\theta(x \mid y)$ and $p_\theta(y)$ specifies $p_\theta(x, y) = p_\theta(x \mid y)\,p_\theta(y)$ (L8 p.41). For continuous $x$ the values are densities rather than numbers in $[0, 1]$.

- id: q-u6-l1-009
  lesson: generative-vs-discriminative
  concepts: [joint-model]
  type: mc
  difficulty: 1
  source: "L8 p.42 poll"
  prompt: |
    True or false: a generative model assigns higher scores to $(x, y)$ pairs that are more compatible.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    The joint $p_\theta(x, y)$ is large where input and label go together, for example a spam-like email paired with $y = 1$.

- id: q-u6-l1-010
  lesson: generative-vs-discriminative
  concepts: [generative-mle-factorization]
  type: mc
  difficulty: 1
  source: "L8 p.42 poll"
  prompt: |
    True or false: we can learn the parameters of a generative model via the maximum likelihood principle.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    Maximize $\frac{1}{n}\sum_i \log p_\theta(x^{(i)}, y^{(i)})$ (L8 p.43). der-6-1-3 shows it splits into a prior problem and one class-conditional problem per class.

- id: q-u6-l1-011
  lesson: generative-vs-discriminative
  concepts: [bayes-classifier, class-prior]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    The spam exercise solution estimates the class priors $\hat\phi_0 = 0.77195726$ (non-spam) and $\hat\phi_1 = 0.22804274$ (spam). Take the toy class-conditionals from the L8 p.37 poll, $p(x \mid y = 0) = 0.6$ and $p(x \mid y = 1) = 0.4$. Compute $p(y = 1 \mid x)$ to three decimals.
    Note: here the 0.6 belongs to class 0, following the poll's convention; the lesson's worked example gives 0.6 to class 1.
  answer: 0.165
  tolerance: 0.002
  formula: "0.4 * 0.22804274 / (0.4 * 0.22804274 + 0.6 * 0.77195726)"
  explanation: |
    Scores: $0.4 \times 0.22804274 = 0.09121710$ and $0.6 \times 0.77195726 = 0.46317436$. Normalize by their sum $0.55439145$: $p(y = 1 \mid x) \approx 0.1645$.

- id: q-u6-l1-012
  lesson: generative-vs-discriminative
  concepts: [bayes-classifier, class-prior]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    With the toy class-conditionals $p(x \mid y = 0) = 0.6$ and $p(x \mid y = 1) = 0.4$, which prior $p(y = 1)$ makes the Bayes classifier exactly indifferent between the two labels?
  answer: 0.6
  tolerance: 0.005
  formula: "0.6 / (0.6 + 0.4)"
  explanation: |
    Indifference means equal scores: $0.4\,\pi = 0.6\,(1 - \pi)$, so $\pi = 0.6$. For any $p(y = 1)$ above 0.6 the classifier predicts $y = 1$, despite the smaller class-conditional.

- id: q-u6-l1-013
  lesson: generative-vs-discriminative
  type: which-step
  difficulty: 2
  source: "original"
  derivation: der-6-1-1
  corrupt: { step: 3, replaceTex: '\hat y = \argmax_{k}\; p(x \mid y = k)', explanation: "Only $p(x)$ is constant in $k$. The prior $p(y = k)$ depends on $k$ and cannot be dropped; this is the L8 p.37 poll trap." }

- id: q-u6-l1-014
  lesson: generative-vs-discriminative
  type: which-step
  difficulty: 2
  source: "original"
