  options:
    - { text: "The pipeline runs end to end; accuracy still has to be measured on held-out documents", correct: true }
    - { text: "The classifier is accurate on new posts", misconception: two-predictions-as-evaluation }
    - { text: "The classifier does not overfit, since both new sentences are classified correctly", misconception: two-predictions-as-evaluation }
