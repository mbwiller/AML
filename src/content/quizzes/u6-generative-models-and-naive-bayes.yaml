  corrupt: { step: 4, replaceTex: 'w_j = \log\frac{\psi_{j1}}{\psi_{j0}}', explanation: "The bracket in step 3 has two parts. The weight must also subtract $\\log\\frac{1 - \\psi_{j1}}{1 - \\psi_{j0}}$, because in Bernoulli NB an absent word votes too, and that vote changes when $x_j$ flips from 0 to 1." }

- id: q-u6-l3-021
  lesson: naive-bayes
  concepts: [zero-count-problem, laplace-smoothing]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    The spam exercise solution finds 34 zero entries in `psis` and fixes the resulting `-inf` with `psis = psis.clip(1e-14, 1-1e-14)`. What is the main problem with this fix?
  options:
    - { text: 'The penalty for an unseen word, $\log 10^{-14} \approx -32.2$, is set by an arbitrary constant, is the same for any class size, and acts as a near-veto', correct: true }
    - { text: "None: it is Laplace smoothing with a very small pseudo-count", misconception: clip-is-a-fix }
    - { text: "None: only 34 entries change, so predictions cannot be affected", misconception: clip-is-a-fix }
    - { text: "It makes the scores positive, so the argmax flips", misconception: clip-is-a-fix }
  explanation: |
    Add-$\alpha$ smoothing changes every estimate to $(s + \alpha)/(n_k + 2\alpha)$, with a penalty for unseen words that depends on $n_k$. The clip changes only the zero (and one) entries to a fixed value that no likelihood or prior produces. Any email containing one of those words is pushed hard away from that class.
  discriminates: [laplace-smoothing, zero-count-problem]

- id: q-u6-l3-022
  lesson: naive-bayes
  concepts: [zero-count-problem]
  type: mc
  difficulty: 2
  source: "NaiveBayes_Spam_exercise_sol task 21"
  prompt: |
    Task 21 of the spam exercise runs `np.sum(psis[0]==0)` and `np.sum(psis[1]==0)` and both print 0. What can you conclude about words that appear in only one class?
  options:
    - { text: "Nothing: psis was already clipped in task 18, so no entry can be 0 (before clipping, 34 were)", correct: true }
    - { text: "Every vocabulary word appears in both spam and non-spam training emails", misconception: clip-before-check }
    - { text: "The zero-count problem only affects the test set", misconception: clip-before-check }
  explanation: |
    After `psis.clip(1e-14, 1-1e-14)`, the minimum entry is $10^{-14}$. Diagnostics must run on the raw estimates.

- id: q-u6-l3-023
  lesson: naive-bayes
  concepts: [bernoulli-nb-mle]
  type: mc
  difficulty: 2
  source: "NaiveBayes_Spam_exercise_sol task 13"
  prompt: |
    Task 13 of the spam exercise computes `np.mean(X_train[y_train==1, 0])` $= 0.0811$. Where is this value stored in the solution's `psis` array, and what is it in our notation?
  options:
    - { text: '`psis[1, 0]`, the estimate of $\psi_{jk}$ for the first vocabulary word and the spam class', correct: true }
    - { text: '`psis[0, 1]`, because the math writes the word index first', misconception: psis-transposed }
    - { text: '`phis[1]`, the spam prior', misconception: psis-transposed }
  explanation: |
    `psis` has shape `(K, d)`, so `psis[k, j]` $= \psi_{jk}$. Row 1 is the spam class; column 0 is vocabulary word 0. The value is the fraction of spam training emails containing that word (der-6-3-4 step 10).

- id: q-u6-l3-024
  lesson: naive-bayes
  concepts: [multinomial-naive-bayes, bernoulli-naive-bayes]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    A report does not contain the word "arrhythmia". How does that absence affect its class scores?
  options:
    - { text: 'Bernoulli NB adds $\log(1 - \psi_{jk})$ to each class score; multinomial NB adds nothing', correct: true }
    - { text: "Neither model is affected by words that are absent", misconception: bernoulli-vs-multinomial-absent }
    - { text: "Both models add the log-probability of the word not occurring", misconception: bernoulli-vs-multinomial-absent }
    - { text: 'Multinomial NB adds $\log(1 - \theta_{vk})$; Bernoulli NB adds nothing', misconception: bernoulli-vs-multinomial-absent }
  explanation: |
    Bernoulli NB multiplies over the whole vocabulary, with factor $1 - \psi_{jk}$ for each absent word (der-6-3-7 step 4). The multinomial likelihood is $\prod_v \theta_{vk}^{c_v}$, and $\theta^0 = 1$.
  discriminates: [multinomial-naive-bayes, bernoulli-naive-bayes]

- id: q-u6-l3-025
  lesson: naive-bayes
  concepts: [naive-bayes-assumption]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Across all NOTES reports, "arrhythmia" and "hospitalized" are strongly correlated. Does that contradict the Naive Bayes assumption?
  options:
    - { text: "No: NB assumes independence within each class, and both words can be more common in serious reports", correct: true }
    - { text: "Yes: NB assumes the words are independent", misconception: marginal-vs-conditional-independence }
    - { text: "Yes: NB requires the words to be uncorrelated across the corpus before training", misconception: marginal-vs-conditional-independence }
  explanation: |
    The assumption is $p(x \mid y) = \prod_j p(x_j \mid y)$. Two words that both depend on the class are correlated marginally even if they are independent given the class. Whether they are independent within serious reports is a separate question (in real report text, usually no; the bigram version of NOTES builds that dependence in).
  discriminates: [naive-bayes-assumption, iid]

- id: q-u6-l3-026
  lesson: naive-bayes
  concepts: [categorical-prior-mle]
  type: order
  difficulty: 2
  source: "original"
  prompt: |
    Put the moves of the derivation of $\hat\phi_k = n_k / n$ in order.
  items:
    - 'Group the log-prior terms by class: $\sum_k n_k \log\phi_k$.'
    - 'Form the Lagrangian with the constraint $\sum_k \phi_k = 1$.'
    - 'Set $\partial\mathcal{L}/\partial\phi_k = 0$ to get $\phi_k = n_k/\lambda$.'
    - 'Substitute into the constraint and use $\sum_k n_k = n$ to get $\lambda = n$.'
    - 'Conclude $\hat\phi_k = n_k/n$.'
  explanation: |
    der-6-3-5: rewrite the objective with counts, add the multiplier, solve the first-order condition in terms of $\lambda$, then let the constraint fix $\lambda$.

- id: q-u6-l3-027
  lesson: naive-bayes
  concepts: [bernoulli-naive-bayes]
  type: mc
  difficulty: 1
  source: "L9 p.28 (slide notation)"
  prompt: |
    L9 p.28 writes $P_\theta(y = k) = \phi_K$. How should you read it?
  options:
    - { text: 'As $\phi_k$, the prior probability of class $k$', correct: true }
    - { text: 'As the prior of the last class $K$, shared by every class', misconception: phi-capital-k }
    - { text: 'As $\phi_k$ raised to the power $K$', misconception: phi-capital-k }
  explanation: |
    The capital subscript is a typo, repeated in the L10 recap. Each class has its own prior $\phi_k$, with $\sum_k \phi_k = 1$.

- id: q-u6-l3-028
  lesson: naive-bayes
  concepts: [naive-bayes-assumption]
  type: mc
  difficulty: 1
  source: "L9 p.24 (slide notation)"
  prompt: |
    L9 p.24 writes $p(\mathbf{x} \mid y) = \prod_{i=1}^{d} p(x_i \mid y)$. What does $i$ index here?
  options:
    - { text: "The $d$ features (words) of a single document", correct: true }
    - { text: "The $n$ training examples", misconception: feature-index-clash }
    - { text: "The $K$ classes", misconception: feature-index-clash }
  explanation: |
    The product runs to $d$, the number of features. In our notation it is $\prod_{j=1}^{d} p(x_j \mid y)$; $i$ is reserved for examples, $x^{(i)}$.

# ---------- Lesson 6.2: text-as-features ----------
# L9 pp.6-19 contain no Poll Everywhere questions; all items are original.

- id: q-u6-l2-001
  lesson: text-as-features
  concepts: [bag-of-words, count-vectorizer]
  type: mc
  difficulty: 1
  source: "original"
  prompt: |
    On L9 p.13, `CountVectorizer(binary=True).fit_transform(twenty_train.data)` returns a matrix of shape `(2257, 35788)`. What is 35788?
  options:
    - { text: "The number of distinct words learned from the 2,257 training posts, one column each", correct: true }
    - { text: "The total number of word tokens in the 2,257 posts" }
    - { text: "The number of nonzero entries in the matrix" }
    - { text: "The length of the longest training post" }
  explanation: |
    Rows are documents and columns are vocabulary words, so the second dimension is $|V|$ (der-6-2-2 step 3). Tokens are counted inside the rows, not by the shape, and most of the $2257 \times 35788$ entries are zero.
  discriminates: [bag-of-words, sparse-matrix]

- id: q-u6-l2-002
