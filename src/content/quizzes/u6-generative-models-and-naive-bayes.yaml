- id: q-u6-l4-002
  lesson: spam-exercise
  concepts: [train-test-split]
  type: mc
  difficulty: 1
  source: "NaiveBayes_Spam_exercise task 4"
  prompt: |
    After `train_test_split(text, Y, test_size=0.33, random_state=42)`, the training set is 22.80% spam and the test set 26.07%. What change would make the two rates match the overall 23.9%?
  options:
    - { text: "Pass `stratify=Y`", correct: true }
    - { text: "Nothing: a random split already preserves the class balance exactly", misconception: random-split-preserves-balance }
    - { text: "Change `random_state` until the rates match", misconception: random-split-preserves-balance }
    - { text: "Use a larger `test_size`", misconception: random-split-preserves-balance }
  explanation: |
    A random split matches the class rate only on average. Stratifying splits each class separately, so both parts inherit the overall rate. Searching over seeds for a "nice" split is a form of tuning on the test set.

- id: q-u6-l4-003
  lesson: spam-exercise
