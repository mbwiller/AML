    The default token pattern keeps runs of two or more word characters, so punctuation and single-character tokens such as 'a' never become tokens. Stop-words are kept unless you ask to remove them, which tasks 22–23 then do by hand.

- id: q-u6-l4-005
  lesson: spam-exercise
  concepts: [logistic-regression-text-baseline]
  type: mc
  difficulty: 1
  source: "NaiveBayes_Spam_exercise tasks 10–11"
  prompt: |
    `LogisticRegression(penalty="none")` scores 0.99974 accuracy on the training emails and 0.97726 on the test emails. Which statement is right?
  options:
    - { text: "0.97726 is the estimate of accuracy on new email; the gap reflects mild overfitting of an unregularized model", correct: true }
    - { text: "The model is 99.97% accurate on email in general", misconception: train-accuracy-is-generalization }
    - { text: "The gap shows the test set is mislabeled", misconception: train-accuracy-is-generalization }
    - { text: "With `penalty=\"none\"`, the value of `C` controls the overfitting" }
  explanation: |
    Training accuracy measures fit to the emails the model was trained on. Only held-out accuracy estimates performance on new data. With the penalty off, `C` has no effect; regularization tuned on a validation split is the remedy.

- id: q-u6-l4-006
  lesson: spam-exercise
  concepts: [f1-score]
  type: mc
  difficulty: 2
  source: "NaiveBayes_Spam_exercise task 12"
  prompt: |
    About three in four test emails are ham. A filter that labels every email as ham has which F1 score for the spam class?
  options:
    - { text: "0, because it catches no spam (recall 0)", correct: true }
    - { text: "The same as its accuracy", misconception: accuracy-enough-imbalanced }
    - { text: "1, because it never raises a false alarm", misconception: accuracy-enough-imbalanced }
    - { text: "Undefined, so F1 cannot be used on imbalanced data" }
  explanation: |
    $F_1$ is the harmonic mean of precision and recall and ignores true negatives. With no true positives, recall is 0 and $F_1$ is 0 (scikit-learn also reports 0 for the undefined precision, with a warning). High accuracy here would hide a useless filter, which is why task 12 asks for F1.

