- id: q-u6-l1-015
  lesson: generative-vs-discriminative
  type: which-step
  difficulty: 3
  source: "original"
  derivation: der-6-1-2
  corrupt: { step: 5, replaceTex: '1 - p\big(y = h(x) \mid x\big) \le 1 - \max_{k}\; p(y = k \mid x)', explanation: 'The inequality is reversed. $p(y = h(x) \mid x) \le \max_k p(y = k \mid x)$, so one minus it is at least one minus the maximum.' }

- id: q-u6-l1-016
  lesson: generative-vs-discriminative
  concepts: [bayes-classifier-optimality]
  type: order
  difficulty: 2
  source: "original"
  prompt: |
    Put the moves of the proof that the Bayes classifier minimizes 0/1 risk in order.
  items:
    - 'Write the risk as the probability of a mistake, $R(h) = P(h(X) \ne Y)$.'
    - 'Condition on $X$: $R(h) = \E_X[P(Y \ne h(X) \mid X)]$.'
    - 'At each $x$, the conditional error is $1 - p(y = h(x) \mid x)$.'
    - 'Bound it below by $1 - \max_k p(y = k \mid x)$.'
    - "Take expectations of the pointwise bound."
    - 'Choose $h^\star(x) = \argmax_k p(y = k \mid x)$, which attains the bound at every $x$.'
  explanation: |
    Express the risk as an average over inputs, minimize the error at each input separately, then note that the pointwise minimizer also minimizes the average (der-6-1-2).

- id: q-u6-l1-017
  lesson: generative-vs-discriminative
  concepts: [discriminative-model]
  type: mc
  difficulty: 2
  source: "L9 p.3 (slide notation)"
  prompt: |
    L9 p.3 writes $P_\theta(y \mid x) = \prod_{i=1}^{n} P_\theta(y^{(i)} \mid x^{(i)})$ for logistic regression. What does the right-hand side actually compute?
  options:
    - { text: "The conditional likelihood of all training labels given all training inputs", correct: true }
    - { text: "The predicted probability of the label for one new input $x$", misconception: dataset-likelihood-notation }
    - { text: 'The joint probability of the inputs and labels, $P_\theta(\mathcal{D})$', misconception: dataset-likelihood-notation }
    - { text: 'The class-conditional $p_\theta(x \mid y)$ of the training inputs', misconception: dataset-likelihood-notation }
  explanation: |
    It is $P_\theta(y^{(1)}, \dots, y^{(n)} \mid x^{(1)}, \dots, x^{(n)})$, a single number for the whole dataset. It does not model the inputs, which is what separates it from the generative likelihood $\prod_i p_\theta(x^{(i)}, y^{(i)})$.
  discriminates: [discriminative-model, generative-mle-factorization]

- id: q-u6-l1-018
  lesson: generative-vs-discriminative
  concepts: [bayes-classifier]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    A generative model for the ADVERSE cohort gives scores $s_k = p_\theta(x \mid y = k)\,p_\theta(y = k)$ for a patient. The clinical team will act if the patient's event risk exceeds a fixed threshold. What do you compare against the threshold?
  options:
    - { text: "$s_1 / (s_0 + s_1)$", correct: true }
    - { text: "$s_1$", misconception: unnormalized-score-as-probability }
    - { text: '$p_\theta(x \mid y = 1)$', misconception: ignore-prior }
    - { text: "$s_1 - s_0$", misconception: unnormalized-score-as-probability }
  explanation: |
    The scores are joint probabilities $p_\theta(x, y = k)$. They rank the classes, but the risk is the posterior, step 6 of der-6-1-1: divide by $\sum_k s_k$.
  discriminates: [bayes-classifier, class-prior]

- id: q-u6-l1-019
  lesson: generative-vs-discriminative
  concepts: [bayes-classifier-optimality]
  type: mc
  difficulty: 3
  source: "original"
  prompt: |
    Which statement about the Bayes classifier $h^\star(x) = \argmax_k p(y = k \mid x)$ is correct?
  options:
    - { text: "Under 0/1 loss, no classifier has a lower true risk, when $p$ is the true data distribution", correct: true }
    - { text: "Any Naive Bayes model fit by maximum likelihood achieves the lowest possible error", misconception: fitted-bayes-is-optimal }
    - { text: 'It predicts $\argmax_k p(x \mid y = k)$', misconception: ignore-prior }
    - { text: "Its risk is always 0 when the classes are well modeled", misconception: bayes-error-zero }
  explanation: |
    der-6-1-2 proves optimality for the true $p$. A fitted model only approximates it, and the Bayes error $1 - \E_X[\max_k p(y = k \mid X)]$ is positive whenever the classes overlap.
  discriminates: [bayes-classifier-optimality, bayes-classifier]

- id: q-u6-l1-020
  lesson: generative-vs-discriminative
  concepts: [generative-mle-factorization]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    You fit a generative classifier with a categorical prior $p_\phi(y)$ and Bernoulli class-conditionals, then switch the class-conditionals to Gaussians and refit by maximum likelihood on the same data. What happens to $\hat\phi$?
  options:
    - { text: "It does not change: the prior's MLE depends only on the labels", correct: true }
    - { text: "It changes, because the prior and the class-conditionals are fit jointly", misconception: joint-mle-coupled }
    - { text: "It must be re-estimated by gradient descent together with the Gaussian means", misconception: joint-mle-coupled }
  explanation: |
    The log-likelihood splits into $\sum_i \log p_\phi(y^{(i)})$, which contains no class-conditional parameters, plus a class-conditional term (der-6-1-3, step 9).
  discriminates: [generative-mle-factorization, joint-model]

# ---------- Lesson 6.3: naive-bayes ----------
# Poll items (L9 pp.27, 39, 40) use the course map's suggested keys. Toy numbers appear only
# in original items and are labeled as such; no item uses HW3-specific data or parameters.

- id: q-u6-l3-001
  lesson: naive-bayes
  concepts: [naive-bayes-assumption, parameter-explosion]
  type: mc
  difficulty: 1
  source: "L9 p.27 poll"
  prompt: |
    True or false: Naive Bayes is an assumption imposed to reduce the number of parameters needed to learn $P(X \mid Y)$.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    Without it, a categorical $P(x \mid y = k)$ over $d$ binary features needs $2^d - 1$ free parameters per class; with it, $d$ (der-6-3-1).
  discriminates: [naive-bayes-assumption, full-categorical-class-conditional]

- id: q-u6-l3-002
  lesson: naive-bayes
  concepts: [naive-bayes-assumption]
  type: mc
  difficulty: 1
  source: "L9 p.27 poll"
  prompt: |
    True or false: Naive Bayes assumes that words are uncorrelated when conditioned on the label class, and this assumption often holds in practice.
  options:
    - { text: "False", correct: true }
    - { text: "True", misconception: nb-assumption-holds }
  explanation: |
    The first half describes the assumption (conditional independence, der-6-3-2 step 4). The second half is false: within a class, words co-occur far more than chance. NB works anyway because classification only needs the argmax.

- id: q-u6-l3-003
  lesson: naive-bayes
  concepts: [nb-prediction, log-space-prediction]
  type: mc
  difficulty: 2
  source: "L9 p.27 poll"
  prompt: |
    True or false: the probabilities estimated by Naive Bayes can be over- or under-confident.
  options:
    - { text: "True", correct: true }
    - { text: "False", misconception: nb-calibrated }
  explanation: |
    Correlated words are counted as independent evidence, which pushes the posterior toward 0 or 1 (overconfidence). When the class shows only in how words co-occur, the product of marginals misses that evidence and the posterior stays too close to the prior (underconfidence; see q-u6-l3-016).

- id: q-u6-l3-004
  lesson: naive-bayes
  concepts: [naive-bayes-assumption]
  type: mc
  difficulty: 1
  source: "L9 p.27 poll"
  prompt: |
    True or false: Naive Bayes often has good performance in practice despite its strong assumptions.
  options:
    - { text: "True", correct: true }
    - { text: "False", misconception: nb-assumption-holds }
  explanation: |
    The decision is $\argmax_k s_k(x)$. Errors in the probabilities often leave the ranking of the classes intact, so the predicted label can be right even when the posterior is badly calibrated.

- id: q-u6-l3-005
  lesson: naive-bayes
  concepts: [bernoulli-naive-bayes]
  type: mc
  difficulty: 1
  source: "L9 p.39 poll"
  prompt: |
    True or false: Bernoulli Naive Bayes is a discriminative model.
  options:
    - { text: "False", correct: true }
    - { text: "True", misconception: nb-is-discriminative }
  explanation: |
    It models $p(x \mid y)$ and $p(y)$, hence the joint $p(x, y)$ (def-6-3-3). Its posterior has the logistic form (der-6-3-8), but it is fit by maximizing the joint likelihood.
  discriminates: [bernoulli-naive-bayes, generative-model]

- id: q-u6-l3-006
  lesson: naive-bayes
  concepts: [bernoulli-naive-bayes]
  type: mc
  difficulty: 1
  source: "L9 p.39 poll"
  prompt: |
    True or false: Bernoulli Naive Bayes models $P(x \mid y)$ as a product of independent Bernoulli distributions.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    $p(x \mid y = k) = \prod_j \psi_{jk}^{x_j}(1 - \psi_{jk})^{1 - x_j}$ (der-6-3-2 step 7). The independence is conditional on the class.

- id: q-u6-l3-007
  lesson: naive-bayes
  concepts: [categorical-prior-mle]
  type: mc
  difficulty: 2
  source: "L9 p.39 poll"
  prompt: |
    True or false: if we model $P(Y)$ with a multinomial (categorical) distribution, the MLE of its parameters is always the empirical class frequency, regardless of whether the model is Naive Bayes.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    The joint log-likelihood splits into a prior term and a class-conditional term (der-6-1-3), and der-6-3-5 maximizes the prior term alone: $\hat\phi_k = n_k / n$. The class-conditional model never enters.

- id: q-u6-l3-008
  lesson: naive-bayes
  concepts: [nb-log-likelihood-decomposition]
  type: mc
  difficulty: 1
  source: "L9 p.40 poll"
  prompt: |
    True or false: optimizing Bernoulli Naive Bayes means finding the parameters that fit the data best, which we achieve by maximizing the log-likelihood.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    Maximum likelihood: maximize $\sum_i \log p_\theta(x^{(i)}, y^{(i)})$ (der-6-3-3).

- id: q-u6-l3-009
  lesson: naive-bayes
  concepts: [bernoulli-nb-mle]
  type: mc
  difficulty: 1
  source: "L9 p.40 poll"
  prompt: |
    True or false: Bernoulli Naive Bayes cannot be solved in closed form, so we need gradient descent.
  options:
    - { text: "False", correct: true }
    - { text: "True", misconception: nb-needs-gradient-descent }
  explanation: |
    The log-likelihood splits into one coin-flip problem per word and class plus a simplex problem for the prior; each has a closed-form maximizer, $\hat\psi_{jk} = s_{jk}/n_k$ and $\hat\phi_k = n_k/n$ (der-6-3-4, der-6-3-5).

- id: q-u6-l3-010
  lesson: naive-bayes
  concepts: [bernoulli-naive-bayes]
  type: mc
  difficulty: 1
  source: "L9 p.40 poll"
  prompt: |
    True or false: Naive Bayes was state of the art for a long time, scales well, and is always a good baseline for text classification.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    The professor's intended key is True. Training is one counting pass over the data, prediction is a dot product (der-6-3-8), and accuracy is often competitive. "Always" is strong; it is a baseline, not a guarantee.

- id: q-u6-l3-011
  lesson: naive-bayes
  concepts: [bernoulli-naive-bayes, parameter-explosion]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    Toy setting: a Bernoulli Naive Bayes model with $K = 3$ classes over a vocabulary of $d = 200$ words. How many free parameters does it have, counting the prior?
  answer: 602
  tolerance: 0
  seeded: { K: [2, 3, 4, 5], d: [50, 200, 1000, 2000] }
  formula: "K * d + K - 1"
  explanation: |
    $Kd$ Bernoulli parameters plus $K - 1$ free prior probabilities (der-6-3-1 step 11). The slide's $K(d+1)$ counts the prior's $K$ numbers without the sum-to-one constraint, which is one too many.

- id: q-u6-l3-012
  lesson: naive-bayes
  concepts: [full-categorical-class-conditional, parameter-explosion]
  type: mc
  difficulty: 2
  source: "L9 p.23 (slide error)"
  prompt: |
    A categorical class-conditional $P(x \mid y = k)$ over all binary vectors $x \in \{0,1\}^d$ has how many free parameters per class?
  options:
    - { text: '$2^d - 1$', correct: true }
    - { text: '$2^{d-1}$', misconception: categorical-param-count }
    - { text: '$2^d$', misconception: simplex-free-params }
    - { text: '$d$', misconception: categorical-param-count }
  explanation: |
    There are $2^d$ vectors and their probabilities sum to 1, so one is determined by the rest (der-6-3-1 steps 1–5). L9 p.23 writes $2^{d-1}$, which agrees only at $d = 1$. $d$ is the Naive Bayes count, not the full model's.
  discriminates: [full-categorical-class-conditional, bernoulli-naive-bayes]

- id: q-u6-l3-013
  lesson: naive-bayes
  concepts: [laplace-smoothing]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    Toy numbers: in a training set of NOTES reports, $n_k = 40$ reports are non-serious and the word "syncope" appears in $s = 0$ of them. What is the add-one (Laplace) estimate of $\psi_{\text{syncope}, k}$? Give four decimals.
  answer: 0.0238
  tolerance: 0.0005
  seeded: { n_k: [20, 40, 50, 80], s: [0, 1, 3, 6] }
  formula: "(s + 1) / (n_k + 2)"
  explanation: |
    $\hat\psi = (s + 1)/(n_k + 2) = 1/42 \approx 0.0238$ (der-6-3-6 step 7). The MLE would be 0, making the class impossible for any report containing the word.

- id: q-u6-l3-014
  lesson: naive-bayes
  concepts: [log-space-prediction]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    Toy scores: a two-class Naive Bayes model gives log-space scores $s_1 = -800$ and $s_0 = -805$ for a document. In float64, $e^{-800}$ may underflow to 0. Compute $p(y = 1 \mid x)$ to four decimals using the log-sum-exp shift.
  answer: 0.9933
  tolerance: 0.0005
  seeded: { s1: [-800, -900, -1210], s0: [-805, -904, -1211] }
  formula: "1 / (1 + exp(s0 - s1))"
  explanation: |
    Subtract $m = \max(s_0, s_1) = -800$: $p(y = 1 \mid x) = e^{0} / (e^{0} + e^{-5}) = 1/(1 + e^{-5}) \approx 0.9933$ (der-6-3-7 step 6).

- id: q-u6-l3-015
  lesson: naive-bayes
  concepts: [nb-linear-classifier]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    Toy parameters: in a two-class Bernoulli NB model, word $j$ has $\psi_{j1} = 0.5$ and $\psi_{j0} = 0.2$. What is its weight $w_j$ in the linear form $w^\top x + b$? Use the natural log; three decimals.
  answer: 1.386
  tolerance: 0.002
  seeded: { p1: [0.5, 0.4, 0.3], p0: [0.2, 0.1, 0.05] }
  formula: "log(p1 * (1 - p0) / (p0 * (1 - p1)))"
  explanation: |
    $w_j = \log\frac{0.5 \times 0.8}{0.2 \times 0.5} = \log 4 \approx 1.386$ (der-6-3-8 step 4). Note it is not $\log(0.5/0.2) \approx 0.916$: the absent-word term also depends on $x_j$.

- id: q-u6-l3-016
  lesson: naive-bayes
  concepts: [naive-bayes-assumption, nb-prediction]
  type: numeric
  difficulty: 3
  source: "original"
  prompt: |
    Toy distribution, equal priors. In class 1, two words A and B always appear together or not at all, each pattern with probability 1/2. In class 0, A and B are independent, each present with probability 1/2. A document contains both A and B. Naive Bayes, fit to these exact marginals, gives $p(y = 1 \mid x) = 0.5$. What is the true $p(y = 1 \mid x)$? Three decimals.
  answer: 0.667
  tolerance: 0.002
  explanation: |
    True: $p(A, B \mid y = 1) = 1/2$ and $p(A, B \mid y = 0) = 1/4$, so the posterior is $\frac{1/2}{1/2 + 1/4} = 2/3$. Naive Bayes sees marginals of 1/2 for both words in both classes, so every word's vote is 0 and the posterior stays at the prior, 0.5. NB is underconfident here; duplicated words make it overconfident instead (L9 p.27 poll c).

