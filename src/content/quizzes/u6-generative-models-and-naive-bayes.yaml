  source: "original"
  prompt: |
    The companion re-vectorizes the 2,257 training posts with `max_features=1000` and calls `.toarray()`. Stored densely with 8 bytes per entry, how many megabytes ($10^6$ bytes) does the array take? Give two decimals.
  answer: 18.06
  tolerance: 0.01
  formula: "2257 * 1000 * 8 / 1e6"
  explanation: |
    Entries: $2257 \times 1000 = 2{,}257{,}000$. Bytes: $\times 8 = 18{,}056{,}000$, about 18.06 MB (der-6-2-3 step 9). The full $35788$-column matrix would take about 646 MB.

