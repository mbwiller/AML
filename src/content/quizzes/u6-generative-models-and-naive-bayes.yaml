    Two hand-picked sentences are a smoke test, not an estimate of error. The fit is nearly perfect on the training set (loss about $5 \times 10^{-4}$), which says nothing about generalization by itself.

- id: q-u6-l2-019
  lesson: text-as-features
  concepts: [bag-of-words]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    With the 20 Newsgroups vocabulary of $|V| = 35788$ words, what is the largest number of distinct vocabulary words a post can contain while fewer than 1% of its row's entries are nonzero?
  answer: 357
  tolerance: 0
  formula: "floor(0.01 * 35788)"
  explanation: |
    Row $i$ is under 1% nonzero exactly when $u_i / 35788 < 0.01$, that is $u_i < 357.88$, and a whole number below 357.88 is at most 357 (der-6-2-2 steps 8–9).

- id: q-u6-l2-020
  lesson: text-as-features
  concepts: [fixed-length-features]
  type: mc
  difficulty: 1
  source: "L9 p.6"
  prompt: |
    Why can logistic regression not be applied to raw word sequences directly?
  options:
    - { text: "$\\theta^\\top x$ needs every $x$ to have the same length as $\\theta$, with a fixed meaning per coordinate; word sequences vary in length and position $j$ holds different words", correct: true }
    - { text: "Logistic regression requires real-valued inputs, and words are strings; any numbering of the words would do" }
    - { text: "Raw text contains punctuation, which the sigmoid cannot process" }
  explanation: |
    der-6-2-1 step 3: the inner product is defined only for vectors in $\mathbb{R}^p$. A feature map with fixed output length and one word per coordinate, such as the bag of words, solves both problems.

