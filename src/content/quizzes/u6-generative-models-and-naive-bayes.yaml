- id: q-u6-l1-016
  lesson: generative-vs-discriminative
  concepts: [bayes-classifier-optimality]
  type: order
  difficulty: 2
  source: "original"
  prompt: |
    Put the moves of the proof that the Bayes classifier minimizes 0/1 risk in order.
  items:
    - 'Write the risk as the probability of a mistake, $R(h) = P(h(X) \ne Y)$.'
    - 'Condition on $X$: $R(h) = \E_X[P(Y \ne h(X) \mid X)]$.'
    - 'At each $x$, the conditional error is $1 - p(y = h(x) \mid x)$.'
    - 'Bound it below by $1 - \max_k p(y = k \mid x)$.'
    - "Take expectations of the pointwise bound."
    - 'Choose $h^\star(x) = \argmax_k p(y = k \mid x)$, which attains the bound at every $x$.'
  explanation: |
    Express the risk as an average over inputs, minimize the error at each input separately, then note that the pointwise minimizer also minimizes the average (der-6-1-2).

- id: q-u6-l1-017
  lesson: generative-vs-discriminative
  concepts: [discriminative-model]
  type: mc
  difficulty: 2
  source: "L9 p.3 (slide notation)"
  prompt: |
    L9 p.3 writes $P_\theta(y \mid x) = \prod_{i=1}^{n} P_\theta(y^{(i)} \mid x^{(i)})$ for logistic regression. What does the right-hand side actually compute?
  options:
    - { text: "The conditional likelihood of all training labels given all training inputs", correct: true }
    - { text: "The predicted probability of the label for one new input $x$", misconception: dataset-likelihood-notation }
    - { text: 'The joint probability of the inputs and labels, $P_\theta(\mathcal{D})$', misconception: dataset-likelihood-notation }
    - { text: 'The class-conditional $p_\theta(x \mid y)$ of the training inputs', misconception: dataset-likelihood-notation }
  explanation: |
    It is $P_\theta(y^{(1)}, \dots, y^{(n)} \mid x^{(1)}, \dots, x^{(n)})$, a single number for the whole dataset. It does not model the inputs, which is what separates it from the generative likelihood $\prod_i p_\theta(x^{(i)}, y^{(i)})$.
  discriminates: [discriminative-model, generative-mle-factorization]

- id: q-u6-l1-018
  lesson: generative-vs-discriminative
  concepts: [bayes-classifier]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    A generative model for the ADVERSE cohort gives scores $s_k = p_\theta(x \mid y = k)\,p_\theta(y = k)$ for a patient. The clinical team will act if the patient's event risk exceeds a fixed threshold. What do you compare against the threshold?
  options:
    - { text: "$s_1 / (s_0 + s_1)$", correct: true }
    - { text: "$s_1$", misconception: unnormalized-score-as-probability }
    - { text: '$p_\theta(x \mid y = 1)$', misconception: ignore-prior }
    - { text: "$s_1 - s_0$", misconception: unnormalized-score-as-probability }
  explanation: |
    The scores are joint probabilities $p_\theta(x, y = k)$. They rank the classes, but the risk is the posterior, step 6 of der-6-1-1: divide by $\sum_k s_k$.
  discriminates: [bayes-classifier, class-prior]

- id: q-u6-l1-019
  lesson: generative-vs-discriminative
  concepts: [bayes-classifier-optimality]
  type: mc
  difficulty: 3
  source: "original"
  prompt: |
    Which statement about the Bayes classifier $h^\star(x) = \argmax_k p(y = k \mid x)$ is correct?
  options:
    - { text: "Under 0/1 loss, no classifier has a lower true risk, when $p$ is the true data distribution", correct: true }
    - { text: "Any Naive Bayes model fit by maximum likelihood achieves the lowest possible error", misconception: fitted-bayes-is-optimal }
    - { text: 'It predicts $\argmax_k p(x \mid y = k)$', misconception: ignore-prior }
    - { text: "Its risk is always 0 when the classes are well modeled", misconception: bayes-error-zero }
  explanation: |
    der-6-1-2 proves optimality for the true $p$. A fitted model only approximates it, and the Bayes error $1 - \E_X[\max_k p(y = k \mid X)]$ is positive whenever the classes overlap.
  discriminates: [bayes-classifier-optimality, bayes-classifier]

- id: q-u6-l1-020
  lesson: generative-vs-discriminative
  concepts: [generative-mle-factorization]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    You fit a generative classifier with a categorical prior $p_\phi(y)$ and Bernoulli class-conditionals, then switch the class-conditionals to Gaussians and refit by maximum likelihood on the same data. What happens to $\hat\phi$?
  options:
    - { text: "It does not change: the prior's MLE depends only on the labels", correct: true }
    - { text: "It changes, because the prior and the class-conditionals are fit jointly", misconception: joint-mle-coupled }
    - { text: "It must be re-estimated by gradient descent together with the Gaussian means", misconception: joint-mle-coupled }
  explanation: |
    The log-likelihood splits into $\sum_i \log p_\phi(y^{(i)})$, which contains no class-conditional parameters, plus a class-conditional term (der-6-1-3, step 9).
  discriminates: [generative-mle-factorization, joint-model]
