  difficulty: 2
  source: "original"
  prompt: |
    Softmax regression with one weight vector and one intercept per class is fit to the 20 Newsgroups matrix ($K = 4$ classes, $|V| = 35788$ columns). How many numbers does sklearn store in `coef_` and `intercept_` together?
  answer: 143156
  tolerance: 0
  formula: "4 * (35788 + 1)"
  explanation: |
    $K|V| + K = K(|V| + 1) = 4 \times 35789 = 143{,}156$ (der-6-2-6 step 2), about 63 per training post.

- id: q-u6-l2-010
  lesson: text-as-features
  concepts: [count-features, bag-of-words]
  type: mc
  difficulty: 1
  source: "original"
  prompt: |
    A report contains the token "icu" three times. What is its entry in the "icu" column under `CountVectorizer()` (the default) and under `CountVectorizer(binary=True)`?
  options:
    - { text: "3 and 1", correct: true }
    - { text: "1 and 1", misconception: binary-equals-counts }
    - { text: "3 and 3", misconception: binary-equals-counts }
    - { text: "1 and 3" }
  explanation: |
    The default stores the count $c_j(x)$; `binary=True` stores $\min(c_j(x), 1)$ (def-6-2-3).
