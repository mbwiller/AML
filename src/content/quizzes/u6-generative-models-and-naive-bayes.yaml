    - { text: "$V$ itself, the set of words", misconception: dimension-v-vs-size }
    - { text: "The number of words in the document", misconception: dimension-v-vs-size }
    - { text: "1, as in the sklearn table on L9 p.8", misconception: dimension-v-vs-size }
