- id: q-u6-l2-015
  lesson: text-as-features
  concepts: [count-vectorizer]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Why does the companion call `.toarray()` only after setting `max_features=1000`?
  options:
    - { text: "A dense 2257 × 35788 int64 array takes about 646 MB, while 2257 × 1000 takes about 18 MB", correct: true }
    - { text: "toarray() only works on matrices with at most 1,000 columns", misconception: toarray-is-free }
    - { text: "Dense and sparse storage cost the same; max_features is only for speed", misconception: toarray-is-free }
  explanation: |
    A dense array stores every zero (der-6-2-3); a CSR matrix stores about 12 bytes per nonzero plus row pointers (der-6-2-4).

- id: q-u6-l2-016
  lesson: text-as-features
  concepts: [logistic-regression-text-baseline]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    For softmax regression on binary bag-of-words features, which rule gives the same prediction as $\argmax_k p_\theta(y = k \mid x)$?
  options:
    - { text: "The class with the largest intercept plus sum of weights over the words the document contains", correct: true }
    - { text: "The class with the largest sum of weights over all vocabulary words" }
    - { text: "The class whose weight on the document's most frequent word is largest" }
    - { text: "None: the softmax denominator must be computed before any argmax" }
  explanation: |
    The denominator is shared and the exponential is increasing, so $\hat y = \argmax_k z_k$, and with 0/1 features $z_k = b_k + \sum_{j \in W(x)} \theta_{kj}$ (der-6-2-5 steps 3 and 8).

- id: q-u6-l2-017
  lesson: text-as-features
  concepts: [text-preprocessing]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    A team classifies trial eligibility text and removes sklearn's English stop-word list before vectorizing. What can go wrong?
  options:
    - { text: "Negations such as 'no' and 'not' are removed, so 'no prior chemotherapy' and 'prior chemotherapy' become the same vector", correct: true }
    - { text: "Nothing: stop words carry no information about any label", misconception: stop-words-always-safe }
    - { text: "The vocabulary grows, because each stop word is split into characters" }
  explanation: |
    Stop-word removal is a modeling choice. Check the list against the words the label depends on and keep negations when they matter.

- id: q-u6-l2-018
  lesson: text-as-features
  concepts: [logistic-regression-text-baseline]
  type: mc
