  options:
    - { text: "No: the tokenizer is unchanged, so it looks up the raw token \"meetings\", which is not a key", correct: true }
    - { text: "Yes: assigning a stemmed vocabulary stems the documents too", misconception: vocab-assign-stems-docs }
    - { text: "Yes, but only if \"meet\" also appears in the email", misconception: vocab-assign-stems-docs }
    - { text: "It raises an error because \"meetings\" is not in the vocabulary" }
  explanation: |
    With scikit-learn's default tokenizer, `transform` tokenizes with the vectorizer's analyzer and keeps tokens found in `vocabulary_`; out-of-vocabulary tokens are silently ignored. Only tokens spelled exactly like a stem match. Stem inside the analyzer so documents and vocabulary pass through the same function.

