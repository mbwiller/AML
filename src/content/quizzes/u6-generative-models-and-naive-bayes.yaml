- id: q-u6-l4-015
  lesson: spam-exercise
  concepts: [nb-vectorized-scoring]
  type: mc
  difficulty: 2
  source: "NaiveBayes_Spam_exercise task 19"
  prompt: |
    `X` is $n \times d$ (0/1), `psis` is $K \times d$, `phis` has length $K$. Which line computes the same $n \times K$ score matrix as task 19's double loop?
  options:
    - { text: "`X @ np.log(psis).T + (1 - X) @ np.log(1 - psis).T + np.log(phis)`", correct: true }
    - { text: "`np.log(psis) @ X.T + np.log(phis)`" }
    - { text: "`X @ np.log(psis).T + np.log(phis)`" }
    - { text: "`np.log(X @ psis.T) + np.log(phis)`" }
  explanation: |
    Entry $(i, k)$ of $X(\log\Psi)^{\top}$ is $\sum_j x^{(i)}_j \log\psi_{jk}$, and the absent words need the second product with $1 - X$ (der-6-4-3 step 9). Broadcasting adds $\log\phi_k$ to column $k$. The second option has the wrong shape ($K \times n$) and drops absent words; the third drops absent words; the fourth takes the log of a sum, not a sum of logs.

