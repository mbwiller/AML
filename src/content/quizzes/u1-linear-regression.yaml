# ---------- Lesson 1.1: components-of-a-learning-problem ----------
# Poll items carry source "L2 p.<k> poll" (docs/course-map/01-lectures-L1-L3.md, L2 poll section).

- id: q-u1-l1-001
  lesson: components-of-a-learning-problem
  concepts: [one-hot-encoding, integer-codes-impose-spacing]
  type: mc
  difficulty: 1
  source: "L2 p.9 poll"
  prompt: |
    A column records each patient's zip code, one of 10040, 10041, 10042, 10043, 10044. How should you represent the 5 zip codes?
  options:
    - { text: "Convert to numerical values and use as is", misconception: integer-code-categorical }
    - { text: "Convert to numerical values and standardize", misconception: standardize-fixes-codes }
    - { text: "Represent using a binary vector of length 5 where each entry represents one zip code", correct: true }
    - { text: "Any of the above works well in practice", misconception: integer-code-categorical }
  explanation: |
    One-hot encoding (L2 p.10). A linear model on the raw code predicts $f(k+1) - f(k) = \theta_1$ for every pair of neighboring zip codes (der-1-1-1 step 3), so the predictions are equally spaced and ordered by zip code. Standardizing is an affine change of the code and keeps that constraint (step 6). One-hot gives each zip code its own parameter, $f_\theta(k) = \theta_k$.
  discriminates: [one-hot-encoding, integer-codes-impose-spacing]

- id: q-u1-l1-002
  lesson: components-of-a-learning-problem
  concepts: [feature-engineering]
  type: mc
  difficulty: 2
  source: "L2 p.13 poll"
  prompt: |
    Is it beneficial to maximize the number of input features in a machine learning model?
  options:
    - { text: "It depends on the model class: the more complex the model, the more features the better", misconception: more-features-always-better }
    - { text: "It depends on the dataset size: the larger the dataset, the more features the better", misconception: more-features-always-better }
    - { text: "It is always beneficial", misconception: more-features-always-better }
    - { text: "It is never beneficial" }
    - { text: "None of the above", correct: true }
  explanation: |
    The slides pose this as a discussion question with no stated answer; keying 'None of the above' is our reading. Each other option states a rule that fails. A feature helps when it carries signal and there are enough examples to estimate its coefficient; a noise feature still receives a coefficient fitted to training noise, however large the dataset or flexible the model. "Never" is also wrong: der-1-1-3 shows one engineered feature turning a model that cannot fit the dose-response into one that fits it exactly.

- id: q-u1-l1-003
  lesson: components-of-a-learning-problem
  concepts: [five-ml-components]
  type: mc
  difficulty: 1
  source: "original"
  prompt: |
    In the VASCO trial we predict the 8-week change in systolic blood pressure from dose and baseline pressure, consider all functions $\theta_0 + \theta_1 D + \theta_2 B$, score them by mean squared error, and pick the best with the closed-form least-squares solution. Which of the five components is "all functions $\theta_0 + \theta_1 D + \theta_2 B$"?
  options:
    - { text: "The model class", correct: true }
    - { text: "The input data" }
    - { text: "The loss function" }
    - { text: "The learning rule" }
  explanation: |
    The model class $\mathcal{M}$ is the set of candidate functions (def-1-1-1). The input data are the dose and baseline values, the loss is the mean squared error, and the learning rule is the closed-form solution of lesson 1.4.

- id: q-u1-l1-004
  lesson: components-of-a-learning-problem
  concepts: [integer-codes-impose-spacing]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    You code three categories as 1, 2, 3, standardize the code, and fit $f_\theta = \theta_0 + \theta_1 z$. Compared with fitting the unstandardized code, the set of prediction vectors $(f(1), f(2), f(3))$ the model can produce is
  options:
    - { text: "the same: still equally spaced and ordered", correct: true }
    - { text: "larger: standardizing removes the arbitrary spacing", misconception: standardize-fixes-codes }
    - { text: "smaller: standardizing loses information" }
    - { text: "unrelated: the two models have different numbers of parameters" }
  explanation: |
    $z = (c - m)/s$ is affine in $c$, so $\theta'_0 + \theta'_1 z = (\theta'_0 - \theta'_1 m/s) + (\theta'_1/s)\,c$, a member of the original class (der-1-1-1 step 6). Any $\theta_0, \theta_1$ is reached by choosing $\theta'_1 = s\theta_1$, $\theta'_0 = \theta_0 + \theta_1 m$, so the classes are equal.

- id: q-u1-l1-005
  lesson: components-of-a-learning-problem
  concepts: [dummy-variable-trap, one-hot-encoding]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    A categorical attribute with $K = 6$ categories is one-hot encoded for a linear model that also has an intercept. How many one-hot columns should the feature matrix contain?
  answer: 5
  tolerance: 0
  seeded: { K: [3, 4, 5, 6, 8] }
  formula: "K - 1"
  explanation: |
    The $K$ one-hot columns sum to the intercept column (der-1-1-1 step 11), so one of them must be dropped, leaving $K - 1$. The dropped category becomes the reference, and each remaining coefficient is that category's prediction minus the reference's (step 14).

- id: q-u1-l1-006
  lesson: components-of-a-learning-problem
  concepts: [dummy-variable-trap]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    A model has an intercept and all $K$ one-hot columns of a categorical attribute. What goes wrong?
  options:
    - { text: "Adding any $c$ to the intercept and subtracting $c$ from every category coefficient leaves all predictions unchanged, so the coefficients are not unique", correct: true }
    - { text: "Nothing: one-hot encoding always uses one column per category", misconception: all-k-columns-with-intercept }
    - { text: "The model can no longer give each category its own prediction" }
    - { text: "The predictions become equally spaced, as with an integer code", misconception: integer-code-categorical }
  explanation: |
    The one-hot columns sum to 1 for every example, which is the intercept column (der-1-1-1 steps 11 and 12). The predictions are fine; the parameters are not identified, and lesson 1.4 shows the normal equations become singular. Drop one category or drop the intercept.

- id: q-u1-l1-007
  lesson: components-of-a-learning-problem
  type: which-step
  difficulty: 1
  source: "original"
  derivation: der-1-1-1
  corrupt: { step: 2, replaceTex: 'f_\theta(k'') - f_\theta(k) = \theta_0 + \theta_1\,(c_{k''} - c_k)', explanation: 'Both predictions contain $\theta_0$, so it cancels in the difference. Keeping it would make the gap between two categories depend on the intercept, and two copies of the same category ($k'' = k$) would differ by $\theta_0$ instead of 0.' }

- id: q-u1-l1-008
  lesson: components-of-a-learning-problem
  concepts: [discretization]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    Toy numbers: a lab value is discretized into low, normal, and high, and a linear model with one coefficient per bin (no intercept) is fit by least squares. The three training patients in the "high" bin have targets 120, 150, and 210. What is $\hat\theta_{\text{high}}$?
  answer: 160
  tolerance: 0.01
  formula: "(120 + 150 + 210) / 3"
  explanation: |
    Least squares on a step-function feature map sets each coefficient to the mean target of its bin (der-1-1-2 step 12): $(120 + 150 + 210)/3 = 160$. Patients in the other bins do not affect it, because only bin-high terms of the MSE contain $\theta_{\text{high}}$ (step 9).

- id: q-u1-l1-009
  lesson: components-of-a-learning-problem
  type: which-step
  difficulty: 2
  source: "original"
  derivation: der-1-1-2
  corrupt: { step: 12, replaceTex: '\hat\theta_b = \frac{1}{n}\sum_{i \in S_b} y^{(i)}', explanation: 'Step 11 has $n_b\theta_b$, the number of examples in bin $b$ times $\theta_b$, so we divide by $n_b$, not by the total $n$. Dividing by $n$ shrinks every bin mean toward 0 by the factor $n_b/n$.' }

- id: q-u1-l1-010
  lesson: components-of-a-learning-problem
  concepts: [discretization]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Which is the best reason to replace a raw red-blood-cell count by the flags low, normal, and high?
  options:
    - { text: "Different labs process blood differently, so the same raw count can mean different things, while each lab's flag is comparable across labs", correct: true }
    - { text: "Binning removes noise without losing any information", misconception: discretization-lossless }
    - { text: "A linear model cannot use a continuous feature" }
    - { text: "Fewer distinct values always means a better model", misconception: discretization-lossless }
  explanation: |
    This is the L2 p.11 argument. Binning does lose information: values in the same bin get the same prediction (der-1-1-2 step 6). It pays off when the raw scale is not comparable or the relation is a threshold or U-shape (step 5).

- id: q-u1-l1-011
  lesson: components-of-a-learning-problem
  concepts: [feature-engineering, linear-in-parameters]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    With the engineered feature $\phi(D) = (1, D/(6 + D))$ and $\theta = (-3, -22)$, what does the model predict, in mmHg, for a dose of $D = 12$ mg? Give two decimals.
  answer: -17.67
  tolerance: 0.01
  formula: "-3 - 22 * 12 / (6 + 12)"
  explanation: |
    $f_\theta(12) = -3 - 22 \cdot 12/18 = -3 - 14.67 = -17.67$ (der-1-1-3 step 7). The effect relative to placebo, $-14.67$, is less than twice the effect at 6 mg, $-11$: doubling the dose does not double the effect, which no line in raw $D$ can reproduce (step 9).

- id: q-u1-l1-012
  lesson: components-of-a-learning-problem
  concepts: [linear-in-parameters]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Which model is NOT linear in its parameters $\theta$?
  options:
    - { text: "$\\theta_0 + \\theta_1\\,D/(\\theta_2 + D)$", correct: true }
    - { text: "$\\theta_0 + \\theta_1 \\log(1 + D)$", misconception: linear-means-straight-line }
    - { text: "$\\theta_0 + \\theta_1 x + \\theta_2 x^2$", misconception: linear-means-straight-line }
    - { text: "$\\theta_0 + \\theta_1 a + \\theta_2 s + \\theta_3\\,a\\,s$", misconception: linear-means-straight-line }
  explanation: |
    $f_\theta = \theta^\top\phi(x)$ is linear in $\theta$ for any fixed $\phi$ (der-1-1-3 step 2), however curved $\phi$ is in $x$. In the first model $\theta_2$ sits inside the feature, so doubling $\theta$ does not double $f$; it needs iterative fitting instead of the closed form of lesson 1.4.

- id: q-u1-l1-013
  lesson: components-of-a-learning-problem
  type: which-step
  difficulty: 1
  source: "original"
  derivation: der-1-1-3
  corrupt: { step: 12, replaceTex: 'f_\theta(a{=}1, s) - f_\theta(a{=}0, s) = \theta_1', explanation: 'The product term $\theta_3\,a\,s$ equals $\theta_3 s$ when $a = 1$ and 0 when $a = 0$, so it survives the subtraction. Dropping it erases the reason for engineering the interaction: the effect of $a$ would no longer depend on $s$.' }

- id: q-u1-l1-014
  lesson: components-of-a-learning-problem
  concepts: [feature-engineering, interaction-feature]
  type: code-trace
  difficulty: 1
  source: "L2 p.12 (companion notebook cell 6)"
  prompt: |
    Row 0 of the diabetes data has `age = 0.038076` and `sex = 0.050680`. What does this line store in row 0's `old_man`?
    ```python
    diabetes_X['old_man'] = (diabetes_X['sex'] > 0) & (diabetes_X['age'] > 0.05)
    ```
  options:
    - { text: "`False`", correct: true }
    - { text: "`True`", misconception: scaled-units-as-raw }
    - { text: "`0.038076`" }
    - { text: "An error, because `&` needs Python's `and`" }
  explanation: |
    `sex > 0` is `True` but `age > 0.05` is `False` ($0.038 \lt 0.05$), and `&` is elementwise "and" on Boolean columns, the product of two indicators. The notebook output shows `False` for row 0; only row 2 (age 0.085299) is `True` among the first five.

- id: q-u1-l1-015
  lesson: components-of-a-learning-problem
  concepts: [integer-codes-impose-spacing, dummy-variable-trap]
  type: order
  difficulty: 2
  source: "original"
  prompt: |
    Put the moves of der-1-1-1 in order.
  items:
    - 'Evaluate the linear model at the numeric code: $f_\theta(k) = \theta_0 + \theta_1 c_k$.'
    - 'Subtract two predictions: the gap is $\theta_1(c_{k''} - c_k)$, so consecutive codes give equal steps.'
    - 'Show that standardizing the code is absorbed into $\theta_0$ and $\theta_1$.'
    - 'One-hot encode and show $f_\theta(k) = \theta_k$, one free parameter per category.'
    - 'Note that the one-hot columns sum to 1, the intercept column, so coefficients are not unique.'
    - 'Drop a reference category and solve for $\theta_k = f_\theta(k) - f_\theta(1)$.'
  explanation: |
    Constrain first (numeric code, then standardized code), free with one-hot, then repair the redundancy that one-hot plus an intercept creates.

- id: q-u1-l1-016
  lesson: components-of-a-learning-problem
  concepts: [diabetes-dataset]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    In the scikit-learn diabetes data, the condition `age > 0.05` selects patients whose age is
  options:
    - { text: "more than about one standard deviation above the mean age", correct: true }
    - { text: "more than 0.05 years", misconception: scaled-units-as-raw }
    - { text: "in the oldest 5% of the cohort", misconception: scaled-units-as-raw }
    - { text: "above 50 years" , misconception: scaled-units-as-raw }
  explanation: |
    Each column is centered and divided by its standard deviation times $\sqrt{n}$, with $n = 442$. A scaled age of $0.05$ is $0.05\sqrt{442} \approx 1.05$ standard deviations above the mean (the lesson's worked example).

