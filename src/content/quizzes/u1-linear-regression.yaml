- id: q-u1-l2-015
  lesson: datasets-models-and-model-classes
  concepts: [linear-uniform-effects, linear-model]
  type: predict
  difficulty: 1
  source: "original"
  prompt: |
    A linear model for the VASCO trial predicts the change in systolic blood pressure as $f_\theta(D) = -5 - 0.4\,D$ mmHg, with dose $D$ in mg. Predict the change in the prediction from 0 to 10 mg, and from 10 to 20 mg.
  options:
    - { text: '$-4$ mmHg for both steps', correct: true }
    - { text: '$-4$ mmHg, then a smaller drop, because the drug''s effect saturates' }
    - { text: '$-9$ mmHg, then $-4$ mmHg' }
    - { text: 'Cannot be predicted without the data' }
  explanation: |
    Uniform effects (der-1-2-2 step 7): a step of 10 mg changes the prediction by $10\,\theta_1 = -4$ at every starting dose. The true Emax curve does saturate (the lesson's second worked example), but a straight line cannot; that mismatch is a property of the model class.
  discriminates: [linear-uniform-effects]

- id: q-u1-l2-016
  lesson: datasets-models-and-model-classes
  concepts: [linear-monotonicity]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Income rises and then falls with age (L2 p.25). A linear model uses the features $\text{age}$ and $\text{age}^2$: $f_\theta = \theta_0 + \theta_1\,\text{age} + \theta_2\,\text{age}^2$. Which statement is correct?
  options:
    - { text: 'With $\theta_2 < 0 < \theta_1$, the prediction can rise and then fall in age; the model is still linear in $\theta$ and in its features', correct: true }
    - { text: 'Impossible: monotonicity forces the prediction to move in one direction as age grows', misconception: bias-applies-to-attributes }
    - { text: 'Possible, but only because the model is no longer a linear model' }
    - { text: 'Possible only if $\theta_1 = 0$' }
  explanation: |
    Monotonicity (der-1-2-4) holds along each feature with the other features fixed. Age and $\text{age}^2$ cannot be moved independently, so the prediction as a function of age is a parabola, $\theta_0 + \theta_1\,\text{age} + \theta_2\,\text{age}^2$, which peaks at $\text{age} = -\theta_1 / (2\theta_2)$ when $\theta_2 < 0 < \theta_1$. A feature map changes what the biases constrain.
  discriminates: [linear-monotonicity]

- id: q-u1-l2-017
  lesson: datasets-models-and-model-classes
  concepts: [linear-uniform-effects]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    A linear model of VASCO blood-pressure change has $\theta_{\text{dose}} = -0.4$ per mg and $\theta_{\text{baseline}} = 0.15$ per mmHg. You refit with dose recorded in grams instead of milligrams. What happens?
  options:
    - { text: '$\theta_{\text{dose}}$ becomes $-400$ per gram and every prediction stays the same', correct: true }
    - { text: '$\theta_{\text{dose}}$ stays $-0.4$, so dose is still the more important feature', misconception: coefficient-size-is-importance }
    - { text: '$\theta_{\text{dose}}$ becomes $-0.0004$ per gram' }
    - { text: 'The predictions shrink by a factor of 1,000' }
  explanation: |
    $\theta_j$ is the change in prediction per unit of feature $j$ (der-1-2-2 step 7). One gram is 1,000 mg, so the per-gram effect is $1000 \times (-0.4) = -400$. The product $\theta_{\text{dose}} \cdot D$ is unchanged, so are the predictions. Coefficient sizes say nothing about importance until the features share a scale.
  discriminates: [linear-uniform-effects]
