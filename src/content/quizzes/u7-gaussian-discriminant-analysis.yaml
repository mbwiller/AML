    True or false: GDA is the equivalent of Naive Bayes but for continuous data.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    The intended key is True, in spirit: both are generative classifiers that fit class-conditionals and a prior by closed-form MLE and predict with Bayes' rule. The caveat from the course map: strictly, GDA with a full $\Sigma_k$ does not assume conditional independence of the features. Only a diagonal $\Sigma_k$ makes the Gaussian factorize (der-7-3-5), and that special case is Gaussian Naive Bayes.
  discriminates: [gaussian-naive-bayes, gda-model]

- id: q-u7-l3-011
  lesson: shared-covariance-and-logistic-regression
  concepts: [gaussian-naive-bayes]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Which Gaussian class-conditional makes the Naive Bayes assumption, $p(x \mid y = k) = \prod_j p(x_j \mid y = k)$?
  options:
    - { text: 'A diagonal covariance $\Sigma_k$ for each class', correct: true }
    - { text: 'A full covariance $\Sigma_k$ for each class, as in the slides'' GDA', misconception: full-gda-cond-indep }
    - { text: 'One full covariance $\Sigma$ shared by all classes', misconception: full-gda-cond-indep }
    - { text: 'Any Gaussian, because every multivariate Gaussian factorizes over its coordinates', misconception: full-gda-cond-indep }
  explanation: |
    der-7-3-5: with $\Sigma_k$ diagonal the quadratic form has no cross terms (step 3), so the density splits into one 1-D Gaussian per feature (step 6). A full covariance, shared or not, keeps the off-diagonal entries that couple the features within a class.
  discriminates: [gaussian-naive-bayes, conditional-independence]

- id: q-u7-l3-012
  lesson: shared-covariance-and-logistic-regression
  concepts: [gda-linear-boundary]
  type: which-step
  difficulty: 2
  source: "original"
  derivation: der-7-3-1
  corrupt: { step: 7, replaceTex: '\log\frac{p(y = 1 \mid x)}{p(y = 0 \mid x)} = -x^\top\Sigma^{-1}x + (\mu_1 - \mu_0)^\top\Sigma^{-1}x - \tfrac12\mu_1^\top\Sigma^{-1}\mu_1 + \tfrac12\mu_0^\top\Sigma^{-1}\mu_0 + \log\frac{\phi_1}{\phi_0}', explanation: 'In step 6 the two $x^\top\Sigma^{-1}x$ terms carry $-\tfrac12$ and $+\tfrac12$. They cancel; they do not add up to $-x^\top\Sigma^{-1}x$. The surviving log-odds are affine.' }

- id: q-u7-l3-013
  lesson: shared-covariance-and-logistic-regression
  concepts: [gda-vs-logistic-regression]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    You fit shared-covariance GDA and logistic regression on the same training set. Both produce a posterior of the form $\sigma(w^\top x + b)$. What can you say about the fitted $(\hat w, \hat b)$?
  options:
    - { text: 'They generally differ: GDA maximizes the joint likelihood, logistic regression the conditional likelihood of the labels', correct: true }
    - { text: 'They are identical, because the functional form is the same', misconception: gda-lr-same-theta }
    - { text: 'They are identical whenever the classes are balanced', misconception: gda-lr-same-theta }
    - { text: 'GDA''s fit always has the higher conditional log-likelihood on the training set', misconception: gda-always-better }
  explanation: |
    der-7-3-6: the joint log-likelihood is the conditional term plus $\sum_i\log p_\theta(x^{(i)})$. Logistic regression maximizes the conditional term alone over all $(w, b)$, so on the training set $\ell_{\mathrm{cond}}(\hat w_{\mathrm{LR}}, \hat b_{\mathrm{LR}}) \ge \ell_{\mathrm{cond}}(\hat w_{\mathrm{GDA}}, \hat b_{\mathrm{GDA}})$ (step 6). GDA trades some of that term for a better fit of $p(x)$.
  discriminates: [gda-vs-logistic-regression, gda-sigmoid-posterior]

- id: q-u7-l3-014
  lesson: shared-covariance-and-logistic-regression
  concepts: [gda-vs-logistic-regression]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    The class-conditionals of a feature are strongly skewed (far from Gaussian), and you have plenty of labeled data. Which classifier is the safer choice for $p(y \mid x)$?
  options:
    - { text: 'Logistic regression: it assumes only the sigmoid form, which many non-Gaussian generative models also produce', correct: true }
    - { text: 'Shared-covariance GDA: it uses more information, so it always does at least as well', misconception: gda-always-better }
    - { text: 'They are equivalent, since both give a sigmoid posterior', misconception: gda-lr-same-theta }
    - { text: 'Shared-covariance GDA, because its MLE is in closed form' }
  explanation: |
    GDA's extra information is correct only if the class-conditionals really are Gaussian with a shared covariance. When they are not, GDA's $w = \hat\Sigma^{-1}(\hat\mu_1 - \hat\mu_0)$ comes from a wrong model, while logistic regression still targets the best sigmoid. GDA tends to win with little data and a plausible Gaussian model; a closed-form fit is a convenience, not an accuracy guarantee.
  discriminates: [gda-vs-logistic-regression, discriminative-model]

- id: q-u7-l3-015
  lesson: shared-covariance-and-logistic-regression
  concepts: [pooled-covariance-mle]
  type: which-step
  difficulty: 2
  source: "original"
  derivation: der-7-3-3
  corrupt: { step: 12, replaceTex: '\hat\Sigma = \frac{S}{n} = \frac{1}{n}\sum_{i=1}^{n}(x^{(i)} - \bar x)(x^{(i)} - \bar x)^\top, \quad \bar x = \frac{1}{n}\sum_{i=1}^{n} x^{(i)}', explanation: 'Step 6 defined the residuals from each example''s own class mean, $r^{(i)} = x^{(i)} - \hat\mu_{y^{(i)}}$, so $S = \sum_i r^{(i)}r^{(i)\top}$. Centering at the overall mean $\bar x$ adds the between-class spread and inflates $\hat\Sigma$ along $\hat\mu_1 - \hat\mu_0$.' }

- id: q-u7-l3-016
  lesson: shared-covariance-and-logistic-regression
  concepts: [gda-linear-boundary, gda-sigmoid-posterior]
  type: order
  difficulty: 2
  source: "original"
  prompt: |
    Put the moves of the argument that shared-covariance GDA has a logistic posterior in order.
  items:
    - 'Write the posterior odds with Bayes'' rule; the evidence $p(x)$ cancels.'
    - 'Take logs and substitute the log Gaussian density for each class; the normalizers cancel because $\Sigma$ is shared.'
    - 'Expand both quadratic forms $(x - \mu_k)^\top\Sigma^{-1}(x - \mu_k)$.'
    - 'Cancel the two $x^\top\Sigma^{-1}x$ terms.'
    - 'Name $w = \Sigma^{-1}(\mu_1 - \mu_0)$ and collect the constants into $b$.'
    - 'Exponentiate and solve for $p(y = 1 \mid x) = \sigma(w^\top x + b)$.'
  explanation: |
    der-7-3-1 steps 1–10 give affine log-odds; der-7-3-2 turns affine log-odds into a sigmoid. The cancellation of the quadratic terms is the step that needs the shared covariance a second time.
