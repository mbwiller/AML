- id: q-u7-l2-007
  lesson: gaussian-discriminant-analysis
  concepts: [gda-mle-covariance]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    Toy numbers, one feature ($d = 1$): class $k$ has $n_k = 5$ training examples, and the sum of their squared deviations from the class mean is $\sum_{i:\,y^{(i)} = k}(x^{(i)} - \hat\mu_k)^2 = 20$. What is the GDA maximum-likelihood estimate $\hat\Sigma_k = \hat\sigma_k^2$?
  answer: 4
  tolerance: 0.005
  seeded: { n_k: [4, 5, 8, 10], SS: [12, 20, 40] }
  formula: "SS / n_k"
  explanation: |
    In one dimension $S_k$ is the sum of squared deviations, and $\hat\Sigma_k = S_k/n_k = 20/5 = 4$ (der-7-2-5 step 11). The unbiased estimate $20/4 = 5$ is not the MLE.

- id: q-u7-l2-008
  lesson: gaussian-discriminant-analysis
  concepts: [gda-mle-covariance]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    Toy numbers: class $k$ has three training points in $\mathbb{R}^2$: $(0, 0)$, $(2, 2)$, and $(1, 4)$. Compute the off-diagonal entry $(\hat\Sigma_k)_{12}$ of the GDA maximum-likelihood covariance. Give three decimals.
  answer: 0.667
  tolerance: 0.002
  formula: "((-1)*(-2) + 1*0 + 0*2) / 3"
  explanation: |
    $\hat\mu_k = (1, 2)$. Residuals: $(-1, -2)$, $(1, 0)$, $(0, 2)$. The products of their two coordinates are $2$, $0$, $0$, summing to $2$; divide by $n_k = 3$: $(\hat\Sigma_k)_{12} = 2/3 \approx 0.667$ (der-7-2-5 step 11). The full estimate is $\hat\Sigma_k = \begin{bmatrix} 2/3 & 2/3 \\ 2/3 & 8/3 \end{bmatrix}$. Three points in $d = 2$ is just enough: $n_k = d + 1$.

- id: q-u7-l2-009
  lesson: gaussian-discriminant-analysis
