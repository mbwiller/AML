- id: q-u7-l1-014
  lesson: multivariate-gaussian-and-covariance
  concepts: [mvn-density]
  type: order
  difficulty: 2
  source: "original"
  prompt: |
    Put the moves of the change-of-variables derivation of the multivariate Gaussian density (der-7-1-3) in order.
  items:
    - 'Write the density of $z \sim \mathcal{N}(0, I)$, a product of $d$ standard normals.'
    - 'Build the symmetric square root $\Sigma^{1/2} = V\Lambda^{1/2}V^\top$ from the eigendecomposition.'
    - 'Set $x = \mu + \Sigma^{1/2}z$ and invert it: $z = \Sigma^{-1/2}(x - \mu)$.'
    - 'Check that $\E[x] = \mu$ and $\Cov(x) = \Sigma$.'
    - 'Apply the change-of-variables rule with Jacobian $\Sigma^{-1/2}$.'
    - 'Simplify $|\det\Sigma^{-1/2}| = |\Sigma|^{-1/2}$ and $z^\top z = (x - \mu)^\top\Sigma^{-1}(x - \mu)$.'
    - 'Check that $d = 1$ gives $\mathcal{N}(\mu, \sigma^2)$.'
  explanation: |
    Build $x$ from standard normals, confirm that the parameters mean what their names say, transform the density, simplify the determinant and the exponent, and check the one-dimensional case against L9 p.43.

- id: q-u7-l1-015
  lesson: multivariate-gaussian-and-covariance
  concepts: [mvn-density, covariance-ellipse-geometry]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Under $\mathcal{N}(0, \Sigma)$ with $\Sigma = \diag(100, 1)$, which point has the higher density: $a = (5, 0)$ or $b = (0, 5)$?
  options:
    - { text: '$a = (5, 0)$: its squared Mahalanobis distance is $0.25$, against $25$ for $b$', correct: true }
    - { text: '$b = (0, 5)$: it lies along the direction of smaller variance', misconception: sigma-not-inverted }
    - { text: "Equal: both are 5 units from the mean" }
    - { text: "It depends on the normalizing constant" }
  explanation: |
    The exponent uses $\Sigma^{-1} = \diag(0.01, 1)$: $a$ gives $25 \times 0.01 = 0.25$ and $b$ gives $25 \times 1 = 25$. Five units is half a standard deviation along $x_1$ but five standard deviations along $x_2$. The normalizer is the same for both points, so it cannot change the comparison.

- id: q-u7-l1-016
  lesson: multivariate-gaussian-and-covariance
  concepts: [covariance-ellipse-geometry]
  type: mc
  difficulty: 3
  source: "original"
  prompt: |
    The contours of $\mathcal{N}\Big(0, \begin{bmatrix} 9 & 2 \\ 2 & 1 \end{bmatrix}\Big)$ are ellipses. Their long axis is closest to which direction?
  options:
    - { text: "A shallow upward slope of about 0.24, nearly horizontal", correct: true }
    - { text: "Exactly along $y = x$, because the covariance is positive", misconception: cov-sets-slope }
    - { text: "A slope of 2, the covariance", misconception: cov-sets-slope }
    - { text: "Nearly vertical" }
  explanation: |
    The eigenvalues are $5 \pm \sqrt{20} \approx 9.47$ and $0.53$. For $\lambda_1 \approx 9.47$, the first row of $(\Sigma - \lambda_1 I)v = 0$ gives $-0.47\,v_1 + 2v_2 = 0$, so $v \propto (0.973, 0.230)$: slope $\approx 0.24$. The positive covariance tilts the axis upward, and the much larger variance of $x_1$ keeps it close to horizontal. Only with equal variances is the tilt exactly $45°$.

- id: q-u7-l1-017
  lesson: multivariate-gaussian-and-covariance
  concepts: [covariance-matrix-properties]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    A vector $x = (x_1, x_2)$ has covariance $\Sigma = \begin{bmatrix} 4 & 3 \\ 3 & 4 \end{bmatrix}$. Compute $\Var(x_1 + x_2)$.
  answer: 14
  tolerance: 0
  seeded: { a: [4, 5, 6], b: [1, 2, 3] }
  formula: "2 * a + 2 * b"
  explanation: |
    With $v = (1, 1)$, $\Var(v^\top x) = v^\top \Sigma v$ (der-7-1-1 step 11) adds all four entries: $a + b + b + a = 2a + 2b$. Equivalently, $\Var(x_1) + \Var(x_2) + 2\Cov(x_1, x_2)$.

- id: q-u7-l1-018
  lesson: multivariate-gaussian-and-covariance
  concepts: [mvn-density]
  type: mc
  difficulty: 1
  source: "original"
  prompt: |
    For $x \sim \mathcal{N}(\mu, \Sigma)$ with $\Sigma = \diag(\sigma_1^2, \sigma_2^2)$, the density $\mathcal{N}(x; \mu, \Sigma)$ equals
  options:
    - { text: '$\mathcal{N}(x_1; \mu_1, \sigma_1^2)\,\mathcal{N}(x_2; \mu_2, \sigma_2^2)$', correct: true }
    - { text: '$\mathcal{N}(x_1; \mu_1, \sigma_1^2) + \mathcal{N}(x_2; \mu_2, \sigma_2^2)$' }
    - { text: '$\mathcal{N}(x_1 + x_2; \mu_1 + \mu_2, \sigma_1^2 + \sigma_2^2)$' }
    - { text: '$\mathcal{N}(x_1; \mu_1, \sigma_1)\,\mathcal{N}(x_2; \mu_2, \sigma_2)$', misconception: gaussian-second-arg-sd }
  explanation: |
    With a diagonal $\Sigma$, $|\Sigma| = \sigma_1^2\sigma_2^2$ and the quadratic form has no cross term, so the density is the product of the two univariate densities (der-7-1-2), each with a variance as its second argument.

# ---------- Lesson 7.2: gaussian-discriminant-analysis ----------
# Poll items: L10 p.21 (a)-(c). Poll (d) belongs to lesson 7.3, which discusses it.

- id: q-u7-l2-001
  lesson: gaussian-discriminant-analysis
  concepts: [gda-model]
  type: mc
  difficulty: 1
  source: "L10 p.21 poll"
  prompt: |
    True or false: in classification, a GMM assumes that the conditional distribution of the features given the label is Gaussian.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    The professor's key is True. Each class-conditional is one mixture component, $x \mid y = k \sim \mathcal{N}(\mu_k, \Sigma_k)$ (def-7-2-2). The marginal $p(x)$ is then a mixture of Gaussians (der-7-1-6), and is generally not itself Gaussian.
  discriminates: [gda-model, gaussian-mixture]

- id: q-u7-l2-002
  lesson: gaussian-discriminant-analysis
  concepts: [gda-model, gda-mle-mean, gda-mle-covariance]
  type: mc
  difficulty: 1
  source: "L10 p.21 poll"
  prompt: |
    True or false: when a GMM is used for classification, the number of mixture components equals the number of label classes, and the best-fit parameters are found by maximum likelihood in closed form.
  options:
    - { text: "True", correct: true }
    - { text: "False" }
  explanation: |
    The professor's key is True. One component per class (L10 p.11), and because the labels say which component produced each point, the log-likelihood splits by class (der-7-2-2) and each piece has a closed-form maximizer: class proportions, class means, class covariances (thm-7-2-1). Fitting a mixture *without* labels is the problem that needs EM.

- id: q-u7-l2-003
  lesson: gaussian-discriminant-analysis
  concepts: [gda-log-likelihood-decomposition]
  type: mc
  difficulty: 1
  source: "L10 p.17 (slide notation)"
  prompt: |
    L10 p.17 says "the optimal $\phi_K$ is the proportion of data points with class $k$." What does $\phi_K$ mean here?
  options:
    - { text: "The prior of class $k$, $\\phi_k = P(y = k)$; the capital subscript is a typo", correct: true }
    - { text: "The prior of the last class, $K$", misconception: phi-capital-k }
    - { text: "The sum of all the priors, which equals $K$", misconception: phi-capital-k }
    - { text: "The mean of class $k$", misconception: u-for-mu }
  explanation: |
    Read $\phi_K$ as $\phi_k$. Its MLE is $\hat\phi_k = n_k/n$ (der-7-2-3). Taken literally, $\phi_K$ is one number, the last class's prior, and could not equal every class's proportion.

- id: q-u7-l2-004
  lesson: gaussian-discriminant-analysis
  concepts: [gda-log-likelihood-decomposition]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Why can $\mu_2$ and $\Sigma_2$ be fit using only the class-2 training examples?
  options:
    - { text: "In the joint log-likelihood, $\\mu_2$ and $\\Sigma_2$ appear only in the sum over examples with $y^{(i)} = 2$; every other term is constant in them", correct: true }
    - { text: "Because the features are conditionally independent given the class", misconception: class-split-reason }
    - { text: "Because the classes are assumed to have the same covariance", misconception: class-split-reason }
    - { text: "It is an approximation that ignores how class 2 overlaps the other classes" }
  explanation: |
    der-7-2-2 steps 4–6: regroup the class-conditional sum by label; $\mu_k, \Sigma_k$ live only in $\ell_k$. This is exact and needs no independence between features, which full-covariance GDA does not assume. It does need the labels: without them every point would involve every component.

- id: q-u7-l2-005
  lesson: gaussian-discriminant-analysis
  concepts: [gda-mle-mean]
  type: mc
  difficulty: 1
  source: "original"
  prompt: |
    The maximum-likelihood estimate of the class-$k$ mean in GDA is
  options:
    - { text: "$\\frac{1}{n_k}\\sum_{i:\\,y^{(i)} = k} x^{(i)}$", correct: true }
    - { text: "$\\frac{1}{n}\\sum_{i:\\,y^{(i)} = k} x^{(i)}$", misconception: mean-divide-by-n }
    - { text: "$\\frac{1}{n}\\sum_{i=1}^{n} x^{(i)}$, the overall mean", misconception: mean-divide-by-n }
    - { text: "$\\Sigma_k^{-1}\\frac{1}{n_k}\\sum_{i:\\,y^{(i)} = k} x^{(i)}$, whitened by the covariance" }
  explanation: |
    der-7-2-4: the gradient is $\Sigma_k^{-1}\sum_{i:\,y^{(i)} = k}(x^{(i)} - \mu_k)$; setting it to zero and multiplying by $\Sigma_k$ removes the covariance entirely, leaving the class average. Dividing by $n$ instead of $n_k$ shrinks it by the factor $\hat\phi_k$.

