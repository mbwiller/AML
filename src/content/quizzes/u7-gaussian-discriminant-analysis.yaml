- id: q-u7-l2-020
  lesson: gaussian-discriminant-analysis
  concepts: [gda-prediction]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    With a separate covariance $\Sigma_k$ per class, as on L10 p.15, what shape is the GDA decision boundary between two classes, in general?
  options:
    - { text: "A quadric (in 2-D an ellipse, parabola, or hyperbola), because the quadratic terms $-\\tfrac12 x^\\top\\Sigma_k^{-1}x$ differ between the classes", correct: true }
    - { text: "A hyperplane, as in logistic regression", misconception: gda-is-linear }
    - { text: "A hyperplane through the midpoint of the two means", misconception: gda-is-linear }
    - { text: "It has no closed form and must be traced numerically" }
  explanation: |
    The boundary is $\delta_0(x) = \delta_1(x)$, and each score is quadratic in $x$ (der-7-2-7). The quadratic parts cancel only when $\Sigma_0 = \Sigma_1$, which is lesson 7.3's shared-covariance case (der-7-3-4).

- id: q-u7-l2-021
  lesson: gaussian-discriminant-analysis
  concepts: [gda-model]
