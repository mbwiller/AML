  corrupt: { step: 11, replaceTex: '\hat\Sigma_k = \frac{S_k}{n_k - 1}', explanation: "Step 10 says $n_k\\Sigma_k = S_k$, so the stationary point is $S_k/n_k$. Dividing by $n_k - 1$ gives the unbiased estimator of der-7-2-8 step 10, which is a different estimator, not the solution of this first-order condition." }

- id: q-u7-l2-010
  lesson: gaussian-discriminant-analysis
  concepts: [gda-mle-covariance]
  type: order
  difficulty: 2
  source: "original"
  prompt: |
    Put the moves of the derivation of $\hat\Sigma_k$ in order.
  items:
    - 'Substitute $\hat\mu_k$ and keep the terms of $\ell_k$ that involve $\Sigma_k$.'
    - 'Write each quadratic form as a trace and cycle it: $r^\top\Sigma_k^{-1}r = \mathrm{tr}(\Sigma_k^{-1}rr^\top)$.'
    - 'Move the sum inside the trace: $\mathrm{tr}(\Sigma_k^{-1}S_k)$.'
    - 'Differentiate with $\nabla\log|\Sigma| = \Sigma^{-1}$ and $\nabla\,\mathrm{tr}(\Sigma^{-1}S) = -\Sigma^{-1}S\Sigma^{-1}$, and set the gradient to zero.'
    - 'Multiply by $\Sigma_k$ on both sides and solve: $\hat\Sigma_k = S_k/n_k$.'
    - 'Compare any $\Sigma$ with $\hat\Sigma_k$ through the eigenvalues of $\Sigma^{-1}\hat\Sigma_k$ to prove a global maximum.'
  explanation: |
    der-7-2-5 (profile out the mean, trace trick, differentiate, solve), then der-7-2-6 (global maximum via $\log\lambda \le \lambda - 1$).

- id: q-u7-l2-011
  lesson: gaussian-discriminant-analysis
  concepts: [gda-prediction]
  type: mc
  difficulty: 1
  source: "L10 p.21 poll"
  prompt: |
    True or false: to predict with a GDA model we apply Bayes' rule, choosing the class $y$ that maximizes $P_\theta(\mathbf{x} \mid y)\,P_\theta(y)$.
  options:
    - { text: "True", correct: true }
    - { text: "False", misconception: ignore-prior }
  explanation: |
    The professor's key is True. This is the Bayes classifier of lesson 6.1 with Gaussian class-conditionals; in logs it is $\hat y = \argmax_k \delta_k(x)$ (der-7-2-7). The prior $P_\theta(y)$ stays in: dropping it would ignore that one class may be much rarer.

- id: q-u7-l2-012
  lesson: gaussian-discriminant-analysis
  concepts: [gda-prediction]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    In the GDA score $\log\phi_k - \tfrac{d}{2}\log 2\pi - \tfrac12\log|\Sigma_k| - \tfrac12(x - \mu_k)^\top\Sigma_k^{-1}(x - \mu_k)$, which terms can be dropped without changing $\argmax_k$?
  options:
    - { text: "Only $-\\tfrac{d}{2}\\log 2\\pi$", correct: true }
    - { text: "$-\\tfrac{d}{2}\\log 2\\pi$ and $-\\tfrac12\\log|\\Sigma_k|$, since both are normalizing constants", misconception: drop-logdet }
    - { text: "$-\\tfrac{d}{2}\\log 2\\pi$ and $\\log\\phi_k$, since neither depends on $x$", misconception: ignore-prior }
    - { text: "None: every term depends on $k$", misconception: drop-logdet }
  explanation: |
    A term can go only if it is the same for every class. $-\tfrac{d}{2}\log 2\pi$ is; $\log|\Sigma_k|$ and $\log\phi_k$ are constant in $x$ but differ across $k$ (der-7-2-7 step 4). With a shared covariance, $\log|\Sigma|$ would also cancel (lesson 7.3).

- id: q-u7-l2-013
  lesson: gaussian-discriminant-analysis
  concepts: [gda-covariance-bias]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    Toy setting, one feature: class $k$ is drawn from a Gaussian with true variance $\sigma_k^2 = 4$, and the training set always contains $n_k = 5$ class-$k$ examples. What is the expected value of the GDA maximum-likelihood variance $\hat\sigma_k^2$?
  answer: 3.2
  tolerance: 0.005
  seeded: { n_k: [2, 5, 10, 20], s2: [1, 4, 9] }
  formula: "(n_k - 1) / n_k * s2"
  explanation: |
    $\E[\hat\Sigma_k] = \frac{n_k - 1}{n_k}\Sigma_k = \frac{4}{5} \times 4 = 3.2$ (der-7-2-8 step 9). Measuring spread around the fitted mean loses the spread of the mean itself.

- id: q-u7-l2-014
  lesson: gaussian-discriminant-analysis
  type: which-step
  difficulty: 3
  source: "original"
  derivation: der-7-2-8
  corrupt: { step: 7, replaceTex: '\E\big[(\bar x - \mu)(\bar x - \mu)^\top\big] = \Sigma', explanation: "Only the $m$ terms with $i = l$ survive, and each carries the factor $1/m^2$, so the covariance of the mean is $\\Sigma/m$. With $\\Sigma$ here, step 8 would give $\\E[S_k] = m\\Sigma - m\\Sigma = 0$, an absurd result for a sum of outer products." }

- id: q-u7-l2-015
  lesson: gaussian-discriminant-analysis
  concepts: [gda-covariance-singularity]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Toy setting: a rare class has $n_k = 4$ training examples in $d = 6$ features. What can you say about $\hat\Sigma_k$?
  options:
    - { text: "Its rank is at most 3, so it is singular and the class's Gaussian density cannot be evaluated", correct: true }
    - { text: "Its rank is at most 4, so it is invertible if the four points are in general position", misconception: class-cov-singular }
    - { text: "It is invertible but has a large bias factor $3/4$, which can be corrected by dividing by $n_k - 1$", misconception: class-cov-singular }
    - { text: "It is singular, but the maximum-likelihood fit is still well defined", misconception: class-cov-singular }
  explanation: |
    The residuals sum to zero, so they span at most $n_k - 1 = 3$ dimensions, and $\mathrm{rank}\,\hat\Sigma_k \le 3 < 6$ (der-7-2-9 steps 1–4). Dividing by $n_k - 1$ rescales but cannot raise the rank. The likelihood is unbounded (steps 7–8), so no MLE exists; share, diagonalize, or shrink the covariance.

- id: q-u7-l2-016
  lesson: gaussian-discriminant-analysis
  concepts: [gda-model]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    Toy setting: GDA with a separate full covariance per class, $K = 2$ classes, $d = 2$ features. How many free parameters does the model have, counting the prior? (A symmetric $d \times d$ matrix has $d(d+1)/2$ free entries.)
  answer: 11
  tolerance: 0
  seeded: { K: [2, 3, 4], d: [2, 5, 10] }
  formula: "K * d + K * d * (d + 1) / 2 + K - 1"
  explanation: |
    Means: $Kd = 4$. Covariances: $K\,d(d+1)/2 = 6$. Prior: $K - 1 = 1$, because the priors sum to 1. Total $11$. The covariance count grows like $d^2$, which is why lesson 7.3's shared and diagonal variants matter.

- id: q-u7-l2-017
  lesson: gaussian-discriminant-analysis
  concepts: [gda-mle-covariance]
  type: mc
  difficulty: 2
  source: "L10 p.15 (slide wording)"
  prompt: |
    L10 p.15 says GDA fits $\mu_k, \Sigma_k$ "to be empirical means and variances of each label class". What exactly is the maximum-likelihood $\hat\Sigma_k$?
  options:
    - { text: "The full class-$k$ covariance matrix, including off-diagonal covariances, divided by $n_k$", correct: true }
    - { text: "A diagonal matrix of the class-$k$ variances of each feature", misconception: gda-variances-only }
    - { text: "The full class-$k$ covariance matrix divided by $n_k - 1$, because the MLE is unbiased", misconception: mle-always-unbiased }
    - { text: "The covariance of all $n$ training points around the overall mean", misconception: mean-divide-by-n }
  explanation: |
    der-7-2-5 gives $\hat\Sigma_k = \frac{1}{n_k}\sum_{i:\,y^{(i)} = k}(x^{(i)} - \hat\mu_k)(x^{(i)} - \hat\mu_k)^\top$, as L10 p.20 states. A diagonal $\Sigma_k$ is Gaussian Naive Bayes (lesson 7.3), and the $n_k - 1$ version is the unbiased estimator, not the MLE (der-7-2-8).

- id: q-u7-l2-018
  lesson: gaussian-discriminant-analysis
  concepts: [gda-mle-mean, gda-mle-covariance]
  type: mc
  difficulty: 3
  source: "original"
  prompt: |
    You accidentally duplicate every class-$k$ training example, so class $k$ now has $2n_k$ examples (every other class is unchanged). What happens to $\hat\mu_k$ and $\hat\Sigma_k$?
  options:
    - { text: "Both are unchanged; only $\\hat\\phi_k$ changes", correct: true }
    - { text: "$\\hat\\mu_k$ is unchanged and $\\hat\\Sigma_k$ halves, because it divides by twice as many examples", misconception: mean-divide-by-n }
    - { text: "$\\hat\\mu_k$ is unchanged and $\\hat\\Sigma_k$ doubles, because the scatter matrix doubles", misconception: mean-divide-by-n }
    - { text: "Both change, because the class now has more evidence", misconception: mle-always-unbiased }
  explanation: |
    The class sum and $S_k$ both double, and so does the divisor $n_k$, so $\hat\mu_k$ and $\hat\Sigma_k = S_k/n_k$ are unchanged. The prior $\hat\phi_k = n_k/n$ does change, because class $k$'s share of the data grows. (The unbiased $S_k/(n_k - 1)$ would change slightly, which is one sign that it is not the MLE.)

