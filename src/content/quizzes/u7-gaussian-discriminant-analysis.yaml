- id: q-u7-l2-022
  lesson: gaussian-discriminant-analysis
  concepts: [gda-log-likelihood-decomposition]
  type: mc
  difficulty: 2
  source: "L10 p.17 (slide wording)"
  prompt: |
    L10 p.17 says the optimization of the priors $\phi_k$ "can be carried out independently for each label class". Which statement is accurate?
  options:
    - { text: 'The $\phi_k$ are coupled by $\sum_k\phi_k = 1$ and are solved jointly; the solution $\hat\phi_k = n_k/n$ happens to depend only on $n_k$ and $n$', correct: true }
    - { text: 'Each $\phi_k$ can be maximized on its own, because $n_k\log\phi_k$ involves only $\phi_k$', misconception: prior-independent-fit }
    - { text: 'Each $\phi_k$ is fit from the class-$k$ examples alone, exactly like $\mu_k$ and $\Sigma_k$', misconception: prior-independent-fit }
    - { text: 'The priors cannot be estimated by maximum likelihood and must be set by hand' }
  explanation: |
    Maximized one at a time, each term $n_k\log\phi_k$ would push its $\phi_k$ to 1. The simplex constraint ties the priors together, and the Lagrange multiplier of der-7-2-3 (der-6-3-5) solves for all of them at once. The means and covariances, by contrast, do separate by class (der-7-2-2 step 6).

# ---------- Lesson 7.3: shared-covariance-and-logistic-regression ----------
# Poll item: L10 p.21 (d), with the course map's key and caveat.

- id: q-u7-l3-001
  lesson: shared-covariance-and-logistic-regression
  concepts: [shared-covariance-gda, gda-model, gaussian-naive-bayes]
  type: mc
  difficulty: 1
  source: "original"
  prompt: |
    Which covariance assumption defines linear discriminant analysis (LDA)?
  options:
    - { text: 'One full covariance $\Sigma$ shared by all classes', correct: true }
    - { text: 'A full covariance $\Sigma_k$ for each class' }
    - { text: 'A diagonal covariance $\Sigma_k$ for each class' }
    - { text: 'No covariance at all: LDA models word counts with Dirichlet distributions', misconception: lda-latent-dirichlet }
  explanation: |
    LDA is GDA with $x \mid y = k \sim \mathcal{N}(\mu_k, \Sigma)$ for every $k$ (def-7-3-1). A full $\Sigma_k$ per class is QDA, the slides' GDA (def-7-2-2); a diagonal $\Sigma_k$ per class is Gaussian Naive Bayes (def-7-3-3). Dirichlet distributions belong to latent Dirichlet allocation, an unrelated topic model.
  discriminates: [shared-covariance-gda, gda-model, gaussian-naive-bayes]

- id: q-u7-l3-002
  lesson: shared-covariance-and-logistic-regression
  concepts: [shared-covariance-gda]
  type: mc
  difficulty: 1
  source: "original"
  prompt: |
    You want to fit this lesson's LDA in sklearn. Which class do you use?
  options:
    - { text: '`sklearn.discriminant_analysis.LinearDiscriminantAnalysis`', correct: true }
    - { text: '`sklearn.decomposition.LatentDirichletAllocation`', misconception: lda-latent-dirichlet }
    - { text: '`sklearn.discriminant_analysis.QuadraticDiscriminantAnalysis`' }
    - { text: '`sklearn.naive_bayes.GaussianNB`', misconception: full-gda-cond-indep }
  explanation: |
    `LinearDiscriminantAnalysis` fits Gaussian class-conditionals with one shared covariance. `LatentDirichletAllocation` is an unsupervised topic model that happens to share the acronym. `QuadraticDiscriminantAnalysis` fits a covariance per class (QDA), and `GaussianNB` a diagonal covariance per class.

- id: q-u7-l3-003
  lesson: shared-covariance-and-logistic-regression
  concepts: [gda-linear-boundary]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    In der-7-3-1, why are the GDA log-odds affine in $x$ when the covariance is shared?
  options:
    - { text: 'Each class contributes $-\tfrac12 x^\top\Sigma^{-1}x$ with the same $\Sigma$, so the quadratic terms cancel in the difference', correct: true }
    - { text: 'Because $\Sigma^{-1}$ is symmetric, every quadratic form $x^\top\Sigma^{-1}x$ is zero' }
    - { text: 'Because the prior term $\log(\phi_1/\phi_0)$ is linear in $x$' }
    - { text: 'Because the features are assumed independent given the class', misconception: full-gda-cond-indep }
  explanation: |
    Step 7 of der-7-3-1: the $x^\top\Sigma^{-1}x$ terms enter with $-\tfrac12$ and $+\tfrac12$ and cancel; what is left is linear in $x$ plus a constant. Symmetry of $\Sigma^{-1}$ is used only to merge the cross terms (step 5). No independence is assumed: $\Sigma$ can be any full covariance.
  discriminates: [gda-linear-boundary, qda-quadratic-boundary]

- id: q-u7-l3-004
  lesson: shared-covariance-and-logistic-regression
  concepts: [gda-linear-boundary]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    Toy numbers. Two features, shared covariance $\Sigma = \begin{pmatrix} 1 & \rho \\ \rho & 1 \end{pmatrix}$ with $\rho = 0.8$, and means $\mu_0 = (0, 0)$, $\mu_1 = (1, 0)$: the classes differ only in feature 1. Compute the LDA weight on feature 2, $w_2$, where $w = \Sigma^{-1}(\mu_1 - \mu_0)$. Give two decimals.
  answer: -2.22
  tolerance: 0.01
  seeded: { rho: [0.2, 0.5, 0.6, 0.8] }
  formula: "-rho / (1 - rho**2)"
  explanation: |
    $\Sigma^{-1} = \frac{1}{1 - \rho^2}\begin{pmatrix} 1 & -\rho \\ -\rho & 1 \end{pmatrix}$, so $w = \Sigma^{-1}(1, 0)^\top = \frac{1}{1 - \rho^2}(1, -\rho)$ and $w_2 = -0.8/0.36 \approx -2.22$. Feature 2 has no mean difference, yet it gets a large negative weight: it measures the noise that feature 1 shares with it, and subtracting it cleans up feature 1. This is why $w$ is not $\mu_1 - \mu_0$.

- id: q-u7-l3-005
  lesson: shared-covariance-and-logistic-regression
  concepts: [gda-linear-boundary, gda-sigmoid-posterior]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    Toy numbers. One feature, shared variance $\sigma^2 = 1$, means $\mu_0 = 0$ and $\mu_1 = 2$, and log prior ratio $\log(\phi_1/\phi_0) = -1.386$. Where is the LDA decision boundary $x^\star$ (the point where $p(y = 1 \mid x) = \tfrac12$)? Give two decimals.
  answer: 1.69
  tolerance: 0.01
  seeded: { mu1: [1, 2, 3], sigma2: [0.5, 1, 2], lp: [-2.197, -1.386, 0, 1.386] }
  formula: "mu1 / 2 - sigma2 * lp / mu1"
  explanation: |
    In one dimension, with $\mu_0 = 0$, der-7-3-1 gives $w = \mu_1/\sigma^2$ and $b = -\frac{\mu_1^2}{2\sigma^2} + \log\frac{\phi_1}{\phi_0}$. The boundary is $w x + b = 0$ (der-7-3-2 step 5), so $x^\star = \frac{\mu_1}{2} - \frac{\sigma^2\log(\phi_1/\phi_0)}{\mu_1}$. For example, with $\mu_1 = 2$, $\sigma^2 = 1$, and log prior ratio $-1.386$: $w = 2$, $b = -2 - 1.386 = -3.386$, and $x^\star \approx 1.69$. The first term is the midpoint of the means. A negative log prior ratio (class 1 rarer) pushes the boundary toward $\mu_1$, a positive one toward $\mu_0$, and equal priors leave it at the midpoint.

- id: q-u7-l3-006
  lesson: shared-covariance-and-logistic-regression
  concepts: [pooled-covariance-mle]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    In the pooled-covariance MLE $\hat\Sigma = \frac{1}{n}\sum_i r^{(i)} r^{(i)\top}$, what is the residual $r^{(i)}$?
  options:
    - { text: '$x^{(i)} - \hat\mu_{y^{(i)}}$, the deviation from the mean of its own class', correct: true }
    - { text: '$x^{(i)} - \bar x$, the deviation from the mean of all examples', misconception: pooled-cov-global-mean }
    - { text: '$\hat\mu_1 - \hat\mu_0$ for every example', misconception: pooled-cov-global-mean }
    - { text: '$x^{(i)} - \hat\mu_{1 - y^{(i)}}$, the deviation from the other class mean' }
  explanation: |
    der-7-3-3 step 6 defines $r^{(i)} = x^{(i)} - \hat\mu_{y^{(i)}}$, because each example's Gaussian is centered at its own class mean. Centering at the overall mean adds the between-class spread along $\hat\mu_1 - \hat\mu_0$, inflating $\hat\Sigma$ in exactly the direction that separates the classes.
  discriminates: [pooled-covariance-mle, covariance-matrix]

- id: q-u7-l3-007
  lesson: shared-covariance-and-logistic-regression
  concepts: [pooled-covariance-mle]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    Toy numbers, one feature. Class 0 has $n_0 = 30$ examples with MLE variance $\hat\sigma_0^2 = 1.0$; class 1 has $n_1 = 10$ examples with $\hat\sigma_1^2 = 3.0$. What is the pooled MLE variance $\hat\sigma^2$?
  answer: 1.5
  tolerance: 0.005
  seeded: { n0: [20, 30, 60], n1: [10, 20, 40], s0: [0.5, 1.0, 2.0], s1: [1.0, 3.0, 4.0] }
  formula: "(n0 * s0 + n1 * s1) / (n0 + n1)"
  explanation: |
    der-7-3-3 step 13: $\hat\sigma^2 = \sum_k \frac{n_k}{n}\hat\sigma_k^2 = \frac{n_0\hat\sigma_0^2 + n_1\hat\sigma_1^2}{n_0 + n_1}$, an average weighted by the class proportions. For example, with $n_0 = 30$, $\hat\sigma_0^2 = 1.0$, $n_1 = 10$, $\hat\sigma_1^2 = 3.0$: $(30 \times 1.0 + 10 \times 3.0)/40 = 1.5$, while the plain average would be 2.0. The plain average $\tfrac12(\hat\sigma_0^2 + \hat\sigma_1^2)$ agrees with the MLE only when $n_0 = n_1$.

- id: q-u7-l3-008
  lesson: shared-covariance-and-logistic-regression
  concepts: [qda-quadratic-boundary]
  type: which-step
  difficulty: 2
  source: "original"
  derivation: der-7-3-4
  corrupt: { step: 2, replaceTex: '= -\tfrac12(x - \mu_1)^\top\Sigma_1^{-1}(x - \mu_1) + \tfrac12(x - \mu_0)^\top\Sigma_0^{-1}(x - \mu_0) + \log\frac{\phi_1}{\phi_0}', explanation: 'The $-\tfrac{d}{2}\log 2\pi$ terms cancel, but $-\tfrac12\log|\Sigma_1|$ and $-\tfrac12\log|\Sigma_0|$ differ when the covariances differ; they leave $-\tfrac12\log(|\Sigma_1|/|\Sigma_0|)$ in the constant $c$.' }

- id: q-u7-l3-009
  lesson: shared-covariance-and-logistic-regression
  concepts: [pooled-covariance-mle, gda-covariance-singularity]
  type: mc
  difficulty: 3
  source: "original"
  prompt: |
    Toy setting: $d = 50$ features, a rare class with $n_0 = 40$ examples and a common class with $n_1 = 500$. Which statement about the covariance estimates is true?
  options:
    - { text: '$\hat\Sigma_0$ is singular (rank at most 39), so QDA cannot invert it, but the pooled $\hat\Sigma$ can reach full rank 50, since $n - K = 538 \ge d$, and LDA can be fit', correct: true }
    - { text: 'Both can be inverted: a sample covariance matrix is always invertible', misconception: pooled-cov-singular }
    - { text: 'The pooled $\hat\Sigma$ is singular too, because it contains $\hat\Sigma_0$ as one of its terms' }
    - { text: 'Neither is a problem as long as $n = 540 > d$', misconception: pooled-cov-singular }
  explanation: |
    A per-class $\hat\Sigma_k$ is built from $n_k$ residuals that sum to zero, so its rank is at most $n_k - 1 = 39 < 50$: singular. The pooled $S$ adds the 500 class-1 residuals; its rank is at most $\min(d, n - K) = \min(50, 538) = 50$, and with continuous data it reaches 50, so LDA works where QDA fails. With $d > n - K$ even the pooled estimate is singular; then use shrinkage or a diagonal covariance.

