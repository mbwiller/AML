# ---------- Lesson 7.1: multivariate-gaussian-and-covariance ----------
# L9 pp.41-46 and L10 pp.6-14 contain no Poll Everywhere questions, so every item here is original.
# The quartet matrices are our choice, not slide numbers.

- id: q-u7-l1-001
  lesson: multivariate-gaussian-and-covariance
  concepts: [covariance-quartet]
  type: mc
  difficulty: 1
  source: "original (L10 p.14 quartet; matrices are our choice)"
  prompt: |
    Match the matrix to the cloud. A scatter of samples from $\mathcal{N}(0, \Sigma)$ is elongated along the line $y = -x$: as $x_1$ goes up, $x_2$ tends to go down. Which $\Sigma$ produced it?
  options:
    - { text: '$\begin{bmatrix} 4 & -3 \\ -3 & 4 \end{bmatrix}$', correct: true }
    - { text: '$\begin{bmatrix} 4 & 3 \\ 3 & 4 \end{bmatrix}$' }
    - { text: '$\begin{bmatrix} 4 & 0 \\ 0 & 1 \end{bmatrix}$' }
    - { text: '$\begin{bmatrix} 1 & 0 \\ 0 & 4 \end{bmatrix}$' }
  explanation: |
    A negative off-diagonal entry means negative covariance, so the long axis tilts down. With equal variances the eigenvector of the larger eigenvalue, 7, is $\tfrac{1}{\sqrt2}(1, -1)$ (der-7-1-5 step 7). The positive-covariance matrix gives the mirror image along $y = x$; the diagonal ones give axis-aligned ellipses.
  discriminates: [covariance-quartet, covariance-ellipse-geometry]

- id: q-u7-l1-002
  lesson: multivariate-gaussian-and-covariance
  concepts: [covariance-quartet]
  type: mc
  difficulty: 1
  source: "original (L10 p.14 quartet; matrices are our choice)"
  prompt: |
    Match the matrix to the cloud. The bottom-right panel of L10 p.14 is an axis-aligned cloud that is taller than it is wide. Which $\Sigma$ fits it?
  options:
    - { text: '$\begin{bmatrix} 1 & 0 \\ 0 & 4 \end{bmatrix}$', correct: true }
    - { text: '$\begin{bmatrix} 4 & 0 \\ 0 & 1 \end{bmatrix}$' }
    - { text: '$\begin{bmatrix} 4 & 3 \\ 3 & 4 \end{bmatrix}$' }
    - { text: '$\begin{bmatrix} 1 & 0 \\ 0 & 1 \end{bmatrix}$' }
  explanation: |
    No tilt means zero covariance, so $\Sigma$ is diagonal. Taller than wide means $\Var(x_2) > \Var(x_1)$: the entry 4 belongs in the bottom-right. Its contours have semi-axes $r$ along $x$ and $2r$ along $y$ (der-7-1-5 step 10). $\diag(4, 1)$ is the same ellipse lying on its side, and the identity gives circles.

- id: q-u7-l1-003
  lesson: multivariate-gaussian-and-covariance
  concepts: [covariance-ellipse-geometry]
  type: numeric
  difficulty: 1
  source: "original"
  prompt: |
    Compute the determinant of $\Sigma = \begin{bmatrix} 5 & 3 \\ 3 & 5 \end{bmatrix}$.
  answer: 16
  tolerance: 0
  seeded: { a: [4, 5, 6, 7], b: [1, 2, 3] }
  formula: "a * a - b * b"
  explanation: |
    For $\begin{bmatrix} a & b \\ b & a \end{bmatrix}$ the determinant is $a^2 - b^2$. It equals the product of the eigenvalues $a + b$ and $a - b$, and it sets both the normalizer $|\Sigma|^{1/2}$ of the density and the area $\pi r^2 |\Sigma|^{1/2}$ inside a contour (der-7-1-4 step 10).

- id: q-u7-l1-004
  lesson: multivariate-gaussian-and-covariance
  concepts: [covariance-ellipse-geometry, covariance-quartet]
  type: numeric
  difficulty: 2
  source: "original"
  prompt: |
    Find the largest eigenvalue of $\Sigma = \begin{bmatrix} 6 & 2 \\ 2 & 6 \end{bmatrix}$.
  answer: 8
  tolerance: 0
  seeded: { a: [4, 5, 6, 7], b: [1, 2, 3] }
  formula: "a + b"
  explanation: |
    The characteristic equation is $(a - \lambda)^2 - b^2 = 0$, so $\lambda = a \pm b$ (der-7-1-5 steps 1–3): $a + b$ along $\tfrac{1}{\sqrt2}(1, 1)$ and $a - b$ along $\tfrac{1}{\sqrt2}(1, -1)$; with $b > 0$ the largest is $a + b$. Check: the eigenvalues sum to the trace $2a$ and multiply to the determinant $a^2 - b^2$.

- id: q-u7-l1-005
  lesson: multivariate-gaussian-and-covariance
  concepts: [covariance-ellipse-geometry]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    For $\Sigma = \begin{bmatrix} 4 & 3 \\ 3 & 4 \end{bmatrix}$, what are the semi-axes of the contour $(x - \mu)^\top \Sigma^{-1}(x - \mu) = 1$?
  options:
    - { text: '$\sqrt7$ along $y = x$ and $1$ along $y = -x$', correct: true }
    - { text: '$2$ along $x$ and $2$ along $y$: a circle', misconception: axes-from-diagonal }
    - { text: '$7$ along $y = x$ and $1$ along $y = -x$', misconception: halflength-is-eigenvalue }
    - { text: '$\sqrt7$ along $x$ and $1$ along $y$' }
  explanation: |
    The eigenvalues are 7 and 1 with eigenvectors $\tfrac{1}{\sqrt2}(1, \pm 1)$ (der-7-1-5), and the semi-axes are $r\sqrt{\lambda_j}$ along the eigenvectors (der-7-1-4 step 7). Reading $\sqrt4 = 2$ off the diagonal ignores the covariance; using $\lambda$ instead of $\sqrt\lambda$ confuses a variance with a length.
  discriminates: [covariance-ellipse-geometry, covariance-matrix-properties]

- id: q-u7-l1-006
  lesson: multivariate-gaussian-and-covariance
  concepts: [covariance-matrix-properties]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Can $\begin{bmatrix} 1 & 2 \\ 2 & 1 \end{bmatrix}$ be the covariance matrix of a random vector $(x_1, x_2)$?
  options:
    - { text: 'No: it would give $x_1 - x_2$ a negative variance', correct: true }
    - { text: "Yes: it is symmetric and its diagonal entries are positive", misconception: any-symmetric-is-covariance }
    - { text: 'Yes: covariances can be any real number, so any off-diagonal value is allowed', misconception: any-symmetric-is-covariance }
    - { text: "No: covariance matrices must be diagonal" }
  explanation: |
    By der-7-1-1 step 11, $\Var(v^\top x) = v^\top \Sigma v$. With $v = (1, -1)$ this is $1 - 2 - 2 + 1 = -2 < 0$, impossible for a variance. Equivalently, the eigenvalues are $3$ and $-1$, or $|\rho| = 2 > 1$. Covariance matrices need not be diagonal ($\Sigma_A$ is not), but they must be positive semi-definite.

- id: q-u7-l1-007
  lesson: multivariate-gaussian-and-covariance
  concepts: [mvn-density]
  type: mc
  difficulty: 1
  source: "original (L10 p.9 labels)"
  prompt: |
    L10 p.9 labels one mixture component $N(2, 2)$. Reading the second argument as we always do, what is that component's standard deviation?
  options:
    - { text: '$\sqrt2 \approx 1.41$', correct: true }
    - { text: "2", misconception: gaussian-second-arg-sd }
    - { text: "4" }
    - { text: "1" }
  explanation: |
    We write $\mathcal{N}(\mu, \sigma^2)$ with a variance second, as L9 p.44 does with $N(x; \mu_k, \sigma_k^2)$. So $\sigma^2 = 2$ and $\sigma = \sqrt2$. The slide itself does not say which convention its labels use; if they were standard deviations, the variance would be 4.

- id: q-u7-l1-008
  lesson: multivariate-gaussian-and-covariance
  concepts: [gaussian-mixture]
  type: mc
  difficulty: 1
  source: "original (L9 p.44 wording)"
  prompt: |
    In the mixture $p(x) = \sum_k \pi_k\,\mathcal{N}(x; \mu_k, \sigma_k^2)$, what is the weight $\pi_k$ (the slides' $P(k)$)?
  options:
    - { text: "The probability that a point is drawn from component $k$, before the point is observed", correct: true }
    - { text: "The likelihood of component $k$ given the observed point", misconception: mixture-weight-is-likelihood }
    - { text: 'The height of component $k$ at its mean' }
    - { text: 'The probability that a particular observed $x$ came from component $k$', misconception: mixture-weight-is-likelihood }
  explanation: |
    $\pi_k$ is a prior: in a generative classifier it is $P(Y = k) = \phi_k$ (der-7-1-6). The probability that an observed $x$ came from component $k$ is the posterior $\pi_k\,\mathcal{N}(x; \mu_k, \sigma_k^2)/p(x)$, which depends on $x$. L9 p.44 calls the weights "likelihood", which is not the statistical meaning of that word.
  discriminates: [gaussian-mixture, class-prior]

- id: q-u7-l1-009
  lesson: multivariate-gaussian-and-covariance
  concepts: [gaussian-mixture]
  type: mc
  difficulty: 2
  source: "original"
  prompt: |
    Is the density $p(x) = \tfrac12\,\mathcal{N}(x; -2, 1) + \tfrac12\,\mathcal{N}(x; 2, 1)$ a Gaussian density?
  options:
    - { text: "No: it has two peaks, at about $-2$ and $2$", correct: true }
    - { text: 'Yes: a sum of Gaussians is Gaussian, here $\mathcal{N}(0, 0.5)$', misconception: mixture-sum-of-rvs }
    - { text: 'Yes: $\mathcal{N}(0, 2)$, adding the variances' , misconception: mixture-sum-of-rvs }
    - { text: "No: it does not integrate to 1" }
  explanation: |
    A mixture adds densities, not random variables. Each half contributes a bump, and the bumps are 4 standard deviations apart, so $p$ is bimodal. It integrates to $\tfrac12 + \tfrac12 = 1$ (der-7-1-6 step 4). $\mathcal{N}(0, 0.5)$ is the distribution of $\tfrac12 X_1 + \tfrac12 X_2$ for independent $X_1, X_2$: a different object.

- id: q-u7-l1-010
  lesson: multivariate-gaussian-and-covariance
  concepts: [covariance-matrix-properties, mvn-density]
  type: mc
  difficulty: 3
  source: "original"
  prompt: |
    Let $x_1 \sim \mathcal{N}(0, 1)$ and $x_2 = x_1^2$. Then $\Cov(x_1, x_2) = \E[x_1^3] - \E[x_1]\E[x_1^2] = 0$. Which statement is correct?
  options:
    - { text: '$x_1$ and $x_2$ are uncorrelated but not independent; the vector $(x_1, x_2)$ is not jointly Gaussian', correct: true }
    - { text: '$x_1$ and $x_2$ are independent, because their covariance is zero', misconception: uncorrelated-implies-independent }
    - { text: '$(x_1, x_2)$ is Gaussian with $\Sigma = \diag(1, 2)$, so its density factorizes', misconception: uncorrelated-implies-independent }
    - { text: 'The covariance cannot be zero, because $x_2$ is a function of $x_1$' }
  explanation: |
    Knowing $x_1$ fixes $x_2$, so they are dependent, yet the covariance is zero. Zero covariance implies independence only for a jointly Gaussian vector, where a diagonal $\Sigma$ makes the density a product (der-7-1-2). Here $x_2 \ge 0$ always, so it is not Gaussian at all.

